ait fait pécher Israël."],[19,"Pul, roi d’Assyrie, vint dans le pays; et Menahem donna à Pul mille talents d’argent, pour qu’il l’aidât à affermir la royauté entre ses mains."],[20,"Menahem leva cet argent sur tous ceux d’Israël qui avaient de la richesse, afin de le donner au roi d’Assyrie; il les taxa chacun à cinquante sicles d’argent. Le roi d’Assyrie s’en retourna, et ne s’arrêta pas alors dans le pays."]],"2 Rois 15:19-20":[[19,"Pul, roi d’Assyrie, vint dans le pays; et Menahem donna à Pul mille talents d’argent, pour qu’il l’aidât à affermir la royauté entre ses mains."],[20,"Menahem leva cet argent sur tous ceux d’Israël qui avaient de la richesse, afin de le donner au roi d’Assyrie; il les taxa chacun à cinquante sicles d’argent. Le roi d’Assyrie s’en retourna, et ne s’arrêta pas alors dans le pays."]],"2 Rois 15:23-25":[[23,"La cinquantième année d’Azaria, roi de Juda, Pekachia, fils de Menahem, régna sur Israël à Samarie. Il régna deux ans."],[24,"Il fit ce qui est mal aux yeux de l’Éternel; il ne se détourna point des péchés de Jéroboam, fils de Nebath, qui avait fait pécher Israël."],[25,"Pékach, fils de Remalia, son officier, conspira contre lui; il le frappa à Samarie, dans le palais de la maison du roi, de même qu’Argob et Arié; il avait avec lui cinquante hommes d’entre les fils des Galaadites. Il fit ainsi mourir Pekachia, et il régna à sa place."]],"2 Rois 15:25":[[25,"Pékach, fils de Remalia, son officier, conspira contre lui; il le frappa à Samarie, dans le palais de la maison du roi, de même qu’Argob et Arié; il avait avec lui cinquante hommes d’entre les fils des Galaadites. Il fit ainsi mourir Pekachia, et il régna à sa place."]],"2 Rois 15:27-29":[[27,"La cinquante-deuxième année d’Azaria, roi de Juda, Pékach, fils de Remalia, régna sur Israël à Samarie. Il régna vingt ans."],[28,"Il fit ce qui est mal aux yeux de l’Éternel; il ne se détourna point des péchés de Jéroboam, fils de Nebath, qui avait fait pécher Israël."],[29,"Du temps de Pékach, roi d’Israël, Tiglath-Piléser, roi d’Assyrie, vint et prit Ijjon, Abel-Beth-Maaca, Janoach, Kédesch, Hatsor, Galaad et la Galilée, tout le pays de Nephthali, et il emmena captifs les habitants en Assyrie."]],"Ésaïe 7:1":[[1,"Il arriva, du temps d’Achaz, fils de Jotham, fils d’Ozias, roi de Juda, que Retsin, roi de Syrie, monta avec Pékach, fils de Remalia, roi d’Israël, contre Jérusalem, pour l’assiéger; mais il ne put l’assiéger."]],"2 Rois 15:29":[[29,"Du temps de Pékach, roi d’Israël, Tiglath-Piléser, roi d’Assyrie, vint et prit Ijjon, Abel-Beth-Maaca, Janoach, Kédesch, Hatsor, Galaad et la Galilée, tout le pays de Nephthali, et il emmena captifs les habitants en Assyrie."]],"2 Rois 17:1-6":[[1,"La douzième année d’Achaz, roi de Juda, Osée, fils d’Éla, régna sur Israël à Samarie. Il régna neuf ans."],[2,"Il fit ce qui est mal aux yeux de l’Éternel, non pas toutefois comme les rois d’Israël qui avaient été avant lui."],[3,"Salmanasar, roi d’Assyrie, monta contre lui; et Osée lui fut assujetti, et lui paya un tribut."],[4,"Mais le roi d’Assyrie découvrit une conspiration chez Osée, qui avait envoyé des messagers à So, roi d’Égypte, et qui ne payait plus annuellement le tribut au roi d’Assyrie. Le roi d’Assyrie le fit enfermer et enchaîner dans une prison."],[5,"Et le roi d’Assyrie parcourut tout le pays, et monta contre Samarie, qu’il assiégea pendant trois ans."],[6,"La neuvième année d’Osée, le roi d’Assyrie prit Samarie, et emmena Israël captif en Assyrie. Il les fit habiter à Chalach, et sur le Chabor, fleuve de Gozan, et dans les villes des Mèdes."]],"2 Rois 17:5-6":[[5,"Et le roi d’Assyrie parcourut tout le pays, et monta contre Samarie, qu’il assiégea pendant trois ans."],[6,"La neuvième année d’Osée, le roi d’Assyrie prit Samarie, et emmena Israël captif en Assyrie. Il les fit habiter à Chalach, et sur le Chabor, fleuve de Gozan, et dans les villes des Mèdes."]],"2 Samuel 7:12-16":[[12,"Quand tes jours seront accomplis et que tu seras couché avec tes pères, j’élèverai ta postérité après toi, celui qui sera sorti de tes entrailles, et j’affermirai son règne."],[13,"Ce sera lui qui bâtira une maison à mon nom, et j’affermirai pour toujours le trône de son royaume."],[14,"Je serai pour lui un père, et il sera pour moi un fils. S’il fait le mal, je le châtierai avec la verge des hommes et avec les coups des enfants des hommes;"],[15,"mais ma grâce ne se retirera point de lui, comme je l’ai retirée de Saül, que j’ai rejeté devant toi."],[16,"Ta maison et ton règne seront pour toujours assurés, ton trône sera pour toujours affermi."]],"2 Samuel 12:7":[[7,"Et Nathan dit à David: Tu es cet homme-là! Ainsi parle l’Éternel, le Dieu d’Israël: Je t’ai oint pour roi sur Israël, et je t’ai délivré de la main de Saül;"]],"1 Rois 17:1":[[1,"Élie, le Thischbite, l’un des habitants de Galaad, dit à Achab: L’Éternel est vivant, le Dieu d’Israël, dont je suis le serviteur! il n’y aura ces années-ci ni rosée ni pluie, sinon à ma parole."]],"1 Rois 18:39":[[39,"Quand tout le peuple vit cela, ils tombèrent sur leur visage et dirent: C’est l’Éternel qui est Dieu! C’est l’Éternel qui est Dieu!"]],"1 Rois 19:12":[[12,"Et après le tremblement de terre, un feu: l’Éternel n’était pas dans le feu. Et après le feu, un murmure doux et léger."]],"2 Rois 2:11":[[11,"Comme ils continuaient à marcher en parlant, voici, un char de feu et des chevaux de feu les séparèrent l’un de l’autre, et Élie monta au ciel dans un tourbillon."]],"1 Rois 18:36-39":[[36,"Au moment de la présentation de l’offrande, Élie, le prophète, s’avança et dit: Éternel, Dieu d’Abraham, d’Isaac et d’Israël! Que l’on sache aujourd’hui que tu es Dieu en Israël, que je suis ton serviteur, et que j’ai fait toutes ces choses par ta parole!"],[37,"Réponds-moi, Éternel, réponds-moi, afin que ce peuple reconnaisse que c’est toi, Éternel, qui es Dieu, et que c’est toi qui ramènes leur cœur!"],[38,"Et le feu de l’Éternel tomba, et il consuma l’holocauste, le bois, les pierres et la terre, et il absorba l’eau qui était dans le fossé."],[39,"Quand tout le peuple vit cela, ils tombèrent sur leur visage et dirent: C’est l’Éternel qui est Dieu! C’est l’Éternel qui est Dieu!"]],"1 Rois 19:11-13":[[11,"L’Éternel dit: Sors, et tiens-toi dans la montagne devant l’Éternel! Et voici, l’Éternel passa. Et devant l’Éternel, il y eut un vent fort et violent qui déchirait les montagnes et brisait les rochers: l’Éternel n’était pas dans le vent. Et après le vent, ce fut un tremblement de terre: l’Éternel n’était pas dans le tremblement de terre."],[12,"Et après le tremblement de terre, un feu: l’Éternel n’était pas dans le feu. Et après le feu, un murmure doux et léger."],[13,"Quand Élie l’entendit, il s’enveloppa le visage de son manteau, il sortit et se tint à l’entrée de la caverne. Et voici, une voix lui fit entendre ces paroles: Que fais-tu ici, Élie?"]],"2 Rois 2:9":[[9,"Lorsqu’ils eurent passé, Élie dit à Élisée: Demande ce que tu veux que je fasse pour toi, avant que je sois enlevé d’avec toi. Élisée répondit: Qu’il y ait sur moi, je te prie, une double portion de ton esprit!"]],"2 Rois 13:20-21":[[20,"Élisée mourut, et on l’enterra. L’année suivante, des troupes de Moabites pénétrèrent dans le pays."],[21,"Et comme on enterrait un homme, voici, on aperçut une de ces troupes, et l’on jeta l’homme dans le sépulcre d’Élisée. L’homme alla toucher les os d’Élisée, et il reprit vie et se leva sur ses pieds."]],"2 Rois 2:9-15":[[9,"Lorsqu’ils eurent passé, Élie dit à Élisée: Demande ce que tu veux que je fasse pour toi, avant que je sois enlevé d’avec toi. Élisée répondit: Qu’il y ait sur moi, je te prie, une double portion de ton esprit!"],[10,"Élie dit: Tu demandes une chose difficile. Mais si tu me vois pendant que je serai enlevé d’avec toi, cela t’arrivera ainsi; sinon, cela n’arrivera pas."],[11,"Comme ils continuaient à marcher en parlant, voici, un char de feu et des chevaux de feu les séparèrent l’un de l’autre, et Élie monta au ciel dans un tourbillon."],[12,"Élisée regardait et criait: Mon père! Mon père! Char d’Israël et sa cavalerie! Et il ne le vit plus. Saisissant alors ses vêtements, il les déchira en deux morceaux,"],[13,"et il releva le manteau qu’Élie avait laissé tomber. Puis il retourna, et s’arrêta au bord du Jourdain;"],[14,"il prit le manteau qu’Élie avait laissé tomber, et il en frappa les eaux, et dit: Où est l’Éternel, le Dieu d’Élie? Lui aussi, il frappa les eaux, qui se partagèrent çà et là, et Élisée passa."],[15,"Les fils des prophètes qui étaient à Jéricho, vis-à-vis, l’ayant vu, dirent: L’esprit d’Élie repose sur Élisée! Et ils allèrent à sa rencontre, et se prosternèrent contre terre devant lui."]],"2 Rois 5:14":[[14,"Il descendit alors et se plongea sept fois dans le Jourdain, selon la parole de l’homme de Dieu; et sa chair redevint comme la chair d’un jeune enfant, et il fut pur."]],"Joël 2:28":[[28,"Après cela, je répandrai mon esprit sur toute chair; Vos fils et vos filles prophétiseront, Vos vieillards auront des songes, Et vos jeunes gens des visions."]],"Actes 2:16-17":[[16,"Mais c’est ici ce qui a été dit par le prophète Joël:"],[17,"Dans les derniers jours, dit Dieu, je répandrai de mon Esprit sur toute chair; Vos fils et vos filles prophétiseront, Vos jeunes gens auront des visions, Et vos vieillards auront des songes."]],"Jonas 2:1":[[1,"L’Éternel fit venir un grand poisson pour engloutir Jonas, et Jonas fut dans le ventre du poisson trois jours et trois nuits."]],"Matthieu 12:40":[[40,"Car, de même que Jonas fut trois jours et trois nuits dans le ventre d’un grand poisson, de même le Fils de l’homme sera trois jours et trois nuits dans le sein de la terre."]],"Jonas 1:3":[[3,"Et Jonas se leva pour s’enfuir à Tarsis, loin de la face de l’Éternel. Il descendit à Japho, et il trouva un navire qui allait à Tarsis; il paya le prix du transport, et s’embarqua pour aller avec les passagers à Tarsis, loin de la face de l’Éternel."]],"Jonas 3:10":[[10,"Dieu vit qu’ils agissaient ainsi et qu’ils revenaient de leur mauvaise voie. Alors Dieu se repentit du mal qu’il avait résolu de leur faire, et il ne le fit pas."]],"Amos 1:1":[[1,"Paroles d’Amos, l’un des bergers de Tekoa, visions qu’il eut sur Israël, au temps d’Ozias, roi de Juda, et au temps de Jéroboam, fils de Joas, roi d’Israël, deux ans avant le tremblement de terre."]],"Amos 5:24":[[24,"Mais que la droiture soit comme un courant d’eau, Et la justice comme un torrent qui jamais ne tarit."]],"Amos 7:14-15":[[14,"Amos répondit à Amatsia: Je ne suis ni prophète, ni fils de prophète; mais je suis berger, et je cultive des sycomores."],[15,"L’Éternel m’a pris derrière le troupeau, et l’Éternel m’a dit: Va, prophétise à mon peuple d’Israël."]],"Osée 1:1":[[1,"La parole de l’Éternel qui fut adressée à Osée, fils de Beéri, au temps d’Ozias, de Jotham, d’Achaz, d’Ézéchias, rois de Juda, et au temps de Jéroboam, fils de Joas, roi d’Israël."]],"Osée 3:1":[[1,"L’Éternel me dit: Va encore, et aime une femme aimée d’un amant, et adultère; aime-la comme l’Éternel aime les enfants d’Israël, qui se tournent vers d’autres dieux et qui aiment les gâteaux de raisins."]],"Osée 11:1":[[1,"Quand Israël était jeune, je l’aimais, Et j’appelai mon fils hors d’Égypte."]],"Osée 14:2":[[2,"Apportez avec vous des paroles, Et revenez à l’Éternel. Dites-lui: Pardonne toutes les iniquités, Et reçois-nous favorablement! Nous t’offrirons, au lieu de taureaux, l’hommage de nos lèvres."]],"Ésaïe 6:1-8":[[1,"L’année de la mort du roi Ozias, je vis le Seigneur assis sur un trône très élevé, et les pans de sa robe remplissaient le temple."],[2,"Des séraphins se tenaient au-dessus de lui; ils avaient chacun six ailes; deux dont ils se couvraient la face, deux dont ils se couvraient les pieds, et deux dont ils se servaient pour voler."],[3,"Ils criaient l’un à l’autre, et disaient: Saint, saint, saint est l’Éternel des armées! Toute la terre est pleine de sa gloire!"],[4,"Les portes furent ébranlées dans leurs fondements par la voix qui retentissait, et la maison se remplit de fumée."],[5,"Alors je dis: Malheur à moi! Je suis perdu, car je suis un homme dont les lèvres sont impures, j’habite au milieu d’un peuple dont les lèvres sont impures, et mes yeux ont vu le Roi, l’Éternel des armées."],[6,"Mais l’un des séraphins vola vers moi, tenant à la main une pierre ardente, qu’il avait prise sur l’autel avec des pincettes."],[7,"Il en toucha ma bouche, et dit: Ceci a touché tes lèvres; ton iniquité est enlevée, et ton péché est expié."],[8,"J’entendis la voix du Seigneur, disant: Qui enverrai-je, et qui marchera pour nous? Je répondis: Me voici, envoie-moi."]],"Ésaïe 9:5":[[5,"Car un enfant nous est né, un fils nous est donné, Et la domination reposera sur son épaule; On l’appellera Admirable, Conseiller, Dieu puissant, Père éternel, Prince de la paix."]],"Ésaïe 53:5":[[5,"Mais il était blessé pour nos péchés, Brisé pour nos iniquités; Le châtiment qui nous donne la paix est tombé sur lui, Et c’est par ses meurtrissures que nous sommes guéris."]],"Ésaïe 43:1":[[1,"Ainsi parle maintenant l’Éternel, qui t’a créé, ô Jacob! Celui qui t’a formé, ô Israël! Ne crains rien, car je te rachète, Je t’appelle par ton nom: tu es à moi!"]],"Ésaïe 1:1":[[1,"Prophétie d’Ésaïe, fils d’Amots, sur Juda et Jérusalem, au temps d’Ozias, de Jotham, d’Achaz, d’Ézéchias, rois de Juda."]],"Michée 1:1":[[1,"La parole de l’Éternel fut adressée à Michée, de Moréscheth, au temps de Jotham, d’Achaz, d’Ézéchias, rois de Juda, prophétie sur Samarie et Jérusalem."]],"Michée 5:1":[[1,"Et toi, Bethléhem Éphrata, Petite entre les milliers de Juda, De toi sortira pour moi Celui qui dominera sur Israël, Et dont l’origine remonte aux temps anciens, Aux jours de l’éternité."]],"Michée 6:8":[[8,"On t’a fait connaître, ô homme, ce qui est bien; Et ce que l’Éternel demande de toi, C’est que tu pratiques la justice, Que tu aimes la miséricorde, Et que tu marches humblement avec ton Dieu."]],"Nahum 1:7":[[7,"L’Éternel est bon, Il est un refuge au jour de la détresse; Il connaît ceux qui se confient en lui."]],"Sophonie 1:1":[[1,"La parole de l’Éternel qui fut adressée à Sophonie, fils de Cuschi, fils de Guedalia, fils d’Amaria, fils d’Ézéchias, au temps de Josias, fils d’Amon, roi de Juda."]],"Sophonie 3:17":[[17,"L’Éternel, ton Dieu, est au milieu de toi, comme un héros qui sauve; Il fera de toi sa plus grande joie; Il gardera le silence dans son amour; Il aura pour toi des transports d’allégresse."]],"Jérémie 1:5":[[5,"Avant que je t’eusse formé dans le ventre de ta mère, je te connaissais, et avant que tu fusses sorti de son sein, je t’avais consacré, je t’avais établi prophète des nations."]],"Jérémie 1:2-3":[[2,"La parole de l’Éternel lui fut adressée au temps de Josias, fils d’Amon, roi de Juda, la treizième année de son règne,"],[3,"et au temps de Jojakim, fils de Josias, roi de Juda, jusqu’à la fin de la onzième année de Sédécias, fils de Josias, roi de Juda, jusqu’à l’époque où Jérusalem fut emmenée en captivité, au cinquième mois."]],"Jérémie 25:11":[[11,"Tout ce pays deviendra une ruine, un désert, et ces nations seront asservies au roi de Babylone pendant soixante-dix ans."]],"Jérémie 31:31-33":[[31,"Voici, les jours viennent, dit l’Éternel, Où je ferai avec la maison d’Israël et la maison de Juda Une alliance nouvelle,"],[32,"Non comme l’alliance que je traitai avec leurs pères, Le jour où je les saisis par la main Pour les faire sortir du pays d’Égypte, Alliance qu’ils ont violée, Quoique je fusse leur maître, dit l’Éternel."],[33,"Mais voici l’alliance que je ferai avec la maison d’Israël, Après ces jours-là, dit l’Éternel: Je mettrai ma loi au-dedans d’eux, Je l’écrirai dans leur cœur; Et je serai leur Dieu, Et ils seront mon peuple."]],"Jérémie 43:6-7":[[6,"les hommes, les femmes, les enfants, les filles du roi, et toutes les personnes que Nebuzaradan, chef des gardes, avait laissées avec Guedalia, fils d’Achikam, fils de Schaphan, et aussi Jérémie, le prophète, et Baruc, fils de Nérija."],[7,"Ils allèrent au pays d’Égypte, car ils n’obéirent pas à la voix de l’Éternel, et ils arrivèrent à Tachpanès."]],"Jérémie 1:1-5":[[1,"Paroles de Jérémie, fils de Hilkija, l’un des sacrificateurs d’Anathoth, dans le pays de Benjamin."],[2,"La parole de l’Éternel lui fut adressée au temps de Josias, fils d’Amon, roi de Juda, la treizième année de son règne,"],[3,"et au temps de Jojakim, fils de Josias, roi de Juda, jusqu’à la fin de la onzième année de Sédécias, fils de Josias, roi de Juda, jusqu’à l’époque où Jérusalem fut emmenée en captivité, au cinquième mois."],[4,"La parole de l’Éternel me fut adressée, en ces mots:"],[5,"Avant que je t’eusse formé dans le ventre de ta mère, je te connaissais, et avant que tu fusses sorti de son sein, je t’avais consacré, je t’avais établi prophète des nations."]],"Jérémie 38:6":[[6,"Alors ils prirent Jérémie, et le jetèrent dans la citerne de Malkija, fils du roi, laquelle se trouvait dans la cour de la prison; ils descendirent Jérémie avec des cordes. Il n’y avait point d’eau dans la citerne, mais il y avait de la boue; et Jérémie enfonça dans la boue."]],"Habakuk 2:4":[[4,"Voici, son âme s’est enflée, elle n’est pas droite en lui; Mais le juste vivra par sa foi."]],"Romains 1:17":[[17,"parce qu’en lui est révélée la justice de Dieu par la foi et pour la foi, selon qu’il est écrit: Le juste vivra par la foi."]],"Habakuk 1:2":[[2,"Jusqu’à quand, ô Éternel?… J’ai crié, Et tu n’écoutes pas! J’ai crié vers toi à la violence, Et tu ne secours pas!"]],"Daniel 1:8":[[8,"Daniel résolut de ne pas se souiller par les mets du roi et par le vin dont le roi buvait, et il pria le chef des eunuques de ne pas l’obliger à se souiller."]],"Daniel 2:44":[[44,"Dans le temps de ces rois, le Dieu des cieux suscitera un royaume qui ne sera jamais détruit, et qui ne passera point sous la domination d’un autre peuple; il brisera et anéantira tous ces royaumes-là, et lui-même subsistera éternellement."]],"Daniel 7:13-14":[[13,"Je regardai pendant mes visions nocturnes, et voici, sur les nuées des cieux arriva quelqu’un de semblable à un fils de l’homme; il s’avança vers l’ancien des jours, et on le fit approcher de lui."],[14,"On lui donna la domination, la gloire et le règne; et tous les peuples, les nations, et les hommes de toutes langues le servirent. Sa domination est une domination éternelle qui ne passera point, et son règne ne sera jamais détruit."]],"Daniel 1:21":[[21,"Ainsi fut Daniel jusqu’à la première année du roi Cyrus."]],"Daniel 9:2":[[2,"la première année de son règne, moi, Daniel, je vis par les livres qu’il devait s’écouler soixante-dix ans pour les ruines de Jérusalem, d’après le nombre des années dont l’Éternel avait parlé à Jérémie, le prophète."]],"Daniel 6:22":[[22,"Mon Dieu a envoyé son ange et fermé la gueule des lions, qui ne m’ont fait aucun mal, parce que j’ai été trouvé innocent devant lui; et devant toi non plus, ô roi, je n’ai rien fait de mauvais."]],"Ézéchiel 1:1-3":[[1,"La trentième année, le cinquième jour du quatrième mois, comme j’étais parmi les captifs du fleuve du Kebar, les cieux s’ouvrirent, et j’eus des visions divines."],[2,"Le cinquième jour du mois, c’était la cinquième année de la captivité du roi Jojakin,"],[3,"la parole de l’Éternel fut adressée à Ézéchiel, fils de Buzi, le sacrificateur, dans le pays des Chaldéens, près du fleuve du Kebar; et c’est là que la main de l’Éternel fut sur lui."]],"Ézéchiel 36:26":[[26,"Je vous donnerai un cœur nouveau, et je mettrai en vous un esprit nouveau; j’ôterai de votre corps le cœur de pierre, et je vous donnerai un cœur de chair."]],"Ézéchiel 14:14":[[14,"et qu’il y eût au milieu de lui ces trois hommes, Noé, Daniel et Job, ils sauveraient leur âme par leur justice, dit le Seigneur, l’Éternel."]],"Ézéchiel 37:4-5":[[4,"Il me dit: Prophétise sur ces os, et dis-leur: Ossements desséchés, écoutez la parole de l’Éternel!"],[5,"Ainsi parle le Seigneur, l’Éternel, à ces os: Voici, je vais faire entrer en vous un esprit, et vous vivrez;"]],"Abdias 1:15":[[15,"Car le jour de l’Éternel est proche, pour toutes les nations; Il te sera fait comme tu as fait, Tes œuvres retomberont sur ta tête."]],"Aggée 1:5":[[5,"Ainsi parle maintenant l’Éternel des armées: Considérez attentivement vos voies!"]],"Aggée 1:1":[[1,"La seconde année du roi Darius, le premier jour du sixième mois, la parole de l’Éternel fut adressée par Aggée, le prophète, à Zorobabel, fils de Schealthiel, gouverneur de Juda, et à Josué, fils de Jotsadak, le souverain sacrificateur, en ces mots:"]],"Zacharie 4:6":[[6,"Alors il reprit et me dit: C’est ici la parole que l’Éternel adresse à Zorobabel: Ce n’est ni par la puissance ni par la force, mais c’est par mon esprit, dit l’Éternel des armées."]],"Zacharie 9:9":[[9,"Sois transportée d’allégresse, fille de Sion! Pousse des cris de joie, fille de Jérusalem! Voici, ton roi vient à toi; Il est juste et victorieux, Il est humble et monté sur un âne, Sur un âne, le petit d’une ânesse."]],"Zacharie 12:10":[[10,"Alors je répandrai sur la maison de David et sur les habitants de Jérusalem Un esprit de grâce et de supplication, Et ils tourneront les regards vers moi, celui qu’ils ont percé. Ils pleureront sur lui comme on pleure sur un fils unique, Ils pleureront amèrement sur lui comme on pleure sur un premier-né."]],"Malachie 3:1":[[1,"Voici, j’enverrai mon messager; Il préparera le chemin devant moi. Et soudain entrera dans son temple le Seigneur que vous cherchez; Et le messager de l’alliance que vous désirez, voici, il vient, Dit l’Éternel des armées."]],"Luc 7:27":[[27,"C’est celui dont il est écrit: Voici, j’envoie mon messager devant ta face, Pour préparer ton chemin devant toi."]],"Esdras 3:8-11":[[8,"La seconde année depuis leur arrivée à la maison de Dieu à Jérusalem, au second mois, Zorobabel, fils de Schealthiel, Josué, fils de Jotsadak, avec le reste de leurs frères les sacrificateurs et les Lévites, et tous ceux qui étaient revenus de la captivité à Jérusalem, se mirent à l’œuvre et chargèrent les Lévites de vingt ans et au-dessus de surveiller les travaux de la maison de l’Éternel."],[9,"Et Josué, avec ses fils et ses frères, Kadmiel, avec ses fils, fils de Juda, les fils de Hénadad, avec leurs fils et leurs frères les Lévites, se préparèrent tous ensemble à surveiller ceux qui travaillaient à la maison de Dieu."],[10,"Lorsque les ouvriers posèrent les fondements du temple de l’Éternel, on fit assister les sacrificateurs en costume, avec les trompettes, et les Lévites, fils d’Asaph, avec les cymbales, afin qu’ils célébrassent l’Éternel, d’après les ordonnances de David, roi d’Israël."],[11,"Ils chantaient, célébrant et louant l’Éternel par ces paroles: Car il est bon, car sa miséricorde pour Israël dure à toujours! Et tout le peuple poussait de grands cris de joie en célébrant l’Éternel, parce qu’on posait les fondements de la maison de l’Éternel."]],"Aggée 2:23":[[23,"En ce jour-là, dit l’Éternel des armées, Je te prendrai, Zorobabel, fils de Schealthiel, Mon serviteur, dit l’Éternel, Et je te garderai comme un sceau; Car je t’ai choisi, dit l’Éternel des armées."]],"Esther 10:3":[[3,"Car le Juif Mardochée était le premier après le roi Assuérus; considéré parmi les Juifs et aimé de la multitude de ses frères, il rechercha le bien de son peuple et parla pour le bonheur de toute sa race."]],"Esther 2:7":[[7,"Il élevait Hadassa, qui est Esther, fille de son oncle; car elle n’avait ni père ni mère. La jeune fille était belle de taille et belle de figure. A la mort de son père et de sa mère, Mardochée l’avait adoptée pour fille."]],"Esther 2:16-17":[[16,"Esther fut conduite auprès du roi Assuérus, dans sa maison royale, le dixième mois, qui est le mois de Tébeth, la septième année de son règne."],[17,"Le roi aima Esther plus que toutes les autres femmes, et elle obtint grâce et faveur devant lui plus que toutes les autres jeunes filles. Il mit la couronne royale sur sa tête, et la fit reine à la place de Vasthi."]],"Esther 4:14":[[14,"car, si tu te tais maintenant, le secours et la délivrance surgiront d’autre part pour les Juifs, et toi et la maison de ton père vous périrez. Et qui sait si ce n’est pas pour un temps comme celui-ci que tu es parvenue à la royauté?"]],"Esther 9:26-28":[[26,"C’est pourquoi on appela ces jours Purim, du nom de pur. D’après tout le contenu de cette lettre, d’après ce qu’ils avaient eux-mêmes vu et ce qui leur était arrivé,"],[27,"les Juifs prirent pour eux, pour leur postérité, et pour tous ceux qui s’attacheraient à eux, la résolution et l’engagement irrévocables de célébrer chaque année ces deux jours, selon le mode prescrit et au temps fixé."],[28,"Ces jours devaient être rappelés et célébrés de génération en génération, dans chaque famille, dans chaque province et dans chaque ville; et ces jours de Purim ne devaient jamais être abolis au milieu des Juifs, ni le souvenir s’en effacer parmi leurs descendants."]],"Esther 4:14-16":[[14,"car, si tu te tais maintenant, le secours et la délivrance surgiront d’autre part pour les Juifs, et toi et la maison de ton père vous périrez. Et qui sait si ce n’est pas pour un temps comme celui-ci que tu es parvenue à la royauté?"],[15,"Esther envoya dire à Mardochée:"],[16,"Va, rassemble tous les Juifs qui se trouvent à Suse, et jeûnez pour moi, sans manger ni boire pendant trois jours, ni la nuit ni le jour. Moi aussi, je jeûnerai de même avec mes servantes, puis j’entrerai chez le roi, malgré la loi; et si je dois périr, je périrai."]],"Esdras 7:10":[[10,"Car Esdras avait appliqué son cœur à étudier et à mettre en pratique la loi de l’Éternel, et à enseigner au milieu d’Israël les lois et les ordonnances."]],"Néhémie 8:1-8":[[1,"Alors tout le peuple s’assembla comme un seul homme sur la place qui est devant la porte des eaux. Ils dirent à Esdras, le scribe, d’apporter le livre de la loi de Moïse, prescrite par l’Éternel à Israël."],[2,"Et le sacrificateur Esdras apporta la loi devant l’assemblée, composée d’hommes et de femmes et de tous ceux qui étaient capables de l’entendre. C’était le premier jour du septième mois."],[3,"Esdras lut dans le livre depuis le matin jusqu’au milieu du jour, sur la place qui est devant la porte des eaux, en présence des hommes et des femmes et de ceux qui étaient capables de l’entendre. Tout le peuple fut attentif à la lecture du livre de la loi."],[4,"Esdras, le scribe, était placé sur une estrade de bois, dressée à cette occasion. Auprès de lui, à sa droite, se tenaient Matthithia, Schéma, Anaja, Urie, Hilkija et Maaséja, et à sa gauche, Pedaja, Mischaël, Malkija, Haschum, Haschbaddana, Zacharie et Meschullam."],[5,"Esdras ouvrit le livre à la vue de tout le peuple, car il était élevé au-dessus de tout le peuple; et lorsqu’il l’eut ouvert, tout le peuple se tint en place."],[6,"Esdras bénit l’Éternel, le grand Dieu, et tout le peuple répondit, en levant les mains: Amen! Amen! Et ils s’inclinèrent et se prosternèrent devant l’Éternel, le visage contre terre."],[7,"Josué, Bani, Schérébia, Jamin, Akkub, Schabbethaï, Hodija, Maaséja, Kelitha, Azaria, Jozabad, Hanan, Pelaja, et les Lévites, expliquaient la loi au peuple, et chacun restait à sa place."],[8,"Ils lisaient distinctement dans le livre de la loi de Dieu, et ils en donnaient le sens pour faire comprendre ce qu’ils avaient lu."]],"Esdras 7:6-10":[[6,"Cet Esdras vint de Babylone: c’était un scribe versé dans la loi de Moïse, donnée par l’Éternel, le Dieu d’Israël. Et comme la main de l’Éternel, son Dieu, était sur lui, le roi lui accorda tout ce qu’il avait demandé."],[7,"Plusieurs des enfants d’Israël, des sacrificateurs et des Lévites, des chantres, des portiers, et des Néthiniens, vinrent aussi à Jérusalem, la septième année du roi Artaxerxès."],[8,"Esdras arriva à Jérusalem au cinquième mois de la septième année du roi;"],[9,"il était parti de Babylone le premier jour du premier mois, et il arriva à Jérusalem le premier jour du cinquième mois, la bonne main de son Dieu étant sur lui."],[10,"Car Esdras avait appliqué son cœur à étudier et à mettre en pratique la loi de l’Éternel, et à enseigner au milieu d’Israël les lois et les ordonnances."]],"Néhémie 1:1-4":[[1,"Paroles de Néhémie, fils de Hacalia. Au mois de Kisleu, la vingtième année, comme j’étais à Suse, dans la capitale,"],[2,"Hanani, l’un de mes frères, et quelques hommes arrivèrent de Juda. Je les questionnai au sujet des Juifs réchappés qui étaient restés de la captivité, et au sujet de Jérusalem."],[3,"Ils me répondirent: Ceux qui sont restés de la captivité sont là dans la province, au comble du malheur et de l’opprobre; les murailles de Jérusalem sont en ruines, et ses portes sont consumées par le feu."],[4,"Lorsque j’entendis ces choses, je m’assis, je pleurai, et je fus plusieurs jours dans la désolation. Je jeûnai et je priai devant le Dieu des cieux,"]],"Néhémie 6:15":[[15,"La muraille fut achevée le vingt-cinquième jour du mois d’Élul, en cinquante-deux jours."]],"Néhémie 8:10":[[10,"Ils leur dirent: Allez, mangez des viandes grasses et buvez des liqueurs douces, et envoyez des portions à ceux qui n’ont rien de préparé, car ce jour est consacré à notre Seigneur; ne vous affligez pas, car la joie de l’Éternel sera votre force."]],"Néhémie 1:4":[[4,"Lorsque j’entendis ces choses, je m’assis, je pleurai, et je fus plusieurs jours dans la désolation. Je jeûnai et je priai devant le Dieu des cieux,"]],"Néhémie 2:4-5":[[4,"Et le roi me dit: Que demandes-tu? Je priai le Dieu des cieux,"],[5,"et je répondis au roi: Si le roi le trouve bon, et si ton serviteur lui est agréable, envoie-moi en Juda, vers la ville des sépulcres de mes pères, pour que je la rebâtisse."]],"2 Rois 19:35-37":[[35,"Cette nuit-là, l’ange de l’Éternel sortit, et frappa dans le camp des Assyriens cent quatre-vingt-cinq mille hommes. Et quand on se leva le matin, voici, c’étaient tous des corps morts."],[36,"Alors Sanchérib, roi d’Assyrie, leva son camp, partit et s’en retourna; et il resta à Ninive."],[37,"Or, comme il était prosterné dans la maison de Nisroc, son dieu, Adrammélec et Scharetser, ses fils, le frappèrent avec l’épée, et s’enfuirent au pays d’Ararat. Et Ésar-Haddon, son fils, régna à sa place."]],"2 Rois 18:13":[[13,"La quatorzième année du roi Ézéchias, Sanchérib, roi d’Assyrie, monta contre toutes les villes fortes de Juda, et s’en empara."]],"2 Rois 25:8-10":[[8,"Le septième jour du cinquième mois, c’était la dix-neuvième année du règne de Nebucadnetsar, roi de Babylone, Nebuzaradan, chef des gardes, serviteur du roi de Babylone, entra dans Jérusalem."],[9,"Il brûla la maison de l’Éternel, la maison du roi, et toutes les maisons de Jérusalem; il livra au feu toutes les maisons de quelque importance."],[10,"Toute l’armée des Chaldéens, qui était avec le chef des gardes, démolit les murailles formant l’enceinte de Jérusalem."]],"Daniel 4:37":[[37,"Maintenant, moi, Nebucadnetsar, je loue, j’exalte et je glorifie le roi des cieux, dont toutes les œuvres sont vraies et les voies justes, et qui peut abaisser ceux qui marchent avec orgueil."]],"Ésaïe 44:28":[[28,"Je dis de Cyrus: Il est mon berger, Et il accomplira toute ma volonté; Il dira de Jérusalem: Qu’elle soit rebâtie! Et du temple: Qu’il soit fondé!"]],"Esdras 1:1-4":[[1,"La première année de Cyrus, roi de Perse, afin que s’accomplît la parole de l’Éternel prononcée par la bouche de Jérémie, l’Éternel réveilla l’esprit de Cyrus, roi de Perse, qui fit faire de vive voix et par écrit cette publication dans tout son royaume:"],[2,"Ainsi parle Cyrus, roi des Perses: L’Éternel, le Dieu des cieux, m’a donné tous les royaumes de la terre, et il m’a commandé de lui bâtir une maison à Jérusalem en Juda."],[3,"Qui d’entre vous est de son peuple? Que son Dieu soit avec lui, et qu’il monte à Jérusalem en Juda et bâtisse la maison de l’Éternel, le Dieu d’Israël! C’est le Dieu qui est à Jérusalem."],[4,"Dans tout lieu où séjournent des restes du peuple de l’Éternel, les gens du lieu leur donneront de l’argent, de l’or, des effets, et du bétail, avec des offrandes volontaires pour la maison de Dieu qui est à Jérusalem."]],"Ésaïe 45:1":[[1,"Ainsi parle l’Éternel à son oint, à Cyrus, Qu’il tient par la main, Pour terrasser les nations devant lui, Et pour relâcher la ceinture des rois, Pour lui ouvrir les portes, Afin qu’elles ne soient plus fermées;"]],"Esdras 6:15":[[15,"La maison fut achevée le troisième jour du mois d’Adar, dans la sixième année du règne du roi Darius."]],"Esther 1:1-2":[[1,"C’était du temps d’Assuérus, de cet Assuérus qui régnait depuis l’Inde jusqu’en Éthiopie sur cent vingt-sept provinces;"],[2,"et le roi Assuérus était alors assis sur son trône royal à Suse, dans la capitale."]],"Esdras 7:11-13":[[11,"Voici la copie de la lettre donnée par le roi Artaxerxès à Esdras, sacrificateur et scribe, enseignant les commandements et les lois de l’Éternel concernant Israël:"],[12,"Artaxerxès, roi des rois, à Esdras, sacrificateur et scribe, versé dans la loi du Dieu des cieux, etc."],[13,"J’ai donné ordre de laisser aller tous ceux du peuple d’Israël, de ses sacrificateurs et de ses Lévites, qui se trouvent dans mon royaume, et qui sont disposés à partir avec toi pour Jérusalem."]],"Néhémie 2:1-8":[[1,"Au mois de Nisan, la vingtième année du roi Artaxerxès, comme le vin était devant lui, je pris le vin et je l’offris au roi. Jamais je n’avais paru triste en sa présence."],[2,"Le roi me dit: Pourquoi as-tu mauvais visage? Tu n’es pourtant pas malade; ce ne peut être qu’un chagrin de cœur. Je fus saisi d’une grande crainte,"],[3,"et je répondis au roi: Que le roi vive éternellement! Comment n’aurais-je pas mauvais visage, lorsque la ville où sont les sépulcres de mes pères est détruite et que ses portes sont consumées par le feu?"],[4,"Et le roi me dit: Que demandes-tu? Je priai le Dieu des cieux,"],[5,"et je répondis au roi: Si le roi le trouve bon, et si ton serviteur lui est agréable, envoie-moi en Juda, vers la ville des sépulcres de mes pères, pour que je la rebâtisse."],[6,"Le roi, auprès duquel la reine était assise, me dit alors: Combien ton voyage durera-t-il, et quand seras-tu de retour? Il plut au roi de me laisser partir, et je lui fixai un temps."],[7,"Puis je dis au roi: Si le roi le trouve bon, qu’on me donne des lettres pour les gouverneurs de l’autre côté du fleuve, afin qu’ils me laissent passer et entrer en Juda,"],[8,"et une lettre pour Asaph, garde forestier du roi, afin qu’il me fournisse du bois de charpente pour les portes de la citadelle près de la maison, pour la muraille de la ville, et pour la maison que j’occuperai. Le roi me donna ces lettres, car la bonne main de mon Dieu était sur moi."]],"Luc 2:1-7":[[1,"En ce temps-là parut un édit de César Auguste, ordonnant un recensement de toute la terre."],[2,"Ce premier recensement eut lieu pendant que Quirinius était gouverneur de Syrie."],[3,"Tous allaient se faire inscrire, chacun dans sa ville."],[4,"Joseph aussi monta de la Galilée, de la ville de Nazareth, pour se rendre en Judée, dans la ville de David, appelée Bethléhem, parce qu’il était de la maison et de la famille de David,"],[5,"afin de se faire inscrire avec Marie, sa fiancée, qui était enceinte."],[6,"Pendant qu’ils étaient là, le temps où Marie devait accoucher arriva,"],[7,"et elle enfanta son fils premier-né. Elle l’emmaillota, et le coucha dans une crèche, parce qu’il n’y avait pas de place pour eux dans l’hôtellerie."]],"Matthieu 2:16":[[16,"Alors Hérode, voyant qu’il avait été joué par les mages, se mit dans une grande colère, et il envoya tuer tous les enfants de deux ans et au-dessous qui étaient à Bethléhem et dans tout son territoire, selon la date dont il s’était soigneusement enquis auprès des mages."]],"Matthieu 2:1-3":[[1,"Jésus étant né à Bethléhem en Judée, au temps du roi Hérode, voici des mages d’Orient arrivèrent à Jérusalem,"],[2,"et dirent: Où est le roi des Juifs qui vient de naître? Car nous avons vu son étoile en Orient, et nous sommes venus pour l’adorer."],[3,"Le roi Hérode, ayant appris cela, fut troublé, et tout Jérusalem avec lui."]],"Luc 3:1":[[1,"La quinzième année du règne de Tibère César, lorsque Ponce Pilate était gouverneur de la Judée, Hérode tétrarque de la Galilée, son frère Philippe tétrarque de l’Iturée et du territoire de la Trachonite, Lysanias tétrarque de l’Abilène,"]],"Luc 3:1-2":[[1,"La quinzième année du règne de Tibère César, lorsque Ponce Pilate était gouverneur de la Judée, Hérode tétrarque de la Galilée, son frère Philippe tétrarque de l’Iturée et du territoire de la Trachonite, Lysanias tétrarque de l’Abilène,"],[2,"et du temps des souverains sacrificateurs Anne et Caïphe, la parole de Dieu fut adressée à Jean, fils de Zacharie, dans le désert."]],"Jean 18:38":[[38,"Pilate lui dit: Qu’est-ce que la vérité? Après avoir dit cela, il sortit de nouveau pour aller vers les Juifs, et il leur dit: Je ne trouve aucun crime en lui."]],"Jean 18:37-38":[[37,"Pilate lui dit: Tu es donc roi? Jésus répondit: Tu le dis, je suis roi. Je suis né et je suis venu dans le monde pour rendre témoignage à la vérité. Quiconque est de la vérité écoute ma voix."],[38,"Pilate lui dit: Qu’est-ce que la vérité? Après avoir dit cela, il sortit de nouveau pour aller vers les Juifs, et il leur dit: Je ne trouve aucun crime en lui."]],"Jean 19:16":[[16,"Alors il le leur livra pour être crucifié. Ils prirent donc Jésus, et l’emmenèrent."]],"Actes 25:11":[[11,"Si j’ai commis quelque injustice, ou quelque crime digne de mort, je ne refuse pas de mourir; mais, si les choses dont ils m’accusent sont fausses, personne n’a le droit de me livrer à eux. J’en appelle à César."]],"Luc 1:36":[[36,"Voici, Élisabeth, ta parente, a conçu, elle aussi, un fils en sa vieillesse, et celle qui était appelée stérile est dans son sixième mois."]],"Matthieu 3:3":[[3,"Jean est celui qui avait été annoncé par Ésaïe, le prophète, lorsqu’il dit: C’est ici la voix de celui qui crie dans le désert: Préparez le chemin du Seigneur, Aplanissez ses sentiers."]],"Jean 1:29":[[29,"Le lendemain, il vit Jésus venant à lui, et il dit: Voici l’Agneau de Dieu, qui ôte le péché du monde."]],"Marc 6:27":[[27,"Il envoya sur-le-champ un garde, avec ordre d’apporter la tête de Jean-Baptiste."]],"Matthieu 11:11":[[11,"Je vous le dis en vérité, parmi ceux qui sont nés de femmes, il n’en a point paru de plus grand que Jean-Baptiste. Cependant, le plus petit dans le royaume des cieux est plus grand que lui."]],"Matthieu 1:19-20":[[19,"Joseph, son époux, qui était un homme de bien et qui ne voulait pas la diffamer, se proposa de rompre secrètement avec elle."],[20,"Comme il y pensait, voici, un ange du Seigneur lui apparut en songe, et dit: Joseph, fils de David, ne crains pas de prendre avec toi Marie, ta femme, car l’enfant qu’elle a conçu vient du Saint-Esprit;"]],"Luc 2:41-51":[[41,"Les parents de Jésus allaient chaque année à Jérusalem, à la fête de Pâque."],[42,"Lorsqu’il fut âgé de douze ans, ils y montèrent, selon la coutume de la fête."],[43,"Puis, quand les jours furent écoulés, et qu’ils s’en retournèrent, l’enfant Jésus resta à Jérusalem. Son père et sa mère ne s’en aperçurent pas."],[44,"Croyant qu’il était avec leurs compagnons de voyage, ils firent une journée de chemin, et le cherchèrent parmi leurs parents et leurs connaissances."],[45,"Mais, ne l’ayant pas trouvé, ils retournèrent à Jérusalem pour le chercher."],[46,"Au bout de trois jours, ils le trouvèrent dans le temple, assis au milieu des docteurs, les écoutant et les interrogeant."],[47,"Tous ceux qui l’entendaient étaient frappés de son intelligence et de ses réponses."],[48,"Quand ses parents le virent, ils furent saisis d’étonnement, et sa mère lui dit: Mon enfant, pourquoi as-tu agi de la sorte avec nous? Voici, ton père et moi, nous te cherchions avec angoisse."],[49,"Il leur dit: Pourquoi me cherchiez-vous? Ne saviez-vous pas qu’il faut que je m’occupe des affaires de mon Père?"],[50,"Mais ils ne comprirent pas ce qu’il leur disait."],[51,"Puis il descendit avec eux pour aller à Nazareth, et il leur était soumis. Sa mère gardait toutes ces choses dans son cœur."]],"Matthieu 1:19-21":[[19,"Joseph, son époux, qui était un homme de bien et qui ne voulait pas la diffamer, se proposa de rompre secrètement avec elle."],[20,"Comme il y pensait, voici, un ange du Seigneur lui apparut en songe, et dit: Joseph, fils de David, ne crains pas de prendre avec toi Marie, ta femme, car l’enfant qu’elle a conçu vient du Saint-Esprit;"],[21,"elle enfantera un fils, et tu lui donneras le nom de Jésus; c’est lui qui sauvera son peuple de ses péchés."]],"Matthieu 2:13-14":[[13,"Lorsqu’ils furent partis, voici, un ange du Seigneur apparut en songe à Joseph, et dit: Lève-toi, prends le petit enfant et sa mère, fuis en Égypte, et restes-y jusqu’à ce que je te parle; car Hérode cherchera le petit enfant pour le faire périr."],[14,"Joseph se leva, prit de nuit le petit enfant et sa mère, et se retira en Égypte."]],"Luc 1:38":[[38,"Marie dit: Je suis la servante du Seigneur; qu’il me soit fait selon ta parole! Et l’ange la quitta."]],"Luc 1:46-55":[[46,"Et Marie dit: Mon âme exalte le Seigneur,"],[47,"Et mon esprit se réjouit en Dieu, mon Sauveur,"],[48,"Parce qu’il a jeté les yeux sur la bassesse de sa servante. Car voici, désormais toutes les générations me diront bienheureuse,"],[49,"Parce que le Tout-Puissant a fait pour moi de grandes choses. Son nom est saint,"],[50,"et sa miséricorde s’étend d’âge en âge sur ceux qui le craignent."],[51,"Il a déployé la force de son bras; Il a dispersé ceux qui avaient dans le cœur des pensées orgueilleuses."],[52,"Il a renversé les puissants de leurs trônes, et il a élevé les humbles."],[53,"Il a rassasié de biens les affamés, et il a renvoyé les riches à vide."],[54,"Il a secouru Israël, son serviteur, et il s’est souvenu de sa miséricorde,"],[55,"comme il l’avait dit à nos pères, Envers Abraham et sa postérité pour toujours."]],"Jean 19:26-27":[[26,"Jésus, voyant sa mère, et auprès d’elle le disciple qu’il aimait, dit à sa mère: Femme, voilà ton fils."],[27,"Puis il dit au disciple: Voilà ta mère. Et, dès ce moment, le disciple la prit chez lui."]],"Actes 1:14":[[14,"Tous d’un commun accord persévéraient dans la prière, avec les femmes, et Marie, mère de Jésus, et avec les frères de Jésus."]],"Luc 1:30-38":[[30,"L’ange lui dit: Ne crains point, Marie; car tu as trouvé grâce devant Dieu."],[31,"Et voici, tu deviendras enceinte, et tu enfanteras un fils, et tu lui donneras le nom de Jésus."],[32,"Il sera grand et sera appelé Fils du Très-Haut, et le Seigneur Dieu lui donnera le trône de David, son père."],[33,"Il régnera sur la maison de Jacob éternellement, et son règne n’aura point de fin."],[34,"Marie dit à l’ange: Comment cela se fera-t-il, puisque je ne connais point d’homme?"],[35,"L’ange lui répondit: Le Saint-Esprit viendra sur toi, et la puissance du Très-Haut te couvrira de son ombre. C’est pourquoi le saint enfant qui naîtra de toi sera appelé Fils de Dieu."],[36,"Voici, Élisabeth, ta parente, a conçu, elle aussi, un fils en sa vieillesse, et celle qui était appelée stérile est dans son sixième mois."],[37,"Car rien n’est impossible à Dieu."],[38,"Marie dit: Je suis la servante du Seigneur; qu’il me soit fait selon ta parole! Et l’ange la quitta."]],"Luc 1:46-48":[[46,"Et Marie dit: Mon âme exalte le Seigneur,"],[47,"Et mon esprit se réjouit en Dieu, mon Sauveur,"],[48,"Parce qu’il a jeté les yeux sur la bassesse de sa servante. Car voici, désormais toutes les générations me diront bienheureuse,"]],"Matthieu 2:1":[[1,"Jésus étant né à Bethléhem en Judée, au temps du roi Hérode, voici des mages d’Orient arrivèrent à Jérusalem,"]],"Jean 1:14":[[14,"Et la parole a été faite chair, et elle a habité parmi nous, pleine de grâce et de vérité; et nous avons contemplé sa gloire, une gloire comme la gloire du Fils unique venu du Père."]],"Luc 3:23":[[23,"Jésus avait environ trente ans lorsqu’il commença son ministère, étant, comme on le croyait, fils de Joseph, fils d’Héli,"]],"Jean 14:6":[[6,"Jésus lui dit: Je suis le chemin, la vérité, et la vie. Nul ne vient au Père que par moi."]],"Marc 14:61-62":[[61,"Jésus garda le silence, et ne répondit rien. Le souverain sacrificateur l’interrogea de nouveau, et lui dit: Es-tu le Christ, le Fils du Dieu béni?"],[62,"Jésus répondit: Je le suis. Et vous verrez le Fils de l’homme assis à la droite de la puissance de Dieu, et venant sur les nuées du ciel."]],"Luc 1:32-33":[[32,"Il sera grand et sera appelé Fils du Très-Haut, et le Seigneur Dieu lui donnera le trône de David, son père."],[33,"Il régnera sur la maison de Jacob éternellement, et son règne n’aura point de fin."]],"Luc 24:5-6":[[5,"Saisies de frayeur, elles baissèrent le visage contre terre; mais ils leur dirent: Pourquoi cherchez-vous parmi les morts celui qui est vivant?"],[6,"Il n’est point ici, mais il est ressuscité. Souvenez-vous de quelle manière il vous a parlé, lorsqu’il était encore en Galilée,"]],"Matthieu 16:16":[[16,"Simon Pierre répondit: Tu es le Christ, le Fils du Dieu vivant."]],"Jean 21:15-17":[[15,"Après qu’ils eurent mangé, Jésus dit à Simon Pierre: Simon, fils de Jonas, m’aimes-tu plus que ne m’aiment ceux-ci? Il lui répondit: Oui, Seigneur, tu sais que je t’aime. Jésus lui dit: Pais mes agneaux."],[16,"Il lui dit une seconde fois: Simon, fils de Jonas, m’aimes-tu? Pierre lui répondit: Oui, Seigneur, tu sais que je t’aime. Jésus lui dit: Pais mes brebis."],[17,"Il lui dit pour la troisième fois: Simon, fils de Jonas, m’aimes-tu? Pierre fut attristé de ce qu’il lui avait dit pour la troisième fois: M’aimes-tu? Et il lui répondit: Seigneur, tu sais toutes choses, tu sais que je t’aime. Jésus lui dit: Pais mes brebis."]],"Actes 2:41":[[41,"Ceux qui acceptèrent sa parole furent baptisés; et, en ce jour-là, le nombre des disciples s’augmenta d’environ trois mille âmes."]],"Actes 2:38-41":[[38,"Pierre leur dit: Repentez-vous, et que chacun de vous soit baptisé au nom de Jésus-Christ, pour le pardon de vos péchés; et vous recevrez le don du Saint-Esprit."],[39,"Car la promesse est pour vous, pour vos enfants, et pour tous ceux qui sont au loin, en aussi grand nombre que le Seigneur notre Dieu les appellera."],[40,"Et, par plusieurs autres paroles, il les conjurait et les exhortait, disant: Sauvez-vous de cette génération perverse."],[41,"Ceux qui acceptèrent sa parole furent baptisés; et, en ce jour-là, le nombre des disciples s’augmenta d’environ trois mille âmes."]],"Actes 10:34-35":[[34,"Alors Pierre, ouvrant la bouche, dit: En vérité, je reconnais que Dieu ne fait point acception de personnes,"],[35,"mais qu’en toute nation celui qui le craint et qui pratique la justice lui est agréable."]],"Actes 12:1-2":[[1,"Vers le même temps, le roi Hérode se mit à maltraiter quelques membres de l’Église,"],[2,"et il fit mourir par l’épée Jacques, frère de Jean."]],"Matthieu 4:21":[[21,"De là étant allé plus loin, il vit deux autres frères, Jacques, fils de Zébédée, et Jean, son frère, qui étaient dans une barque avec Zébédée, leur père, et qui réparaient leurs filets."]],"Jean 13:23":[[23,"Un des disciples, celui que Jésus aimait, était couché sur le sein de Jésus."]],"Jean 1:1":[[1,"Au commencement était la Parole, et la Parole était avec Dieu, et la Parole était Dieu."]],"Apocalypse 1:9":[[9,"Moi Jean, votre frère, et qui ai part avec vous à la tribulation et au royaume et à la persévérance en Jésus, j’étais dans l’île appelée Patmos, à cause de la parole de Dieu et du témoignage de Jésus."]],"Jean 20:31":[[31,"Mais ces choses ont été écrites afin que vous croyiez que Jésus est le Christ, le Fils de Dieu, et qu’en croyant vous ayez la vie en son nom."]],"1 Jean 4:8":[[8,"Celui qui n’aime pas n’a pas connu Dieu, car Dieu est amour."]],"Actes 6:5":[[5,"Cette proposition plut à toute l’assemblée. Ils élurent Étienne, homme plein de foi et d’Esprit-Saint, Philippe, Prochore, Nicanor, Timon, Parménas, et Nicolas, prosélyte d’Antioche."]],"Actes 7:55-60":[[55,"Mais Étienne, rempli du Saint-Esprit, et fixant les regards vers le ciel, vit la gloire de Dieu et Jésus debout à la droite de Dieu."],[56,"Et il dit: Voici, je vois les cieux ouverts, et le Fils de l’homme debout à la droite de Dieu."],[57,"Ils poussèrent alors de grands cris, en se bouchant les oreilles, et ils se précipitèrent tous ensemble sur lui,"],[58,"le traînèrent hors de la ville, et le lapidèrent. Les témoins déposèrent leurs vêtements aux pieds d’un jeune homme nommé Saul."],[59,"Et ils lapidaient Étienne, qui priait et disait: Seigneur Jésus, reçois mon esprit!"],[60,"Puis, s’étant mis à genoux, il s’écria d’une voix forte: Seigneur, ne leur impute pas ce péché! Et, après ces paroles, il s’endormit."]],"Actes 7:2-4":[[2,"Étienne répondit: Hommes frères et pères, écoutez! Le Dieu de gloire apparut à notre père Abraham, lorsqu’il était en Mésopotamie, avant qu’il s’établît à Charran; et il lui dit:"],[3,"Quitte ton pays et ta famille, et va dans le pays que je te montrerai."],[4,"Il sortit alors du pays des Chaldéens, et s’établit à Charran. De là, après la mort de son père, Dieu le fit passer dans ce pays que vous habitez maintenant;"]],"Jean 7:5":[[5,"Car ses frères non plus ne croyaient pas en lui."]],"1 Corinthiens 15:7":[[7,"Ensuite, il est apparu à Jacques, puis à tous les apôtres."]],"Actes 15:13-19":[[13,"Lorsqu’ils eurent cessé de parler, Jacques prit la parole, et dit: Hommes frères, écoutez-moi!"],[14,"Simon a raconté comment Dieu a d’abord jeté les regards sur les nations pour choisir du milieu d’elles un peuple qui portât son nom."],[15,"Et avec cela s’accordent les paroles des prophètes, selon qu’il est écrit:"],[16,"Après cela, je reviendrai, et je relèverai de sa chute la tente de David, J’en réparerai les ruines, et je la redresserai,"],[17,"Afin que le reste des hommes cherche le Seigneur, Ainsi que toutes les nations sur lesquelles mon nom est invoqué, Dit le Seigneur, qui fait ces choses,"],[18,"Et à qui elles sont connues de toute éternité."],[19,"C’est pourquoi je suis d’avis qu’on ne crée pas des difficultés à ceux des païens qui se convertissent à Dieu,"]],"Actes 4:36":[[36,"Joseph, surnommé par les apôtres Barnabas, ce qui signifie fils d’exhortation, Lévite, originaire de Chypre,"]],"Actes 9:27":[[27,"Alors Barnabas, l’ayant pris avec lui, le conduisit vers les apôtres, et leur raconta comment sur le chemin Saul avait vu le Seigneur, qui lui avait parlé, et comment à Damas il avait prêché franchement au nom de Jésus."]],"Actes 4:36-37":[[36,"Joseph, surnommé par les apôtres Barnabas, ce qui signifie fils d’exhortation, Lévite, originaire de Chypre,"],[37,"vendit un champ qu’il possédait, apporta l’argent, et le déposa aux pieds des apôtres."]],"Actes 13:2":[[2,"Pendant qu’ils servaient le Seigneur dans leur ministère et qu’ils jeûnaient, le Saint-Esprit dit: Mettez-moi à part Barnabas et Saul pour l’œuvre à laquelle je les ai appelés."]],"Actes 22:3":[[3,"je suis Juif, né à Tarse en Cilicie; mais j’ai été élevé dans cette ville-ci, et instruit aux pieds de Gamaliel dans la connaissance exacte de la loi de nos pères, étant plein de zèle pour Dieu, comme vous l’êtes tous aujourd’hui."]],"Actes 5:38-39":[[38,"Et maintenant, je vous le dis ne vous occupez plus de ces hommes, et laissez-les aller. Si cette entreprise ou cette œuvre vient des hommes, elle se détruira;"],[39,"mais si elle vient de Dieu, vous ne pourrez la détruire. Ne courez pas le risque d’avoir combattu contre Dieu."]],"Actes 5:34-39":[[34,"Mais un pharisien, nommé Gamaliel, docteur de la loi, estimé de tout le peuple, se leva dans le sanhédrin, et ordonna de faire sortir un instant les apôtres."],[35,"Puis il leur dit: Hommes Israélites, prenez garde à ce que vous allez faire à l’égard de ces gens."],[36,"Car, il n’y a pas longtemps que parut Theudas, qui se donnait pour quelque chose, et auquel se rallièrent environ quatre cents hommes: il fut tué, et tous ceux qui l’avaient suivi furent mis en déroute et réduits à rien."],[37,"Après lui, parut Judas le Galiléen, à l’époque du recensement, et il attira du monde à son parti: il périt aussi, et tous ceux qui l’avaient suivi furent dispersés."],[38,"Et maintenant, je vous le dis ne vous occupez plus de ces hommes, et laissez-les aller. Si cette entreprise ou cette œuvre vient des hommes, elle se détruira;"],[39,"mais si elle vient de Dieu, vous ne pourrez la détruire. Ne courez pas le risque d’avoir combattu contre Dieu."]],"Actes 8:1-3":[[1,"Saul avait approuvé le meurtre d’Étienne. Il y eut, ce jour-là, une grande persécution contre l’Église de Jérusalem; et tous, excepté les apôtres, se dispersèrent dans les contrées de la Judée et de la Samarie."],[2,"Des hommes pieux ensevelirent Étienne, et le pleurèrent à grand bruit."],[3,"Saul, de son côté, ravageait l’Église; pénétrant dans les maisons, il en arrachait hommes et femmes, et les faisait jeter en prison."]],"Actes 9:4":[[4,"Il tomba par terre, et il entendit une voix qui lui disait: Saul, Saul, pourquoi me persécutes-tu?"]],"Romains 8:38-39":[[38,"Car j’ai l’assurance que ni la mort ni la vie, ni les anges ni les dominations, ni les choses présentes ni les choses à venir,"],[39,"ni les puissances, ni la hauteur, ni la profondeur, ni aucune autre créature ne pourra nous séparer de l’amour de Dieu manifesté en Jésus-Christ notre Seigneur."]],"Actes 28:16":[[16,"Lorsque nous fûmes arrivés à Rome, on permit à Paul de demeurer en son particulier, avec un soldat qui le gardait."]],"2 Timothée 4:7":[[7,"J’ai combattu le bon combat, j’ai achevé la course, j’ai gardé la foi."]],"Actes 9:3-6":[[3,"Comme il était en chemin, et qu’il approchait de Damas, tout à coup une lumière venant du ciel resplendit autour de lui."],[4,"Il tomba par terre, et il entendit une voix qui lui disait: Saul, Saul, pourquoi me persécutes-tu?"],[5,"Il répondit: Qui es-tu, Seigneur? Et le Seigneur dit: Je suis Jésus que tu persécutes. Il te serait dur de regimber contre les aiguillons."],[6,"Tremblant et saisi d’effroi, il dit: Seigneur, que veux-tu que je fasse? Et le Seigneur lui dit: Lève-toi, entre dans la ville, et on te dira ce que tu dois faire."]],"Actes 16:1":[[1,"Il se rendit ensuite à Derbe et à Lystre. Et voici, il y avait là un disciple nommé Timothée, fils d’une femme juive fidèle et d’un père grec."]],"1 Timothée 4:12":[[12,"Que personne ne méprise ta jeunesse; mais sois un modèle pour les fidèles, en parole, en conduite, en charité, en foi, en pureté."]],"Actes 16:1-3":[[1,"Il se rendit ensuite à Derbe et à Lystre. Et voici, il y avait là un disciple nommé Timothée, fils d’une femme juive fidèle et d’un père grec."],[2,"Les frères de Lystre et d’Icone rendaient de lui un bon témoignage."],[3,"Paul voulut l’emmener avec lui; et, l’ayant pris, il le circoncit, à cause des Juifs qui étaient dans ces lieux-là, car tous savaient que son père était grec."]],"Colossiens 4:14":[[14,"Luc, le médecin bien-aimé, vous salue, ainsi que Démas."]],"Luc 1:3":[[3,"il m’a aussi semblé bon, après avoir fait des recherches exactes sur toutes ces choses depuis leur origine, de te les exposer par écrit d’une manière suivie, excellent Théophile,"]],"Luc 1:1-4":[[1,"Plusieurs ayant entrepris de composer un récit des événements qui se sont accomplis parmi nous,"],[2,"suivant ce que nous ont transmis ceux qui ont été des témoins oculaires dès le commencement et sont devenus des ministres de la parole,"],[3,"il m’a aussi semblé bon, après avoir fait des recherches exactes sur toutes ces choses depuis leur origine, de te les exposer par écrit d’une manière suivie, excellent Théophile,"],[4,"afin que tu reconnaisses la certitude des enseignements que tu as reçus."]],"Genèse 1:1":[[1,"Au commencement, Dieu créa les cieux et la terre."]],"Genèse 11:9":[[9,"C’est pourquoi on l’appela du nom de Babel, car c’est là que l’Éternel confondit le langage de toute la terre, et c’est de là que l’Éternel les dispersa sur la face de toute la terre."]],"Genèse 12:4":[[4,"Abram partit, comme l’Éternel le lui avait dit, et Lot partit avec lui. Abram était âgé de soixante-quinze ans, lorsqu’il sortit de Charan."]],"Genèse 37:28":[[28,"Au passage des marchands madianites, ils tirèrent et firent remonter Joseph hors de la citerne; et ils le vendirent pour vingt sicles d’argent aux Ismaélites, qui l’emmenèrent en Égypte."]],"Josué 3:17":[[17,"Les sacrificateurs qui portaient l’arche de l’alliance de l’Éternel s’arrêtèrent de pied ferme sur le sec, au milieu du Jourdain, pendant que tout Israël passait à sec, jusqu’à ce que toute la nation eût achevé de passer le Jourdain."]],"1 Rois 12:16":[[16,"Lorsque tout Israël vit que le roi ne l’écoutait pas, le peuple répondit au roi: Quelle part avons-nous avec David? Nous n’avons point d’héritage avec le fils d’Isaï! A tes tentes, Israël! Maintenant, pourvois à ta maison, David! Et Israël s’en alla dans ses tentes."]],"2 Rois 17:6":[[6,"La neuvième année d’Osée, le roi d’Assyrie prit Samarie, et emmena Israël captif en Assyrie. Il les fit habiter à Chalach, et sur le Chabor, fleuve de Gozan, et dans les villes des Mèdes."]],"2 Rois 25:8-9":[[8,"Le septième jour du cinquième mois, c’était la dix-neuvième année du règne de Nebucadnetsar, roi de Babylone, Nebuzaradan, chef des gardes, serviteur du roi de Babylone, entra dans Jérusalem."],[9,"Il brûla la maison de l’Éternel, la maison du roi, et toutes les maisons de Jérusalem; il livra au feu toutes les maisons de quelque importance."]],"Esdras 1:1":[[1,"La première année de Cyrus, roi de Perse, afin que s’accomplît la parole de l’Éternel prononcée par la bouche de Jérémie, l’Éternel réveilla l’esprit de Cyrus, roi de Perse, qui fit faire de vive voix et par écrit cette publication dans tout son royaume:"]],"Luc 2:7":[[7,"et elle enfanta son fils premier-né. Elle l’emmaillota, et le coucha dans une crèche, parce qu’il n’y avait pas de place pour eux dans l’hôtellerie."]],"Luc 24:6":[[6,"Il n’est point ici, mais il est ressuscité. Souvenez-vous de quelle manière il vous a parlé, lorsqu’il était encore en Galilée,"]],"Luc 21:6":[[6,"Les jours viendront où, de ce que vous voyez, il ne restera pas pierre sur pierre qui ne soit renversée."]],"Genèse 5:28":[[28,"Lémec, âgé de cent quatre-vingt-deux ans, engendra un fils."]],"Genèse 5:23-24":[[23,"Tous les jours d’Hénoc furent de trois cent soixante-cinq ans."],[24,"Hénoc marcha avec Dieu; puis il ne fut plus, parce que Dieu le prit."]],"Genèse 11:26":[[26,"Térach, âgé de soixante-dix ans, engendra Abram, Nachor et Haran."]],"Daniel 10:1":[[1,"La troisième année de Cyrus, roi de Perse, une parole fut révélée à Daniel, qu’on nommait Beltschatsar. Cette parole, qui est véritable, annonce une grande calamité. Il fut attentif à cette parole, et il eut l’intelligence de la vision."]],"Actes 7:58":[[58,"le traînèrent hors de la ville, et le lapidèrent. Les témoins déposèrent leurs vêtements aux pieds d’un jeune homme nommé Saul."]],"Galates 4:4":[[4,"mais, lorsque les temps ont été accomplis, Dieu a envoyé son Fils, né d’une femme, né sous la loi,"]],"1 Jean 3:8":[[8,"Celui qui pèche est du diable, car le diable pèche dès le commencement. Le Fils de Dieu a paru afin de détruire les œuvres du diable."]],"Genèse 12:3":[[3,"Je bénirai ceux qui te béniront, et je maudirai ceux qui te maudiront; et toutes les familles de la terre seront bénies en toi."]],"Galates 3:8":[[8,"Aussi l’Écriture, prévoyant que Dieu justifierait les païens par la foi, a d’avance annoncé cette bonne nouvelle à Abraham: Toutes les nations seront bénies en toi!"]],"Galates 3:16":[[16,"Or les promesses ont été faites à Abraham et à sa postérité. Il n’est pas dit: et aux postérités, comme s’il s’agissait de plusieurs, mais en tant qu’il s’agit d’une seule: et à ta postérité, c’est-à-dire, à Christ."]],"Hébreux 7:14":[[14,"car il est notoire que notre Seigneur est sorti de Juda, tribu dont Moïse n’a rien dit pour ce qui concerne le sacerdoce."]],"Deutéronome 18:15":[[15,"L’Éternel, ton Dieu, te suscitera du milieu de toi, d’entre tes frères, un prophète comme moi: vous l’écouterez!"]],"Actes 3:20-22":[[20,"afin que des temps de rafraîchissement viennent de la part du Seigneur, et qu’il envoie celui qui vous a été destiné, Jésus-Christ,"],[21,"que le ciel doit recevoir jusqu’aux temps du rétablissement de toutes choses, dont Dieu a parlé anciennement par la bouche de ses saints prophètes."],[22,"Moïse a dit: Le Seigneur votre Dieu vous suscitera d’entre vos frères un prophète comme moi; vous l’écouterez dans tout ce qu’il vous dira,"]],"Jean 6:14":[[14,"Ces gens, ayant vu le miracle que Jésus avait fait, disaient: Celui-ci est vraiment le prophète qui doit venir dans le monde."]],"Actes 3:22":[[22,"Moïse a dit: Le Seigneur votre Dieu vous suscitera d’entre vos frères un prophète comme moi; vous l’écouterez dans tout ce qu’il vous dira,"]],"2 Samuel 7:12-13":[[12,"Quand tes jours seront accomplis et que tu seras couché avec tes pères, j’élèverai ta postérité après toi, celui qui sera sorti de tes entrailles, et j’affermirai son règne."],[13,"Ce sera lui qui bâtira une maison à mon nom, et j’affermirai pour toujours le trône de son royaume."]],"Luc 1:31-33":[[31,"Et voici, tu deviendras enceinte, et tu enfanteras un fils, et tu lui donneras le nom de Jésus."],[32,"Il sera grand et sera appelé Fils du Très-Haut, et le Seigneur Dieu lui donnera le trône de David, son père."],[33,"Il régnera sur la maison de Jacob éternellement, et son règne n’aura point de fin."]],"Matthieu 1:1":[[1,"Généalogie de Jésus-Christ, fils de David, fils d’Abraham."]],"Luc 1:32":[[32,"Il sera grand et sera appelé Fils du Très-Haut, et le Seigneur Dieu lui donnera le trône de David, son père."]],"Jérémie 31:15":[[15,"Ainsi parle l’Éternel: On entend des cris à Rama, Des lamentations, des larmes amères; Rachel pleure ses enfants; Elle refuse d’être consolée sur ses enfants, Car ils ne sont plus."]],"Matthieu 2:16-18":[[16,"Alors Hérode, voyant qu’il avait été joué par les mages, se mit dans une grande colère, et il envoya tuer tous les enfants de deux ans et au-dessous qui étaient à Bethléhem et dans tout son territoire, selon la date dont il s’était soigneusement enquis auprès des mages."],[17,"Alors s’accomplit ce qui avait été annoncé par Jérémie, le prophète:"],[18,"On a entendu des cris à Rama, Des pleurs et de grandes lamentations: Rachel pleure ses enfants, Et n’a pas voulu être consolée, Parce qu’ils ne sont plus."]],"Matthieu 1:22-23":[[22,"Tout cela arriva afin que s’accomplît ce que le Seigneur avait annoncé par le prophète:"],[23,"Voici, la vierge sera enceinte, elle enfantera un fils, Et on lui donnera le nom d’Emmanuel, ce qui signifie Dieu avec nous."]],"Ésaïe 9:5-6":[[5,"Car un enfant nous est né, un fils nous est donné, Et la domination reposera sur son épaule; On l’appellera Admirable, Conseiller, Dieu puissant, Père éternel, Prince de la paix."],[6,"Donner à l’empire de l’accroissement, Et une paix sans fin au trône de David et à son royaume, L’affermir et le soutenir par le droit et par la justice, Dès maintenant et à toujours: Voilà ce que fera le zèle de l’Éternel des armées."]],"Luc 2:11":[[11,"c’est qu’aujourd’hui, dans la ville de David, il vous est né un Sauveur, qui est le Christ, le Seigneur."]],"Matthieu 2:4-6":[[4,"Il assembla tous les principaux sacrificateurs et les scribes du peuple, et il s’informa auprès d’eux où devait naître le Christ."],[5,"Ils lui dirent: A Bethléhem en Judée; car voici ce qui a été écrit par le prophète:"],[6,"Et toi, Bethléhem, terre de Juda, Tu n’es certes pas la moindre entre les principales villes de Juda, Car de toi sortira un chef Qui paîtra Israël, mon peuple."]],"Luc 2:4-7":[[4,"Joseph aussi monta de la Galilée, de la ville de Nazareth, pour se rendre en Judée, dans la ville de David, appelée Bethléhem, parce qu’il était de la maison et de la famille de David,"],[5,"afin de se faire inscrire avec Marie, sa fiancée, qui était enceinte."],[6,"Pendant qu’ils étaient là, le temps où Marie devait accoucher arriva,"],[7,"et elle enfanta son fils premier-né. Elle l’emmaillota, et le coucha dans une crèche, parce qu’il n’y avait pas de place pour eux dans l’hôtellerie."]],"Matthieu 2:5-6":[[5,"Ils lui dirent: A Bethléhem en Judée; car voici ce qui a été écrit par le prophète:"],[6,"Et toi, Bethléhem, terre de Juda, Tu n’es certes pas la moindre entre les principales villes de Juda, Car de toi sortira un chef Qui paîtra Israël, mon peuple."]],"Matthieu 2:14-15":[[14,"Joseph se leva, prit de nuit le petit enfant et sa mère, et se retira en Égypte."],[15,"Il y resta jusqu’à la mort d’Hérode, afin que s’accomplît ce que le Seigneur avait annoncé par le prophète: J’ai appelé mon fils hors d’Égypte."]],"Ésaïe 40:3":[[3,"Une voix crie: Préparez au désert le chemin de l’Éternel, Aplanissez dans les lieux arides Une route pour notre Dieu."]],"Matthieu 3:1-3":[[1,"En ce temps-là parut Jean-Baptiste, prêchant dans le désert de Judée."],[2,"Il disait: Repentez-vous, car le royaume des cieux est proche."],[3,"Jean est celui qui avait été annoncé par Ésaïe, le prophète, lorsqu’il dit: C’est ici la voix de celui qui crie dans le désert: Préparez le chemin du Seigneur, Aplanissez ses sentiers."]],"Ésaïe 61:1-2":[[1,"L’esprit du Seigneur, l’Éternel, est sur moi, Car l’Éternel m’a oint pour porter de bonnes nouvelles aux malheureux; Il m’a envoyé pour guérir ceux qui ont le cœur brisé, Pour proclamer aux captifs la liberté, Et aux prisonniers la délivrance;"],[2,"Pour publier une année de grâce de l’Éternel, Et un jour de vengeance de notre Dieu; Pour consoler tous les affligés;"]],"Luc 4:17-21":[[17,"et on lui remit le livre du prophète Ésaïe. L’ayant déroulé, il trouva l’endroit où il était écrit:"],[18,"L’Esprit du Seigneur est sur moi, Parce qu’il m’a oint pour annoncer une bonne nouvelle aux pauvres; Il m’a envoyé pour guérir ceux qui ont le cœur brisé, Pour proclamer aux captifs la délivrance, Et aux aveugles le recouvrement de la vue, Pour renvoyer libres les opprimés,"],[19,"Pour publier une année de grâce du Seigneur."],[20,"Ensuite, il roula le livre, le remit au serviteur, et s’assit. Tous ceux qui se trouvaient dans la synagogue avaient les regards fixés sur lui."],[21,"Alors il commença à leur dire: Aujourd’hui cette parole de l’Écriture, que vous venez d’entendre, est accomplie."]],"Luc 4:21":[[21,"Alors il commença à leur dire: Aujourd’hui cette parole de l’Écriture, que vous venez d’entendre, est accomplie."]],"Matthieu 21:4-5":[[4,"Or, ceci arriva afin que s’accomplît ce qui avait été annoncé par le prophète:"],[5,"Dites à la fille de Sion: Voici, ton roi vient à toi, Plein de douceur, et monté sur un âne, Sur un ânon, le petit d’une ânesse."]],"Jean 12:14-15":[[14,"Jésus trouva un ânon, et s’assit dessus, selon ce qui est écrit:"],[15,"Ne crains point, fille de Sion; Voici, ton roi vient, Assis sur le petit d’une ânesse."]],"Psaume 41:10":[[10,"Celui-là même avec qui j’étais en paix, Qui avait ma confiance et qui mangeait mon pain, Lève le talon contre moi."]],"Jean 13:18":[[18,"Ce n’est pas de vous tous que je parle; je connais ceux que j’ai choisis. Mais il faut que l’Écriture s’accomplisse: Celui qui mange avec moi le pain A levé son talon contre moi."]],"Jean 13:26":[[26,"Jésus répondit: C’est celui à qui je donnerai le morceau trempé. Et, ayant trempé le morceau, il le donna à Judas, fils de Simon, l’Iscariot."]],"Zacharie 11:12-13":[[12,"Je leur dis: Si vous le trouvez bon, donnez-moi mon salaire; sinon, ne le donnez pas. Et ils pesèrent pour mon salaire trente sicles d’argent."],[13,"L’Éternel me dit: Jette-le au potier, ce prix magnifique auquel ils m’ont estimé! Et je pris les trente sicles d’argent, et je les jetai dans la maison de l’Éternel, pour le potier."]],"Matthieu 26:14-15":[[14,"Alors l’un des douze, appelé Judas Iscariot, alla vers les principaux sacrificateurs,"],[15,"et dit: Que voulez-vous me donner, et je vous le livrerai? Et ils lui payèrent trente pièces d’argent."]],"Matthieu 27:5-7":[[5,"Judas jeta les pièces d’argent dans le temple, se retira, et alla se pendre."],[6,"Les principaux sacrificateurs les ramassèrent, et dirent: Il n’est pas permis de les mettre dans le trésor sacré, puisque c’est le prix du sang."],[7,"Et, après en avoir délibéré, ils achetèrent avec cet argent le champ du potier, pour la sépulture des étrangers."]],"Ésaïe 50:6":[[6,"J’ai livré mon dos à ceux qui me frappaient, Et mes joues à ceux qui m’arrachaient la barbe; Je n’ai pas dérobé mon visage Aux ignominies et aux crachats."]],"Matthieu 26:67":[[67,"Là-dessus, ils lui crachèrent au visage, et lui donnèrent des coups de poing et des soufflets en disant:"]],"Matthieu 27:26":[[26,"Alors Pilate leur relâcha Barabbas; et, après avoir fait battre de verges Jésus, il le livra pour être crucifié."]],"1 Pierre 2:24":[[24,"lui qui a porté lui-même nos péchés en son corps sur le bois, afin que morts aux péchés nous vivions pour la justice; lui par les meurtrissures duquel vous avez été guéris."]],"Ésaïe 53:7":[[7,"Il a été maltraité et opprimé, Et il n’a point ouvert la bouche, Semblable à un agneau qu’on mène à la boucherie, A une brebis muette devant ceux qui la tondent; Il n’a point ouvert la bouche."]],"Actes 8:32-35":[[32,"Le passage de l’Écriture qu’il lisait était celui-ci: Il a été mené comme une brebis à la boucherie; Et, comme un agneau muet devant celui qui le tond, Il n’a point ouvert la bouche."],[33,"Dans son humiliation, son jugement a été levé. Et sa postérité, qui la dépeindra? Car sa vie a été retranchée de la terre."],[34,"L’eunuque dit à Philippe: Je te prie, de qui le prophète parle-t-il ainsi? Est-ce de lui-même, ou de quelque autre?"],[35,"Alors Philippe, ouvrant la bouche et commençant par ce passage, lui annonça la bonne nouvelle de Jésus."]],"Marc 15:4-5":[[4,"Pilate l’interrogea de nouveau: Ne réponds-tu rien? Vois de combien de choses ils t’accusent."],[5,"Et Jésus ne fit plus aucune réponse, ce qui étonna Pilate."]],"Actes 8:35":[[35,"Alors Philippe, ouvrant la bouche et commençant par ce passage, lui annonça la bonne nouvelle de Jésus."]],"Ésaïe 53:9":[[9,"On a mis son sépulcre parmi les méchants, Son tombeau avec le riche, Quoiqu’il n’eût point commis de violence Et qu’il n’y eût point de fraude dans sa bouche."]],"Matthieu 27:57-60":[[57,"Le soir étant venu, arriva un homme riche d’Arimathée, nommé Joseph, lequel était aussi disciple de Jésus."],[58,"Il se rendit vers Pilate, et demanda le corps de Jésus. Et Pilate ordonna de le remettre."],[59,"Joseph prit le corps, l’enveloppa d’un linceul blanc,"],[60,"et le déposa dans un sépulcre neuf, qu’il s’était fait tailler dans le roc. Puis il roula une grande pierre à l’entrée du sépulcre, et il s’en alla."]],"Psaume 22:2":[[2,"Mon Dieu! Mon Dieu! Pourquoi m’as-tu abandonné, Et t’éloignes-tu sans me secourir, sans écouter mes plaintes?"]],"Matthieu 27:46":[[46,"Et vers la neuvième heure, Jésus s’écria d’une voix forte: Éli, Éli, lama sabachthani? c’est-à-dire: Mon Dieu, mon Dieu, pourquoi m’as-tu abandonné?"]],"Psaume 22:17":[[17,"Car des chiens m’environnent, Une bande de scélérats rôdent autour de moi, Ils ont percé mes mains et mes pieds."]],"Jean 20:25":[[25,"Les autres disciples lui dirent donc: Nous avons vu le Seigneur. Mais il leur dit: Si je ne vois dans ses mains la marque des clous, et si je ne mets mon doigt dans la marque des clous, et si je ne mets ma main dans son côté, je ne croirai point."]],"Luc 24:39":[[39,"Voyez mes mains et mes pieds, c’est bien moi; touchez-moi et voyez: un esprit n’a ni chair ni os, comme vous voyez que j’ai."]],"Psaume 22:19":[[19,"Ils se partagent mes vêtements, Ils tirent au sort ma tunique."]],"Jean 19:23-24":[[23,"Les soldats, après avoir crucifié Jésus, prirent ses vêtements, et ils en firent quatre parts, une part pour chaque soldat. Ils prirent aussi sa tunique, qui était sans couture, d’un seul tissu depuis le haut jusqu’en bas. Et ils dirent entre eux:"],[24,"Ne la déchirons pas, mais tirons au sort à qui elle sera. Cela arriva afin que s’accomplît cette parole de l’Écriture: Ils se sont partagé mes vêtements, Et ils ont tiré au sort ma tunique. Voilà ce que firent les soldats."]],"Psaume 34:21":[[21,"Il garde tous ses os, Aucun d’eux n’est brisé."]],"Jean 19:32-36":[[32,"Les soldats vinrent donc, et ils rompirent les jambes au premier, puis à l’autre qui avait été crucifié avec lui."],[33,"S’étant approchés de Jésus, et le voyant déjà mort, ils ne lui rompirent pas les jambes;"],[34,"mais un des soldats lui perça le côté avec une lance, et aussitôt il sortit du sang et de l’eau."],[35,"Celui qui l’a vu en a rendu témoignage, et son témoignage est vrai; et il sait qu’il dit vrai, afin que vous croyiez aussi."],[36,"Ces choses sont arrivées, afin que l’Écriture fût accomplie: Aucun de ses os ne sera brisé."]],"Exode 12:46":[[46,"On ne la mangera que dans la maison; vous n’emporterez point de chair hors de la maison, et vous ne briserez aucun os."]],"Jean 19:34-37":[[34,"mais un des soldats lui perça le côté avec une lance, et aussitôt il sortit du sang et de l’eau."],[35,"Celui qui l’a vu en a rendu témoignage, et son témoignage est vrai; et il sait qu’il dit vrai, afin que vous croyiez aussi."],[36,"Ces choses sont arrivées, afin que l’Écriture fût accomplie: Aucun de ses os ne sera brisé."],[37,"Et ailleurs l’Écriture dit encore: Ils verront celui qu’ils ont percé."]],"Apocalypse 1:7":[[7,"Voici, il vient avec les nuées. Et tout œil le verra, même ceux qui l’ont percé; et toutes les tribus de la terre se lamenteront à cause de lui. Oui. Amen!"]],"Jean 19:37":[[37,"Et ailleurs l’Écriture dit encore: Ils verront celui qu’ils ont percé."]],"Psaume 16:10":[[10,"Car tu ne livreras pas mon âme au séjour des morts, Tu ne permettras pas que ton bien-aimé voie la corruption."]],"Actes 2:29-32":[[29,"Hommes frères, qu’il me soit permis de vous dire librement, au sujet du patriarche David, qu’il est mort, qu’il a été enseveli, et que son sépulcre existe encore aujourd’hui parmi nous."],[30,"Comme il était prophète, et qu’il savait que Dieu lui avait promis avec serment de faire asseoir un de ses descendants sur son trône,"],[31,"c’est la résurrection du Christ qu’il a prévue et annoncée, en disant qu’il ne serait pas abandonné dans le séjour des morts et que sa chair ne verrait pas la corruption."],[32,"C’est ce Jésus que Dieu a ressuscité; nous en sommes tous témoins."]],"Actes 2:31":[[31,"c’est la résurrection du Christ qu’il a prévue et annoncée, en disant qu’il ne serait pas abandonné dans le séjour des morts et que sa chair ne verrait pas la corruption."]],"Psaume 110:1":[[1,"De David. Psaume. Parole de l’Éternel à mon Seigneur: Assieds-toi à ma droite, Jusqu’à ce que je fasse de tes ennemis ton marchepied."]],"Matthieu 22:43-45":[[43,"Et Jésus leur dit: Comment donc David, animé par l’Esprit, l’appelle-t-il Seigneur, lorsqu’il dit:"],[44,"Le Seigneur a dit à mon Seigneur: Assieds-toi à ma droite, Jusqu’à ce que je fasse de tes ennemis ton marchepied?"],[45,"Si donc David l’appelle Seigneur, comment est-il son fils?"]],"Hébreux 1:13":[[13,"Et auquel des anges a-t-il jamais dit: Assieds-toi à ma droite, Jusqu’à ce que je fasse de tes ennemis ton marchepied?"]],"Matthieu 22:45":[[45,"Si donc David l’appelle Seigneur, comment est-il son fils?"]],"Marc 14:61-64":[[61,"Jésus garda le silence, et ne répondit rien. Le souverain sacrificateur l’interrogea de nouveau, et lui dit: Es-tu le Christ, le Fils du Dieu béni?"],[62,"Jésus répondit: Je le suis. Et vous verrez le Fils de l’homme assis à la droite de la puissance de Dieu, et venant sur les nuées du ciel."],[63,"Alors le souverain sacrificateur déchira ses vêtements, et dit: Qu’avons-nous encore besoin de témoins?"],[64,"Vous avez entendu le blasphème. Que vous en semble? Tous le condamnèrent comme méritant la mort."]],"Luc 22:20":[[20,"Il prit de même la coupe, après le souper, et la leur donna, en disant: Cette coupe est la nouvelle alliance en mon sang, qui est répandu pour vous."]],"Hébreux 8:8-10":[[8,"Car c’est avec l’expression d’un blâme que le Seigneur dit à Israël: Voici, les jours viennent, dit le Seigneur, où je ferai avec la maison d’Israël et la maison de Juda Une alliance nouvelle,"],[9,"non comme l’alliance que je traitai avec leurs pères, le jour où je les saisis par la main pour les faire sortir du pays d’Égypte; car ils n’ont pas persévéré dans mon alliance, et moi aussi je ne me suis pas soucié d’eux, dit le Seigneur."],[10,"Mais voici l’alliance que je ferai avec la maison d’Israël, après ces jours-là, dit le Seigneur: je mettrai mes lois dans leur esprit, je les écrirai dans leur cœur; et je serai leur Dieu, et ils seront mon peuple."]],"Genèse 11:31":[[31,"Térach prit Abram, son fils, et Lot, fils d’Haran, fils de son fils, et Saraï, sa belle-fille, femme d’Abram, son fils. Ils sortirent ensemble d’Ur en Chaldée, pour aller au pays de Canaan. Ils vinrent jusqu’à Charan, et ils y habitèrent."]],"Genèse 12:6-7":[[6,"Abram parcourut le pays jusqu’au lieu nommé Sichem, jusqu’aux chênes de Moré. Les Cananéens étaient alors dans le pays."],[7,"L’Éternel apparut à Abram, et dit: Je donnerai ce pays à ta postérité. Et Abram bâtit là un autel à l’Éternel, qui lui était apparu."]],"Genèse 12:8":[[8,"Il se transporta de là vers la montagne, à l’orient de Béthel, et il dressa ses tentes, ayant Béthel à l’occident et Aï à l’orient. Il bâtit encore là un autel à l’Éternel, et il invoqua le nom de l’Éternel."]],"Genèse 12:10":[[10,"Il y eut une famine dans le pays; et Abram descendit en Égypte pour y séjourner, car la famine était grande dans le pays."]],"Genèse 13:18":[[18,"Abram leva ses tentes, et vint habiter parmi les chênes de Mamré, qui sont près d’Hébron. Et il bâtit là un autel à l’Éternel."]],"Genèse 15:18":[[18,"En ce jour-là, l’Éternel fit alliance avec Abram, et dit: Je donne ce pays à ta postérité, depuis le fleuve d’Égypte jusqu’au grand fleuve, au fleuve d’Euphrate,"]],"2 Chroniques 3:1":[[1,"Salomon commença à bâtir la maison de l’Éternel à Jérusalem, sur la montagne de Morija, qui avait été indiquée à David, son père, dans le lieu préparé par David sur l’aire d’Ornan, le Jébusien."]],"Genèse 22:2":[[2,"Dieu dit: Prends ton fils, ton unique, celui que tu aimes, Isaac; va-t’en au pays de Morija, et là offre-le en holocauste sur l’une des montagnes que je te dirai."]],"Genèse 22:14":[[14,"Abraham donna à ce lieu le nom de Jehova-Jiré. C’est pourquoi l’on dit aujourd’hui: A la montagne de l’Éternel il sera pourvu."]],"Genèse 28:10":[[10,"Jacob partit de Beer-Schéba, et s’en alla à Charan."]],"Genèse 28:12-16":[[12,"Il eut un songe. Et voici, une échelle était appuyée sur la terre, et son sommet touchait au ciel. Et voici, les anges de Dieu montaient et descendaient par cette échelle."],[13,"Et voici, l’Éternel se tenait au-dessus d’elle; et il dit: Je suis l’Éternel, le Dieu d’Abraham, ton père, et le Dieu d’Isaac. La terre sur laquelle tu es couché, je la donnerai à toi et à ta postérité."],[14,"Ta postérité sera comme la poussière de la terre; tu t’étendras à l’occident et à l’orient, au septentrion et au midi; et toutes les familles de la terre seront bénies en toi et en ta postérité."],[15,"Voici, je suis avec toi, je te garderai partout où tu iras, et je te ramènerai dans ce pays; car je ne t’abandonnerai point, que je n’aie exécuté ce que je te dis."],[16,"Jacob s’éveilla de son sommeil et il dit: Certainement, l’Éternel est en ce lieu, et moi, je ne le savais pas!"]],"Genèse 29:18-20":[[18,"Jacob aimait Rachel, et il dit: Je te servirai sept ans pour Rachel, ta fille cadette."],[19,"Et Laban dit: J’aime mieux te la donner que de la donner à un autre homme. Reste chez moi!"],[20,"Ainsi Jacob servit sept années pour Rachel: et elles furent à ses yeux comme quelques jours, parce qu’il l’aimait."]],"Genèse 33:18-20":[[18,"A son retour de Paddan-Aram, Jacob arriva heureusement à la ville de Sichem, dans le pays de Canaan, et il campa devant la ville."],[19,"Il acheta la portion du champ où il avait dressé sa tente, des fils d’Hamor, père de Sichem, pour cent kesita."],[20,"Et là, il éleva un
