s de Merari: Machli et Muschi. Ce sont là les familles de Lévi, avec leur postérité."],[20,"Amram prit pour femme Jokébed, sa tante; et elle lui enfanta Aaron, et Moïse. Les années de la vie d’Amram furent de cent trente-sept ans."]],"Genèse 29:34":[[34,"Elle devint encore enceinte, et enfanta un fils, et elle dit: Pour cette fois, mon mari s’attachera à moi; car je lui ai enfanté trois fils. C’est pourquoi on lui donna le nom de Lévi."]],"Genèse 37:26-27":[[26,"Alors Juda dit à ses frères: Que gagnerons-nous à tuer notre frère et à cacher son sang?"],[27,"Venez, vendons-le aux Ismaélites, et ne mettons pas la main sur lui, car il est notre frère, notre chair. Et ses frères l’écoutèrent."]],"Genèse 44:33":[[33,"Permets donc, je te prie, à ton serviteur de rester à la place de l’enfant, comme esclave de mon seigneur; et que l’enfant remonte avec ses frères."]],"Apocalypse 5:5":[[5,"Et l’un des vieillards me dit: Ne pleure point; voici, le lion de la tribu de Juda, le rejeton de David, a vaincu pour ouvrir le livre et ses sept sceaux."]],"Genèse 38:26":[[26,"Juda les reconnut, et dit: Elle est moins coupable que moi, puisque je ne l’ai pas donnée à Schéla, mon fils. Et il ne la connut plus."]],"Ruth 4:18-22":[[18,"Voici la postérité de Pérets. Pérets engendra Hetsron;"],[19,"Hetsron engendra Ram; Ram engendra Amminadab;"],[20,"Amminadab engendra Nachschon; Nachschon engendra Salmon;"],[21,"Salmon engendra Boaz; Boaz engendra Obed;"],[22,"Obed engendra Isaï; et Isaï engendra David."]],"Matthieu 1:3":[[3,"Juda engendra de Thamar Pharès et Zara; Pharès engendra Esrom; Esrom engendra Aram;"]],"Genèse 38:26-30":[[26,"Juda les reconnut, et dit: Elle est moins coupable que moi, puisque je ne l’ai pas donnée à Schéla, mon fils. Et il ne la connut plus."],[27,"Quand elle fut au moment d’accoucher, voici, il y avait deux jumeaux dans son ventre."],[28,"Et pendant l’accouchement il y en eut un qui présenta la main; la sage-femme la prit, et y attacha un fil cramoisi, en disant: Celui-ci sort le premier."],[29,"Mais il retira la main, et son frère sortit. Alors la sage-femme dit: Quelle brèche tu as faite! Et elle lui donna le nom de Pérets."],[30,"Ensuite sortit son frère, qui avait à la main le fil cramoisi; et on lui donna le nom de Zérach."]],"Genèse 50:26":[[26,"Joseph mourut, âgé de cent dix ans. On l’embauma, et on le mit dans un cercueil en Égypte."]],"Genèse 37:2-28":[[2,"Voici la postérité de Jacob. Joseph, âgé de dix-sept ans, faisait paître le troupeau avec ses frères; cet enfant était auprès des fils de Bilha et des fils de Zilpa, femmes de son père. Et Joseph rapportait à leur père leurs mauvais propos."],[3,"Israël aimait Joseph plus que tous ses autres fils, parce qu’il l’avait eu dans sa vieillesse; et il lui fit une tunique de plusieurs couleurs."],[4,"Ses frères virent que leur père l’aimait plus qu’eux tous, et ils le prirent en haine. Ils ne pouvaient lui parler avec amitié."],[5,"Joseph eut un songe, et il le raconta à ses frères, qui le haïrent encore davantage."],[6,"Il leur dit: Écoutez donc ce songe que j’ai eu!"],[7,"Nous étions à lier des gerbes au milieu des champs; et voici, ma gerbe se leva et se tint debout, et vos gerbes l’entourèrent et se prosternèrent devant elle."],[8,"Ses frères lui dirent: Est-ce que tu régneras sur nous? Est-ce que tu nous gouverneras? Et ils le haïrent encore davantage, à cause de ses songes et à cause de ses paroles."],[9,"Il eut encore un autre songe, et il le raconta à ses frères. Il dit: J’ai eu encore un songe! Et voici, le soleil, la lune et onze étoiles se prosternaient devant moi."],[10,"Il le raconta à son père et à ses frères. Son père le réprimanda, et lui dit: Que signifie ce songe que tu as eu? Faut-il que nous venions, moi, ta mère et tes frères, nous prosterner en terre devant toi?"],[11,"Ses frères eurent de l’envie contre lui, mais son père garda le souvenir de ces choses."],[12,"Les frères de Joseph étant allés à Sichem, pour faire paître le troupeau de leur père,"],[13,"Israël dit à Joseph: Tes frères ne font-ils pas paître le troupeau à Sichem? Viens, je veux t’envoyer vers eux. Et il répondit: Me voici!"],[14,"Israël lui dit: Va, je te prie, et vois si tes frères sont en bonne santé et si le troupeau est en bon état; et tu m’en rapporteras des nouvelles. Il l’envoya ainsi de la vallée d’Hébron; et Joseph alla à Sichem."],[15,"Un homme le rencontra, comme il errait dans les champs. Il le questionna, en disant: Que cherches-tu?"],[16,"Joseph répondit: Je cherche mes frères; dis-moi, je te prie, où ils font paître leur troupeau."],[17,"Et l’homme dit: Ils sont partis d’ici; car je les ai entendus dire: Allons à Dothan. Joseph alla après ses frères, et il les trouva à Dothan."]],"Genèse 41:39-46":[[39,"Et Pharaon dit à Joseph: Puisque Dieu t’a fait connaître toutes ces choses, il n’y a personne qui soit aussi intelligent et aussi sage que toi."],[40,"Je t’établis sur ma maison, et tout mon peuple obéira à tes ordres. Le trône seul m’élèvera au-dessus de toi."],[41,"Pharaon dit à Joseph: Vois, je te donne le commandement de tout le pays d’Égypte."],[42,"Pharaon ôta son anneau de la main, et le mit à la main de Joseph; il le revêtit d’habits de fin lin, et lui mit un collier d’or au cou."],[43,"Il le fit monter sur le char qui suivait le sien; et l’on criait devant lui: A genoux! C’est ainsi que Pharaon lui donna le commandement de tout le pays d’Égypte."],[44,"Il dit encore à Joseph: Je suis Pharaon! Et sans toi personne ne lèvera la main ni le pied dans tout le pays d’Égypte."],[45,"Pharaon appela Joseph du nom de Tsaphnath-Paenéach; et il lui donna pour femme Asnath, fille de Poti-Phéra, prêtre d’On. Et Joseph partit pour visiter le pays d’Égypte."],[46,"Joseph était âgé de trente ans lorsqu’il se présenta devant Pharaon, roi d’Égypte; et il quitta Pharaon, et parcourut tout le pays d’Égypte."]],"Genèse 50:20":[[20,"Vous aviez médité de me faire du mal: Dieu l’a changé en bien, pour accomplir ce qui arrive aujourd’hui, pour sauver la vie à un peuple nombreux."]],"Genèse 50:25":[[25,"Joseph fit jurer les fils d’Israël, en disant: Dieu vous visitera; et vous ferez remonter mes os loin d’ici."]],"Hébreux 11:22":[[22,"C’est par la foi que Joseph mourant fit mention de la sortie des fils d’Israël, et qu’il donna des ordres au sujet de ses os."]],"Genèse 37:3-4":[[3,"Israël aimait Joseph plus que tous ses autres fils, parce qu’il l’avait eu dans sa vieillesse; et il lui fit une tunique de plusieurs couleurs."],[4,"Ses frères virent que leur père l’aimait plus qu’eux tous, et ils le prirent en haine. Ils ne pouvaient lui parler avec amitié."]],"Genèse 45:4-8":[[4,"Joseph dit à ses frères: Approchez-vous de moi. Et ils s’approchèrent. Il dit: Je suis Joseph, votre frère, que vous avez vendu pour être mené en Égypte."],[5,"Maintenant, ne vous affligez pas, et ne soyez pas fâchés de m’avoir vendu pour être conduit ici, car c’est pour vous sauver la vie que Dieu m’a envoyé devant vous."],[6,"Voilà deux ans que la famine est dans le pays; et pendant cinq années encore, il n’y aura ni labour, ni moisson."],[7,"Dieu m’a envoyé devant vous pour vous faire subsister dans le pays, et pour vous faire vivre par une grande délivrance."],[8,"Ce n’est donc pas vous qui m’avez envoyé ici, mais c’est Dieu; il m’a établi père de Pharaon, maître de toute sa maison, et gouverneur de tout le pays d’Égypte."]],"Genèse 50:24-26":[[24,"Joseph dit à ses frères: Je vais mourir! Mais Dieu vous visitera, et il vous fera remonter de ce pays-ci dans le pays qu’il a juré de donner à Abraham, à Isaac et à Jacob."],[25,"Joseph fit jurer les fils d’Israël, en disant: Dieu vous visitera; et vous ferez remonter mes os loin d’ici."],[26,"Joseph mourut, âgé de cent dix ans. On l’embauma, et on le mit dans un cercueil en Égypte."]],"Philippiens 3:5":[[5,"moi, circoncis le huitième jour, de la race d’Israël, de la tribu de Benjamin, Hébreu né d’Hébreux; quant à la loi, pharisien;"]],"Genèse 35:16-18":[[16,"Ils partirent de Béthel; et il y avait encore une certaine distance jusqu’à Éphrata, lorsque Rachel accoucha. Elle eut un accouchement pénible;"],[17,"et pendant les douleurs de l’enfantement, la sage-femme lui dit: Ne crains point, car tu as encore un fils!"],[18,"Et comme elle allait rendre l’âme, car elle était mourante, elle lui donna le nom de Ben-Oni; mais le père l’appela Benjamin."]],"Deutéronome 34:7":[[7,"Moïse était âgé de cent vingt ans lorsqu’il mourut; sa vue n’était point affaiblie, et sa vigueur n’était point passée."]],"Exode 2:10":[[10,"Quand il eut grandi, elle l’amena à la fille de Pharaon, et il fut pour elle comme un fils. Elle lui donna le nom de Moïse, car, dit-elle, je l’ai retiré des eaux."]],"Exode 2:1-10":[[1,"Un homme de la maison de Lévi avait pris pour femme une fille de Lévi."],[2,"Cette femme devint enceinte et enfanta un fils. Elle vit qu’il était beau, et elle le cacha pendant trois mois."],[3,"Ne pouvant plus le cacher, elle prit une caisse de jonc, qu’elle enduisit de bitume et de poix; elle y mit l’enfant, et le déposa parmi les roseaux, sur le bord du fleuve."],[4,"La sœur de l’enfant se tint à quelque distance, pour savoir ce qui lui arriverait."],[5,"La fille de Pharaon descendit au fleuve pour se baigner, et ses compagnes se promenèrent le long du fleuve. Elle aperçut la caisse au milieu des roseaux, et elle envoya sa servante pour la prendre."],[6,"Elle l’ouvrit, et vit l’enfant: c’était un petit garçon qui pleurait. Elle en eut pitié, et elle dit: C’est un enfant des Hébreux!"],[7,"Alors la sœur de l’enfant dit à la fille de Pharaon: Veux-tu que j’aille te chercher une nourrice parmi les femmes des Hébreux, pour allaiter cet enfant?"],[8,"Va, lui répondit la fille de Pharaon. Et la jeune fille alla chercher la mère de l’enfant."],[9,"La fille de Pharaon lui dit: Emporte cet enfant, et allaite-le-moi; je te donnerai ton salaire. La femme prit l’enfant, et l’allaita."],[10,"Quand il eut grandi, elle l’amena à la fille de Pharaon, et il fut pour elle comme un fils. Elle lui donna le nom de Moïse, car, dit-elle, je l’ai retiré des eaux."]],"Actes 7:23-29":[[23,"Il avait quarante ans, lorsqu’il lui vint dans le cœur de visiter ses frères, les fils d’Israël."],[24,"Il en vit un qu’on outrageait, et, prenant sa défense, il vengea celui qui était maltraité, et frappa l’Égyptien."],[25,"Il pensait que ses frères comprendraient que Dieu leur accordait la délivrance par sa main; mais ils ne comprirent pas."],[26,"Le jour suivant, il parut au milieu d’eux comme ils se battaient, et il les exhorta à la paix: Hommes, dit-il, vous êtes frères; pourquoi vous maltraitez-vous l’un l’autre?"],[27,"Mais celui qui maltraitait son prochain le repoussa, en disant: Qui t’a établi chef et juge sur nous?"],[28,"Veux-tu me tuer, comme tu as tué hier l’Égyptien?"],[29,"A cette parole, Moïse prit la fuite, et il alla séjourner dans le pays de Madian, où il engendra deux fils."]],"Exode 3:14":[[14,"Dieu dit à Moïse: Je suis celui qui suis. Et il ajouta: C’est ainsi que tu répondras aux enfants d’Israël: Celui qui s’appelle “je suis” m’a envoyé vers vous."]],"Deutéronome 34:1-7":[[1,"Moïse monta des plaines de Moab sur le mont Nebo, au sommet du Pisga, vis-à-vis de Jéricho. Et l’Éternel lui fit voir tout le pays:"],[2,"Galaad jusqu’à Dan, tout Nephthali, le pays d’Éphraïm et de Manassé, tout le pays de Juda jusqu’à la mer occidentale,"],[3,"le midi, les environs du Jourdain, la vallée de Jéricho, la ville des palmiers, jusqu’à Tsoar."],[4,"L’Éternel lui dit: C’est là le pays que j’ai juré de donner à Abraham, à Isaac et à Jacob, en disant: Je le donnerai à ta postérité. Je te l’ai fait voir de tes yeux; mais tu n’y entreras point."],[5,"Moïse, serviteur de l’Éternel, mourut là, dans le pays de Moab, selon l’ordre de l’Éternel."],[6,"Et l’Éternel l’enterra dans la vallée, au pays de Moab, vis-à-vis de Beth-Peor. Personne n’a connu son sépulcre jusqu’à ce jour."],[7,"Moïse était âgé de cent vingt ans lorsqu’il mourut; sa vue n’était point affaiblie, et sa vigueur n’était point passée."]],"Matthieu 17:3":[[3,"Et voici, Moïse et Élie leur apparurent, s’entretenant avec lui."]],"Exode 14:21-22":[[21,"Moïse étendit sa main sur la mer. Et l’Éternel refoula la mer par un vent d’orient, qui souffla avec impétuosité toute la nuit; il mit la mer à sec, et les eaux se fendirent."],[22,"Les enfants d’Israël entrèrent au milieu de la mer à sec, et les eaux formaient comme une muraille à leur droite et à leur gauche."]],"Exode 20:1-3":[[1,"Alors Dieu prononça toutes ces paroles, en disant:"],[2,"Je suis l’Éternel, ton Dieu, qui t’ai fait sortir du pays d’Égypte, de la maison de servitude."],[3,"Tu n’auras pas d’autres dieux devant ma face."]],"Deutéronome 34:5-7":[[5,"Moïse, serviteur de l’Éternel, mourut là, dans le pays de Moab, selon l’ordre de l’Éternel."],[6,"Et l’Éternel l’enterra dans la vallée, au pays de Moab, vis-à-vis de Beth-Peor. Personne n’a connu son sépulcre jusqu’à ce jour."],[7,"Moïse était âgé de cent vingt ans lorsqu’il mourut; sa vue n’était point affaiblie, et sa vigueur n’était point passée."]],"Nombres 33:39":[[39,"Aaron était âgé de cent vingt-trois ans lorsqu’il mourut sur la montagne de Hor."]],"Exode 7:7":[[7,"Moïse était âgé de quatre-vingts ans, et Aaron de quatre-vingt-trois ans, lorsqu’ils parlèrent à Pharaon."]],"Exode 32:1-4":[[1,"Le peuple, voyant que Moïse tardait à descendre de la montagne, s’assembla autour d’Aaron, et lui dit: Allons! fais-nous un dieu qui marche devant nous, car ce Moïse, cet homme qui nous a fait sortir du pays d’Égypte, nous ne savons ce qu’il est devenu."],[2,"Aaron leur dit: Otez les anneaux d’or qui sont aux oreilles de vos femmes, de vos fils et de vos filles, et apportez-les-moi."],[3,"Et tous ôtèrent les anneaux d’or qui étaient à leurs oreilles, et ils les apportèrent à Aaron."],[4,"Il les reçut de leurs mains, jeta l’or dans un moule, et fit un veau en fonte. Et ils dirent: Israël! Voici ton dieu, qui t’a fait sortir du pays d’Égypte."]],"Nombres 33:38-39":[[38,"Le sacrificateur Aaron monta sur la montagne de Hor, suivant l’ordre de l’Éternel; et il y mourut, la quarantième année après la sortie des enfants d’Israël du pays d’Égypte, le cinquième mois, le premier jour du mois."],[39,"Aaron était âgé de cent vingt-trois ans lorsqu’il mourut sur la montagne de Hor."]],"Exode 4:14-16":[[14,"Alors la colère de l’Éternel s’enflamma contre Moïse, et il dit: N’y a t-il pas ton frère Aaron, le Lévite? Je sais qu’il parlera facilement. Le voici lui-même, qui vient au-devant de toi; et, quand il te verra, il se réjouira dans son cœur."],[15,"Tu lui parleras, et tu mettras les paroles dans sa bouche; et moi, je serai avec ta bouche et avec sa bouche, et je vous enseignerai ce que vous aurez à faire."],[16,"Il parlera pour toi au peuple; il te servira de bouche, et tu tiendras pour lui la place de Dieu."]],"Exode 28:1":[[1,"Fais approcher de toi Aaron, ton frère, et ses fils, et prends-les parmi les enfants d’Israël pour les consacrer à mon service dans le sacerdoce: Aaron et les fils d’Aaron, Nadab, Abihu, Éléazar et Ithamar."]],"Exode 15:20-21":[[20,"Marie, la prophétesse, sœur d’Aaron, prit à sa main un tambourin, et toutes les femmes vinrent après elle, avec des tambourins et en dansant."],[21,"Marie répondait aux enfants d’Israël: Chantez à l’Éternel, car il a fait éclater sa gloire; Il a précipité dans la mer le cheval et son cavalier."]],"Nombres 20:1":[[1,"Toute l’assemblée des enfants d’Israël arriva dans le désert de Tsin le premier mois, et le peuple s’arrêta à Kadès. C’est là que mourut Marie, et qu’elle fut enterrée."]],"Josué 24:29":[[29,"Après ces choses, Josué, fils de Nun, serviteur de l’Éternel, mourut, âgé de cent dix ans."]],"Exode 17:9-13":[[9,"Alors Moïse dit à Josué: Choisis-nous des hommes, sors, et combats Amalek; demain je me tiendrai sur le sommet de la colline, la verge de Dieu dans ma main."],[10,"Josué fit ce que lui avait dit Moïse, pour combattre Amalek. Et Moïse, Aaron et Hur montèrent au sommet de la colline."],[11,"Lorsque Moïse élevait sa main, Israël était le plus fort; et lorsqu’il baissait sa main, Amalek était le plus fort."],[12,"Les mains de Moïse étant fatiguées, ils prirent une pierre qu’ils placèrent sous lui, et il s’assit dessus. Aaron et Hur soutenaient ses mains, l’un d’un côté, l’autre de l’autre; et ses mains restèrent fermes jusqu’au coucher du soleil."],[13,"Et Josué vainquit Amalek et son peuple, au tranchant de l’épée."]],"Nombres 14:6-9":[[6,"Et, parmi ceux qui avaient exploré le pays, Josué, fils de Nun, et Caleb, fils de Jephunné, déchirèrent leurs vêtements,"],[7,"et parlèrent ainsi à toute l’assemblée des enfants d’Israël: Le pays que nous avons parcouru, pour l’explorer, est un pays très bon, excellent."],[8,"Si l’Éternel nous est favorable, il nous mènera dans ce pays, et nous le donnera: c’est un pays où coulent le lait et le miel."],[9,"Seulement, ne soyez point rebelles contre l’Éternel, et ne craignez point les gens de ce pays, car ils nous serviront de pâture, ils n’ont plus d’ombrage pour les couvrir, l’Éternel est avec nous, ne les craignez point!"]],"Josué 1:9":[[9,"Ne t’ai-je pas donné cet ordre: Fortifie-toi et prends courage? Ne t’effraie point et ne t’épouvante point, car l’Éternel, ton Dieu, est avec toi dans tout ce que tu entreprendras."]],"Josué 24:15":[[15,"Et si vous ne trouvez pas bon de servir l’Éternel, choisissez aujourd’hui qui vous voulez servir, ou les dieux que servaient vos pères au-delà du fleuve, ou les dieux des Amoréens dans le pays desquels vous habitez. Moi et ma maison, nous servirons l’Éternel."]],"Josué 6:20":[[20,"Le peuple poussa des cris, et les sacrificateurs sonnèrent des trompettes. Lorsque le peuple entendit le son de la trompette, il poussa de grands cris, et la muraille s’écroula; le peuple monta dans la ville, chacun devant soi. Ils s’emparèrent de la ville,"]],"Josué 14:10-14":[[10,"Maintenant voici, l’Éternel m’a fait vivre, comme il l’a dit. Il y a quarante-cinq ans que l’Éternel parlait ainsi à Moïse, lorsqu’Israël marchait dans le désert; et maintenant voici, je suis âgé aujourd’hui de quatre-vingt-cinq ans."],[11,"Je suis encore vigoureux comme au jour où Moïse m’envoya; j’ai autant de force que j’en avais alors, soit pour combattre, soit pour sortir et pour entrer."],[12,"Donne-moi donc cette montagne dont l’Éternel a parlé dans ce temps-là; car tu as appris alors qu’il s’y trouve des Anakim, et qu’il y a des villes grandes et fortifiées. L’Éternel sera peut-être avec moi, et je les chasserai, comme l’Éternel a dit."],[13,"Josué bénit Caleb, fils de Jephunné, et il lui donna Hébron pour héritage."],[14,"C’est ainsi que Caleb, fils de Jephunné, le Kenizien, a eu jusqu’à ce jour Hébron pour héritage, parce qu’il avait pleinement suivi la voie de l’Éternel, le Dieu d’Israël."]],"Nombres 14:24":[[24,"Et parce que mon serviteur Caleb a été animé d’un autre esprit, et qu’il a pleinement suivi ma voie, je le ferai entrer dans le pays où il est allé, et ses descendants le posséderont."]],"Josué 2:11":[[11,"Nous l’avons appris, et nous avons perdu courage, et tous nos esprits sont abattus à votre aspect; car c’est l’Éternel, votre Dieu, qui est Dieu en haut dans les cieux et en bas sur la terre."]],"Josué 6:25":[[25,"Josué laissa la vie à Rahab la prostituée, à la maison de son père, et à tous ceux qui lui appartenaient; elle a habité au milieu d’Israël jusqu’à ce jour, parce qu’elle avait caché les messagers que Josué avait envoyés pour explorer Jéricho."]],"Matthieu 1:5":[[5,"Salmon engendra Boaz de Rahab; Boaz engendra Obed de Ruth;"]],"Hébreux 11:31":[[31,"C’est par la foi que Rahab la prostituée ne périt pas avec les rebelles, parce qu’elle avait reçu les espions avec bienveillance."]],"Josué 2:11-12":[[11,"Nous l’avons appris, et nous avons perdu courage, et tous nos esprits sont abattus à votre aspect; car c’est l’Éternel, votre Dieu, qui est Dieu en haut dans les cieux et en bas sur la terre."],[12,"Et maintenant, je vous prie, jurez-moi par l’Éternel que vous aurez pour la maison de mon père la même bonté que j’ai eue pour vous."]],"Juges 3:9-11":[[9,"Les enfants d’Israël crièrent à l’Éternel, et l’Éternel leur suscita un libérateur qui les délivra, Othniel, fils de Kenaz, frère cadet de Caleb."],[10,"L’esprit de l’Éternel fut sur lui. Il devint juge en Israël, et il partit pour la guerre. L’Éternel livra entre ses mains Cuschan-Rischeathaïm, roi de Mésopotamie, et sa main fut puissante contre Cuschan-Rischeathaïm."],[11,"Le pays fut en repos pendant quarante ans. Et Othniel, fils de Kenaz, mourut."]],"Juges 4:4-9":[[4,"Dans ce temps-là, Débora, prophétesse, femme de Lappidoth, était juge en Israël."],[5,"Elle siégeait sous le palmier de Débora, entre Rama et Béthel, dans la montagne d’Éphraïm; et les enfants d’Israël montaient vers elle pour être jugés."],[6,"Elle envoya appeler Barak, fils d’Abinoam, de Kédesch-Nephthali, et elle lui dit: N’est-ce pas l’ordre qu’a donné l’Éternel, le Dieu d’Israël? Va, dirige-toi sur le mont Thabor, et prends avec toi dix mille hommes des enfants de Nephthali et des enfants de Zabulon;"],[7,"j’attirerai vers toi, au torrent de Kison, Sisera, chef de l’armée de Jabin, avec ses chars et ses troupes, et je le livrerai entre tes mains."],[8,"Barak lui dit: Si tu viens avec moi, j’irai; mais si tu ne viens pas avec moi, je n’irai pas."],[9,"Elle répondit: J’irai bien avec toi; mais tu n’auras point de gloire sur la voie où tu marches, car l’Éternel livrera Sisera entre les mains d’une femme. Et Débora se leva, et elle se rendit avec Barak à Kédesch."]],"Juges 5:31":[[31,"Périssent ainsi tous tes ennemis, ô Éternel! Ceux qui l’aiment sont comme le soleil, Quand il paraît dans sa force. Le pays fut en repos pendant quarante ans."]],"Juges 6:12":[[12,"L’ange de l’Éternel lui apparut, et lui dit: L’Éternel est avec toi, vaillant héros!"]],"Juges 7:19-22":[[19,"Gédéon et les cent hommes qui étaient avec lui arrivèrent aux abords du camp au commencement de la veille du milieu, comme on venait de placer les gardes. Ils sonnèrent de la trompette, et brisèrent les cruches qu’ils avaient à la main."],[20,"Les trois corps sonnèrent de la trompette, et brisèrent les cruches; ils saisirent de la main gauche les flambeaux et de la main droite les trompettes pour sonner, et ils s’écrièrent: Épée pour l’Éternel et pour Gédéon!"],[21,"Ils restèrent chacun à sa place autour du camp, et tout le camp se mit à courir, à pousser des cris, et à prendre la fuite."],[22,"Les trois cents hommes sonnèrent encore de la trompette; et, dans tout le camp, l’Éternel leur fit tourner l’épée les uns contre les autres. Le camp s’enfuit jusqu’à Beth-Schitta vers Tseréra, jusqu’au bord d’Abel-Mehola près de Tabbath."]],"Juges 8:23":[[23,"Gédéon leur dit: Je ne dominerai point sur vous, et mes fils ne domineront point sur vous; c’est l’Éternel qui dominera sur vous."]],"Juges 6:12-16":[[12,"L’ange de l’Éternel lui apparut, et lui dit: L’Éternel est avec toi, vaillant héros!"],[13,"Gédéon lui dit: Ah! Mon seigneur, si l’Éternel est avec nous, pourquoi toutes ces choses nous sont-elles arrivées? Et où sont tous ces prodiges que nos pères nous racontent, quand ils disent: L’Éternel ne nous a-t-il pas fait monter hors d’Égypte? Maintenant l’Éternel nous abandonne, et il nous livre entre les mains de Madian!"],[14,"L’Éternel se tourna vers lui, et dit: Va avec cette force que tu as, et délivre Israël de la main de Madian; n’est-ce pas moi qui t’envoie?"],[15,"Gédéon lui dit: Ah! Mon seigneur, avec quoi délivrerai-je Israël? Voici, ma famille est la plus pauvre en Manassé, et je suis le plus petit dans la maison de mon père."],[16,"L’Éternel lui dit: Mais je serai avec toi, et tu battras Madian comme un seul homme."]],"Ruth 1:16":[[16,"Ruth répondit: Ne me presse pas de te laisser, de retourner loin de toi! Où tu iras j’irai, où tu demeureras je demeurerai; ton peuple sera mon peuple, et ton Dieu sera mon Dieu;"]],"Ruth 4:13-17":[[13,"Boaz prit Ruth, qui devint sa femme, et il alla vers elle. L’Éternel permit à Ruth de concevoir, et elle enfanta un fils."],[14,"Les femmes dirent à Naomi: Béni soit l’Éternel, qui ne t’a point laissé manquer aujourd’hui d’un homme ayant droit de rachat, et dont le nom sera célébré en Israël!"],[15,"Cet enfant restaurera ton âme, et sera le soutien de ta vieillesse; car ta belle-fille, qui t’aime, l’a enfanté, elle qui vaut mieux pour toi que sept fils."],[16,"Naomi prit l’enfant et le mit sur son sein, et elle fut sa garde."],[17,"Les voisines lui donnèrent un nom, en disant: Un fils est né à Naomi! Et elles l’appelèrent Obed. Ce fut le père d’Isaï père de David."]],"Ruth 1:1":[[1,"Du temps des juges, il y eut une famine dans le pays. Un homme de Bethléhem de Juda partit, avec sa femme et ses deux fils, pour faire un séjour dans le pays de Moab."]],"Ruth 4:9-13":[[9,"Alors Boaz dit aux anciens et à tout le peuple: Vous êtes témoins aujourd’hui que j’ai acquis de la main de Naomi tout ce qui appartenait à Élimélec, à Kiljon et à Machlon,"],[10,"et que je me suis également acquis pour femme Ruth la Moabite, femme de Machlon, pour relever le nom du défunt dans son héritage, et afin que le nom du défunt ne soit point retranché d’entre ses frères et de la porte de son lieu. Vous en êtes témoins aujourd’hui!"],[11,"Tout le peuple qui était à la porte et les anciens dirent: Nous en sommes témoins! Que l’Éternel rende la femme qui entre dans ta maison semblable à Rachel et à Léa, qui toutes les deux ont bâti la maison d’Israël! Manifeste ta force dans Éphrata, et fais-toi un nom dans Bethléhem!"],[12,"Puisse la postérité que l’Éternel te donnera par cette jeune femme rendre ta maison semblable à la maison de Pérets, qui fut enfanté à Juda par Tamar!"],[13,"Boaz prit Ruth, qui devint sa femme, et il alla vers elle. L’Éternel permit à Ruth de concevoir, et elle enfanta un fils."]],"Ruth 2:1":[[1,"Naomi avait un parent de son mari. C’était un homme puissant et riche, de la famille d’Élimélec, et qui se nommait Boaz."]],"Juges 13:5":[[5,"Car tu vas devenir enceinte et tu enfanteras un fils. Le rasoir ne passera point sur sa tête, parce que cet enfant sera consacré à Dieu dès le ventre de sa mère; et ce sera lui qui commencera à délivrer Israël de la main des Philistins."]],"Juges 16:28-30":[[28,"Alors Samson invoqua l’Éternel, et dit: Seigneur Éternel! Souviens-toi de moi, je te prie; ô Dieu! Donne-moi de la force seulement cette fois, et que d’un seul coup je tire vengeance des Philistins pour mes deux yeux!"],[29,"Et Samson embrassa les deux colonnes du milieu sur lesquelles reposait la maison, et il s’appuya contre elles; l’une était à sa droite, et l’autre à sa gauche."],[30,"Samson dit: Que je meure avec les Philistins! Il se pencha fortement, et la maison tomba sur les princes et sur tout le peuple qui y était. Ceux qu’il fit périr à sa mort furent plus nombreux que ceux qu’il avait tués pendant sa vie."]],"Juges 16:31":[[31,"Ses frères et toute la maison de son père descendirent, et l’emportèrent. Lorsqu’ils furent remontés, ils l’enterrèrent entre Tsorea et Eschthaol dans le sépulcre de Manoach, son père. Il avait été juge en Israël pendant vingt ans."]],"Juges 16:28-31":[[28,"Alors Samson invoqua l’Éternel, et dit: Seigneur Éternel! Souviens-toi de moi, je te prie; ô Dieu! Donne-moi de la force seulement cette fois, et que d’un seul coup je tire vengeance des Philistins pour mes deux yeux!"],[29,"Et Samson embrassa les deux colonnes du milieu sur lesquelles reposait la maison, et il s’appuya contre elles; l’une était à sa droite, et l’autre à sa gauche."],[30,"Samson dit: Que je meure avec les Philistins! Il se pencha fortement, et la maison tomba sur les princes et sur tout le peuple qui y était. Ceux qu’il fit périr à sa mort furent plus nombreux que ceux qu’il avait tués pendant sa vie."],[31,"Ses frères et toute la maison de son père descendirent, et l’emportèrent. Lorsqu’ils furent remontés, ils l’enterrèrent entre Tsorea et Eschthaol dans le sépulcre de Manoach, son père. Il avait été juge en Israël pendant vingt ans."]],"1 Samuel 4:15":[[15,"Or Éli était âgé de quatre-vingt-dix-huit ans, il avait les yeux fixes et ne pouvait plus voir."]],"1 Samuel 4:15-18":[[15,"Or Éli était âgé de quatre-vingt-dix-huit ans, il avait les yeux fixes et ne pouvait plus voir."],[16,"L’homme dit à Éli: J’arrive du champ de bataille, et c’est du champ de bataille que je me suis enfui aujourd’hui. Éli dit: Que s’est-il passé, mon fils?"],[17,"Celui qui apportait la nouvelle dit en réponse: Israël a fui devant les Philistins, et le peuple a éprouvé une grande défaite; et même tes deux fils, Hophni et Phinées, sont morts, et l’arche de Dieu a été prise."],[18,"A peine eut-il fait mention de l’arche de Dieu, qu’Éli tomba de son siège à la renverse, à côté de la porte; il se rompit la nuque et mourut, car c’était un homme vieux et pesant. Il avait été juge en Israël pendant quarante ans."]],"1 Samuel 3:8-10":[[8,"L’Éternel appela de nouveau Samuel, pour la troisième fois. Et Samuel se leva, alla vers Éli, et dit: Me voici, car tu m’as appelé. Éli comprit que c’était l’Éternel qui appelait l’enfant,"],[9,"et il dit à Samuel: Va, couche-toi; et si l’on t’appelle, tu diras: Parle, Éternel, car ton serviteur écoute. Et Samuel alla se coucher à sa place."],[10,"L’Éternel vint et se présenta, et il appela comme les autres fois: Samuel, Samuel! Et Samuel répondit: Parle, car ton serviteur écoute."]],"1 Samuel 2:1":[[1,"Anne pria, et dit: Mon cœur se réjouit en l’Éternel, Ma force a été relevée par l’Éternel; Ma bouche s’est ouverte contre mes ennemis, Car je me réjouis de ton secours."]],"1 Samuel 1:27-28":[[27,"C’était pour cet enfant que je priais, et l’Éternel a exaucé la prière que je lui adressais."],[28,"Aussi je veux le prêter à l’Éternel: il sera toute sa vie prêté à l’Éternel. Et ils se prosternèrent là devant l’Éternel"]],"1 Samuel 2:1-2":[[1,"Anne pria, et dit: Mon cœur se réjouit en l’Éternel, Ma force a été relevée par l’Éternel; Ma bouche s’est ouverte contre mes ennemis, Car je me réjouis de ton secours."],[2,"Nul n’est saint comme l’Éternel; Il n’y a point d’autre Dieu que toi; Il n’y a point de rocher comme notre Dieu."]],"1 Samuel 3:10":[[10,"L’Éternel vint et se présenta, et il appela comme les autres fois: Samuel, Samuel! Et Samuel répondit: Parle, car ton serviteur écoute."]],"1 Samuel 10:1":[[1,"Samuel prit une fiole d’huile, qu’il répandit sur la tête de Saül. Il le baisa, et dit: L’Éternel ne t’a-t-il pas oint pour que tu sois le chef de son héritage?"]],"1 Samuel 16:7":[[7,"Et l’Éternel dit à Samuel: Ne prends point garde à son apparence et à la hauteur de sa taille, car je l’ai rejeté. L’Éternel ne considère pas ce que l’homme considère; l’homme regarde à ce qui frappe les yeux, mais l’Éternel regarde au cœur."]],"1 Samuel 25:1":[[1,"Samuel mourut. Tout Israël s’étant assemblé le pleura, et on l’enterra dans sa demeure à Rama. Ce fut alors que David se leva et descendit au désert de Paran."]],"1 Samuel 16:13":[[13,"Samuel prit la corne d’huile, et l’oignit au milieu de ses frères. L’esprit de l’Éternel saisit David, à partir de ce jour et dans la suite. Samuel se leva, et s’en alla à Rama."]],"Actes 13:21":[[21,"Ils demandèrent alors un roi. Et Dieu leur donna, pendant quarante ans, Saül, fils de Kis, de la tribu de Benjamin;"]],"1 Samuel 15:22":[[22,"Samuel dit: L’Éternel trouve-t-il du plaisir dans les holocaustes et les sacrifices, comme dans l’obéissance à la voix de l’Éternel? Voici, l’obéissance vaut mieux que les sacrifices, et l’observation de sa parole vaut mieux que la graisse des béliers."]],"1 Samuel 31:6":[[6,"Ainsi périrent en même temps, dans cette journée, Saül et ses trois fils, celui qui portait ses armes, et tous ses gens."]],"1 Samuel 18:1":[[1,"David avait achevé de parler à Saül. Et dès lors l’âme de Jonathan fut attachée à l’âme de David, et Jonathan l’aima comme son âme."]],"1 Samuel 18:1-4":[[1,"David avait achevé de parler à Saül. Et dès lors l’âme de Jonathan fut attachée à l’âme de David, et Jonathan l’aima comme son âme."],[2,"Ce même jour Saül retint David, et ne le laissa pas retourner dans la maison de son père."],[3,"Jonathan fit alliance avec David, parce qu’il l’aimait comme son âme."],[4,"Il ôta le manteau qu’il portait, pour le donner à David; et il lui donna ses vêtements, même son épée, son arc et sa ceinture."]],"2 Samuel 1:26":[[26,"Je suis dans la douleur à cause de toi, Jonathan, mon frère! Tu faisais tout mon plaisir; Ton amour pour moi était admirable, Au-dessus de l’amour des femmes."]],"2 Samuel 5:4":[[4,"David était âgé de trente ans lorsqu’il devint roi, et il régna quarante ans."]],"1 Samuel 17:45":[[45,"David dit au Philistin: Tu marches contre moi avec l’épée, la lance et le javelot; et moi, je marche contre toi au nom de l’Éternel des armées, du Dieu de l’armée d’Israël, que tu as insultée."]],"2 Samuel 5:4-5":[[4,"David était âgé de trente ans lorsqu’il devint roi, et il régna quarante ans."],[5,"A Hébron il régna sur Juda sept ans et six mois, et à Jérusalem il régna trente-trois ans sur tout Israël et Juda."]],"2 Samuel 7:16":[[16,"Ta maison et ton règne seront pour toujours assurés, ton trône sera pour toujours affermi."]],"Actes 13:22":[[22,"puis, l’ayant rejeté, il leur suscita pour roi David, auquel il a rendu ce témoignage: J’ai trouvé David, fils d’Isaï, homme selon mon cœur, qui accomplira toutes mes volontés."]],"Psaume 23:1":[[1,"Cantique de David. L’Éternel est mon berger: je ne manquerai de rien."]],"2 Samuel 12:24":[[24,"David consola Bath-Schéba, sa femme, et il alla auprès d’elle et coucha avec elle. Elle enfanta un fils qu’il appela Salomon, et qui fut aimé de l’Éternel."]],"Matthieu 1:6":[[6,"Obed engendra Isaï; Isaï engendra David. Le roi David engendra Salomon de la femme d’Urie;"]],"1 Rois 11:42":[[42,"Salomon régna quarante ans à Jérusalem sur tout Israël."]],"1 Rois 3:9-13":[[9,"Accorde donc à ton serviteur un cœur intelligent pour juger ton peuple, pour discerner le bien du mal! Car qui pourrait juger ton peuple, ce peuple si nombreux?"],[10,"Cette demande de Salomon plut au Seigneur."],[11,"Et Dieu lui dit: Puisque c’est là ce que tu demandes, puisque tu ne demandes pour toi ni une longue vie, ni les richesses, ni la mort de tes ennemis, et que tu demandes de l’intelligence pour exercer la justice,"],[12,"voici, j’agirai selon ta parole. Je te donnerai un cœur sage et intelligent, de telle sorte qu’il n’y aura eu personne avant toi et qu’on ne verra jamais personne de semblable à toi."],[13,"Je te donnerai, en outre, ce que tu n’as pas demandé, des richesses et de la gloire, de telle sorte qu’il n’y aura pendant toute ta vie aucun roi qui soit ton pareil."]],"1 Rois 6:1":[[1,"Ce fut la quatre cent quatre-vingtième année après la sortie des enfants d’Israël du pays d’Égypte que Salomon bâtit la maison à l’Éternel, la quatrième année de son règne sur Israël, au mois de Ziv, qui est le second mois."]],"1 Rois 11:4":[[4,"A l’époque de la vieillesse de Salomon, ses femmes inclinèrent son cœur vers d’autres dieux; et son cœur ne fut point tout entier à l’Éternel, son Dieu, comme l’avait été le cœur de David, son père."]],"1 Rois 14:21":[[21,"Roboam, fils de Salomon, régna sur Juda. Il avait quarante et un ans lorsqu’il devint roi, et il régna dix-sept ans à Jérusalem, la ville que l’Éternel avait choisie sur toutes les tribus d’Israël pour y mettre son nom. Sa mère s’appelait Naama, l’Ammonite."]],"1 Rois 12:13-16":[[13,"Le roi répondit durement au peuple. Il laissa le conseil que lui avaient donné les vieillards,"],[14,"et il leur parla ainsi d’après le conseil des jeunes gens: Mon père a rendu votre joug pesant, et moi je vous le rendrai plus pesant; mon père vous a châtiés avec des fouets, et moi je vous châtierai avec des scorpions."],[15,"Ainsi le roi n’écouta point le peuple; car cela fut dirigé par l’Éternel, en vue de l’accomplissement de la parole que l’Éternel avait dite par Achija de Silo à Jéroboam, fils de Nebath."],[16,"Lorsque tout Israël vit que le roi ne l’écoutait pas, le peuple répondit au roi: Quelle part avons-nous avec David? Nous n’avons point d’héritage avec le fils d’Isaï! A tes tentes, Israël! Maintenant, pourvois à ta maison, David! Et Israël s’en alla dans ses tentes."]],"1 Rois 15:1-3":[[1,"La dix-huitième année du règne de Jéroboam, fils de Nebath, Abijam régna sur Juda."],[2,"Il régna trois ans à Jérusalem. Sa mère s’appelait Maaca, fille d’Abisalom."],[3,"Il se livra à tous les péchés que son père avait commis avant lui; et son cœur ne fut point tout entier à l’Éternel, son Dieu, comme l’avait été le cœur de David, son père."]],"1 Rois 15:3":[[3,"Il se livra à tous les péchés que son père avait commis avant lui; et son cœur ne fut point tout entier à l’Éternel, son Dieu, comme l’avait été le cœur de David, son père."]],"1 Rois 15:10-11":[[10,"Il régna quarante et un ans à Jérusalem. Sa mère s’appelait Maaca, fille d’Abisalom."],[11,"Asa fit ce qui est droit aux yeux de l’Éternel, comme David, son père."]],"1 Rois 15:11-13":[[11,"Asa fit ce qui est droit aux yeux de l’Éternel, comme David, son père."],[12,"Il ôta du pays les prostitués, et il fit disparaître toutes les idoles que ses pères avaient faites."],[13,"Et même il enleva la dignité de reine à Maaca, sa mère, parce qu’elle avait fait une idole pour Astarté. Asa abattit son idole, et la brûla au torrent de Cédron."]],"1 Rois 22:42":[[42,"Josaphat avait trente-cinq ans lorsqu’il devint roi, et il régna vingt cinq ans à Jérusalem. Sa mère s’appelait Azuba, fille de Schilchi."]],"2 Chroniques 17:7-9":[[7,"La troisième année de son règne, il chargea ses chefs Ben-Haïl, Abdias, Zacharie, Nethaneel et Michée, d’aller enseigner dans les villes de Juda."],[8,"Il envoya avec eux les Lévites Schemaeja, Nethania, Zebadia, Asaël, Schemiramoth, Jonathan, Adonija, Tobija et Tob-Adonija, Lévites, et les sacrificateurs Élischama et Joram."],[9,"Ils enseignèrent dans Juda, ayant avec eux le livre de la loi de l’Éternel. Ils parcoururent toutes les villes de Juda, et ils enseignèrent parmi le peuple."]],"1 Rois 22:42-43":[[42,"Josaphat avait trente-cinq ans lorsqu’il devint roi, et il régna vingt cinq ans à Jérusalem. Sa mère s’appelait Azuba, fille de Schilchi."],[43,"Il marcha dans toute la voie d’Asa, son père, et ne s’en détourna point, faisant ce qui est droit aux yeux de l’Éternel."]],"2 Rois 8:16-18":[[16,"La cinquième année de Joram, fils d’Achab, roi d’Israël, Joram, fils de Josaphat, roi de Juda, régna."],[17,"Il avait trente-deux ans lorsqu’il devint roi, et il régna huit ans à Jérusalem."],[18,"Il marcha dans la voie des rois d’Israël, comme avait fait la maison d’Achab, car il avait pour femme une fille d’Achab, et il fit ce qui est mal aux yeux de l’Éternel."]],"2 Rois 8:18":[[18,"Il marcha dans la voie des rois d’Israël, comme avait fait la maison d’Achab, car il avait pour femme une fille d’Achab, et il fit ce qui est mal aux yeux de l’Éternel."]],"2 Rois 8:26-27":[[26,"Achazia avait vingt-deux ans lorsqu’il devint roi, et il régna un an à Jérusalem. Sa mère s’appelait Athalie, fille d’Omri, roi d’Israël."],[27,"Il marcha dans la voie de la maison d’Achab, et il fit ce qui est mal aux yeux de l’Éternel, comme la maison d’Achab, car il était allié par mariage à la maison d’Achab."]],"2 Rois 9:27":[[27,"Achazia, roi de Juda, ayant vu cela, s’enfuit par le chemin de la maison du jardin. Jéhu le poursuivit, et dit: Lui aussi, frappez-le sur le char! Et on le frappa à la montée de Gur, près de Jibleam. Il se réfugia à Meguiddo, et il y mourut."]],"2 Rois 11:1-3":[[1,"Athalie, mère d’Achazia, voyant que son fils était mort, se leva et fit périr toute la race royale."],[2,"Mais Joschéba, fille du roi Joram, sœur d’Achazia, prit Joas, fils d’Achazia, et l’enleva du milieu des fils du roi, quand on les fit mourir: elle le mit avec sa nourrice dans la chambre des lits. Il fut ainsi dérobé aux regards d’Athalie, et ne fut point mis à mort."],[3,"Il resta six ans caché avec Joschéba dans la maison de l’Éternel. Et c’était Athalie qui régnait dans le pays."]],"2 Rois 12:1-2":[[1,"La septième année de Jéhu, Joas devint roi, et il régna quarante ans à Jérusalem. Sa mère s’appelait Tsibja, de Beer-Schéba."],[2,"Joas fit ce qui est droit aux yeux de l’Éternel tout le temps qu’il suivit les directions du sacrificateur Jehojada."]],"2 Chroniques 24:20-22":[[20,"Zacharie, fils du sacrificateur Jehojada, fut revêtu de l’esprit de Dieu; il se présenta devant le peuple et lui dit: Ainsi parle Dieu: Pourquoi transgressez-vous les commandements de l’Éternel? Vous ne prospérerez point; car vous avez abandonné l’Éternel, et il vous abandonnera."],[21,"Et ils conspirèrent contre lui, et le lapidèrent par ordre du roi, dans le parvis de la maison de l’Éternel."],[22,"Le roi Joas ne se souvint pas de la bienveillance qu’avait eue pour lui Jehojada, père de Zacharie, et il fit périr son fils. Zacharie dit en mourant: Que l’Éternel voie, et qu’il fasse justice!"]],"2 Rois 14:1-3":[[1,"La seconde année de Joas, fils de Joachaz, roi d’Israël, Amatsia, fils de Joas, roi de Juda, régna."],[2,"Il avait vingt-cinq ans lorsqu’il devint roi, et il régna vingt-neuf ans à Jérusalem. Sa mère s’appelait Joaddan, de Jérusalem."],[3,"Il fit ce qui est droit aux yeux de l’Éternel, non pas toutefois comme David, son père; il agit entièrement comme avait agi Joas, son père."]],"2 Rois 14:3":[[3,"Il fit ce qui est droit aux yeux de l’Éternel, non pas toutefois comme David, son père; il agit entièrement comme avait agi Joas, son père."]],"2 Rois 15:1-3":[[1,"La vingt-septième année de Jéroboam, roi d’Israël, Azaria, fils d’Amatsia, roi de Juda, régna."],[2,"Il avait seize ans lorsqu’il devint roi, et il régna cinquante-deux ans à Jérusalem. Sa mère s’appelait Jecolia, de Jérusalem."],[3,"Il fit ce qui est droit aux yeux de l’Éternel, entièrement comme avait fait Amatsia, son père."]],"2 Chroniques 26:16-21":[[16,"Mais lorsqu’il fut puissant, son cœur s’éleva pour le perdre. Il pécha contre l’Éternel, son Dieu: il entra dans le temple de l’Éternel pour brûler des parfums sur l’autel des parfums."],[17,"Le sacrificateur Azaria entra après lui, avec quatre-vingts sacrificateurs de l’Éternel,"],[18,"hommes courageux, qui s’opposèrent au roi Ozias et lui dirent: Tu n’as pas le droit, Ozias, d’offrir des parfums à l’Éternel! Ce droit appartient aux sacrificateurs, fils d’Aaron, qui ont été consacrés pour les offrir. Sors du sanctuaire, car tu commets un péché! Et cela ne tournera pas à ton honneur devant l’Éternel Dieu."],[19,"La colère s’empara d’Ozias, qui tenait un encensoir à la main. Et comme il s’irritait contre les sacrificateurs, la lèpre éclata sur son front, en présence des sacrificateurs, dans la maison de l’Éternel, près de l’autel des parfums."],[20,"Le souverain sacrificateur Azaria et tous les sacrificateurs portèrent les regards sur lui, et voici, il avait la lèpre au front. Ils le mirent précipitamment dehors, et lui-même se hâta de sortir, parce que l’Éternel l’avait frappé."],[21,"Le roi Ozias fut lépreux jusqu’au jour de sa mort, et il demeura dans une maison écartée comme lépreux, car il fut exclu de la maison de l’Éternel. Et Jotham, son fils, était à la tête de la maison du roi et jugeait le peuple du pays."]],"Ésaïe 6:1":[[1,"L’année de la mort du roi Ozias, je vis le Seigneur assis sur un trône très élevé, et les pans de sa robe remplissaient le temple."]],"2 Rois 15:32-34":[[32,"La seconde année de Pékach, fils de Remalia, roi d’Israël, Jotham, fils d’Ozias, roi de Juda, régna."],[33,"Il avait vingt-cinq ans lorsqu’il devint roi, et il régna seize ans à Jérusalem. Sa mère s’appelait Jeruscha, fille de Tsadok."],[34,"Il fit ce qui est droit aux yeux de l’Éternel; il agit entièrement comme avait agi Ozias, son père."]],"2 Rois 15:34":[[34,"Il fit ce qui est droit aux yeux de l’Éternel; il agit entièrement comme avait agi Ozias, son père."]],"2 Rois 16:2-3":[[2,"Achaz avait vingt ans lorsqu’il devint roi, et il régna seize ans à Jérusalem. Il ne fit point ce qui est droit aux yeux de l’Éternel, son Dieu, comme avait fait David, son père."],[3,"Il marcha dans la voie des rois d’Israël; et même il fit passer son fils par le feu, suivant les abominations des nations que l’Éternel avait chassées devant les enfants d’Israël."]],"2 Rois 16:3":[[3,"Il marcha dans la voie des rois d’Israël; et même il fit passer son fils par le feu, suivant les abominations des nations que l’Éternel avait chassées devant les enfants d’Israël."]],"Ésaïe 7:14":[[14,"C’est pourquoi le Seigneur lui-même vous donnera un signe, Voici, la jeune fille deviendra enceinte, elle enfantera un fils, Et elle lui donnera le nom d’Emmanuel."]],"Ésaïe 7:10-14":[[10,"L’Éternel parla de nouveau à Achaz, et lui dit:"],[11,"Demande en ta faveur un signe à l’Éternel, ton Dieu; demande-le, soit dans les lieux bas, soit dans les lieux élevés."],[12,"Achaz répondit: Je ne demanderai rien, je ne tenterai pas l’Éternel."],[13,"Ésaïe dit alors: Écoutez donc, maison de David! Est-ce trop peu pour vous de lasser la patience des hommes, Que vous lassiez encore celle de mon Dieu?"],[14,"C’est pourquoi le Seigneur lui-même vous donnera un signe, Voici, la jeune fille deviendra enceinte, elle enfantera un fils, Et elle lui donnera le nom d’Emmanuel."]],"2 Rois 18:1-5":[[1,"La troisième année d’Osée, fils d’Éla, roi d’Israël, Ézéchias, fils d’Achaz, roi de Juda, régna."],[2,"Il avait vingt-cinq ans lorsqu’il devint roi, et il régna vingt-neuf ans à Jérusalem. Sa mère s’appelait Abi, fille de Zacharie."],[3,"Il fit ce qui est droit aux yeux de l’Éternel, entièrement comme avait fait David, son père."],[4,"Il fit disparaître les hauts lieux, brisa les statues, abattit les idoles, et mit en pièces le serpent d’airain que Moïse avait fait, car les enfants d’Israël avaient jusqu’alors brûlé des parfums devant lui: on l’appelait Nehuschtan."],[5,"Il mit sa confiance en l’Éternel, le Dieu d’Israël; et parmi tous les rois de Juda qui vinrent après lui ou qui le précédèrent, il n’y en eut point de semblable à lui."]],"2 Rois 19:14-19":[[14,"Ézéchias prit la lettre de la main des messagers, et la lut. Puis il monta à la maison de l’Éternel, et la déploya devant l’Éternel,"],[15,"à qui il adressa cette prière: Éternel, Dieu d’Israël, assis sur les chérubins! C’est toi qui es le seul Dieu de tous les royaumes de la terre, c’est toi qui as fait les cieux et la terre."],[16,"Éternel! Incline ton oreille, et écoute. Éternel! Ouvre tes yeux, et regarde. Entends les paroles de Sanchérib, qui a envoyé Rabschaké pour insulter au Dieu vivant."],[17,"Il est vrai, ô Éternel! Que les rois d’Assyrie ont détruit les nations et ravagé leurs pays,"],[18,"et qu’ils ont jeté leurs dieux dans le feu; mais ce n’étaient point des dieux, c’étaient des ouvrages de mains d’homme, du bois et de la pierre; et ils les ont anéantis."],[19,"Maintenant, Éternel, notre Dieu! Délivre-nous de la main de Sanchérib, et que tous les royaumes de la terre sachent que toi seul es Dieu, ô Éternel!"]],"2 Rois 19:35":[[35,"Cette nuit-là, l’ange de l’Éternel sortit, et frappa dans le camp des Assyriens cent quatre-vingt-cinq mille hommes. Et quand on se leva le matin, voici, c’étaient tous des corps morts."]],"2 Rois 20:5-6":[[5,"Retourne, et dis à Ézéchias, chef de mon peuple: Ainsi parle l’Éternel, le Dieu de David, ton père: J’ai entendu ta prière, j’ai vu tes larmes. Voici, je te guérirai; le troisième jour, tu monteras à la maison de l’Éternel."],[6,"J’ajouterai à tes jours quinze années. Je te délivrerai, toi et cette ville, de la main du roi d’Assyrie; je protégerai cette ville, à cause de moi, et à cause de David, mon serviteur."]],"2 Rois 18:5":[[5,"Il mit sa confiance en l’Éternel, le Dieu d’Israël; et parmi tous les rois de Juda qui vinrent après lui ou qui le précédèrent, il n’y en eut point de semblable à lui."]],"2 Rois 19:14-35":[[14,"Ézéchias prit la lettre de la main des messagers, et la lut. Puis il monta à la maison de l’Éternel, et la déploya devant l’Éternel,"],[15,"à qui il adressa cette prière: Éternel, Dieu d’Israël, assis sur les chérubins! C’est toi qui es le seul Dieu de tous les royaumes de la terre, c’est toi qui as fait les cieux et la terre."],[16,"Éternel! Incline ton oreille, et écoute. Éternel! Ouvre tes yeux, et regarde. Entends les paroles de Sanchérib, qui a envoyé Rabschaké pour insulter au Dieu vivant."],[17,"Il est vrai, ô Éternel! Que les rois d’Assyrie ont détruit les nations et ravagé leurs pays,"],[18,"et qu’ils ont jeté leurs dieux dans le feu; mais ce n’étaient point des dieux, c’étaient des ouvrages de mains d’homme, du bois et de la pierre; et ils les ont anéantis."],[19,"Maintenant, Éternel, notre Dieu! Délivre-nous de la main de Sanchérib, et que tous les royaumes de la terre sachent que toi seul es Dieu, ô Éternel!"],[20,"Alors Ésaïe, fils d’Amots, envoya dire à Ézéchias: Ainsi parle l’Éternel, le Dieu d’Israël: J’ai entendu la prière que tu m’as adressée au sujet de Sanchérib, roi d’Assyrie."],[21,"Voici la parole que l’Éternel a prononcée contre lui: Elle te méprise, elle se moque de toi, La vierge, fille de Sion; Elle hoche la tête après toi, La fille de Jérusalem."],[22,"Qui as-tu insulté et outragé? Contre qui as-tu élevé la voix? Tu as porté tes yeux en haut Sur le Saint d’Israël!"],[23,"Par tes messagers tu as insulté le Seigneur, Et tu as dit: Avec la multitude de mes chars, J’ai gravi le sommet des montagnes, Les extrémités du Liban; Je couperai les plus élevés de ses cèdres, Les plus beaux de ses cyprès, Et j’atteindrai sa dernière cime, Sa forêt semblable à un verger;"],[24,"J’ai creusé, et j’ai bu des eaux étrangères, Et je tarirai avec la plante de mes pieds Tous les fleuves de l’Égypte."],[25,"N’as-tu pas appris que j’ai préparé ces choses de loin, Et que je les ai résolues dès les temps anciens? Maintenant j’ai permis qu’elles s’accomplissent, Et que tu réduisisses des villes fortes en monceaux de ruines."],[26,"Leurs habitants sont impuissants, Épouvantés et confus; Ils sont comme l’herbe des champs et la tendre verdure, Comme le gazon des toits Et le blé qui sèche avant la formation de sa tige."],[27,"Mais je sais quand tu t’assieds, quand tu sors et quand tu entres, Et quand tu es furieux contre moi."],[28,"Parce que tu es furieux contre moi, Et que ton arrogance est montée à mes oreilles, Je mettrai ma boucle à tes narines et mon mors entre tes lèvres, Et je te ferai retourner par le chemin par lequel tu es venu."],[29,"Que ceci soit un signe pour toi: On a mangé une année le produit du grain tombé, et une seconde année ce qui croît de soi-même; mais la troisième année, vous sèmerez, vous moissonnerez, vous planterez des vignes, et vous en mangerez le fruit."]],"2 Rois 20:1-6":[[1,"En ce temps-là, Ézéchias fut malade à la mort. Le prophète Ésaïe, fils d’Amots, vint auprès de lui, et lui dit: Ainsi parle l’Éternel: Donne tes ordres à ta maison, car tu vas mourir, et tu ne vivras plus."],[2,"Ézéchias tourna son visage contre le mur, et fit cette prière à l’Éternel:"],[3,"O Éternel! Souviens-toi que j’ai marché devant ta face avec fidélité et intégrité de cœur, et que j’ai fait ce qui est bien à tes yeux! Et Ézéchias répandit d’abondantes larmes."],[4,"Ésaïe, qui était sorti, n’était pas encore dans la cour du milieu, lorsque la parole de l’Éternel lui fut adressée en ces termes:"],[5,"Retourne, et dis à Ézéchias, chef de mon peuple: Ainsi parle l’Éternel, le Dieu de David, ton père: J’ai entendu ta prière, j’ai vu tes larmes. Voici, je te guérirai; le troisième jour, tu monteras à la maison de l’Éternel."],[6,"J’ajouterai à tes jours quinze années. Je te délivrerai, toi et cette ville, de la main du roi d’Assyrie; je protégerai cette ville, à cause de moi, et à cause de David, mon serviteur."]],"2 Rois 21:1-2":[[1,"Manassé avait douze ans lorsqu’il devint roi, et il régna cinquante-cinq ans à Jérusalem. Sa mère s’appelait Hephtsiba."],[2,"Il fit ce qui est mal aux yeux de l’Éternel, selon les abominations des nations que l’Éternel avait chassées devant les enfants d’Israël."]],"2 Rois 21:1-9":[[1,"Manassé avait douze ans lorsqu’il devint roi, et il régna cinquante-cinq ans à Jérusalem. Sa mère s’appelait Hephtsiba."],[2,"Il fit ce qui est mal aux yeux de l’Éternel, selon les abominations des nations que l’Éternel avait chassées devant les enfants d’Israël."],[3,"Il rebâtit les hauts lieux qu’Ézéchias, son père, avait détruits, il éleva des autels à Baal, il fit une idole d’Astarté, comme avait fait Achab, roi d’Israël, et il se prosterna devant toute l’armée des cieux et la servit."],[4,"Il bâtit des autels dans la maison de l’Éternel, quoique l’Éternel eût dit: C’est dans Jérusalem que je placerai mon nom."],[5,"Il bâtit des autels à toute l’armée des cieux dans les deux parvis de la maison de l’Éternel."],[6,"Il fit passer son fils par le feu; il observait les nuages et les serpents pour en tirer des pronostics, et il établit des gens qui évoquaient les esprits et qui prédisaient l’avenir. Il fit de plus en plus ce qui est mal aux yeux de l’Éternel, afin de l’irriter."],[7,"Il mit l’idole d’Astarté, qu’il avait faite, dans la maison de laquelle l’Éternel avait dit à David et à Salomon, son fils: C’est dans cette maison, et c’est dans Jérusalem, que j’ai choisie parmi toutes les tribus d’Israël, que je veux à toujours placer mon nom."],[8,"Je ne ferai plus errer le pied d’Israël hors du pays que j’ai donné à ses pères, pourvu seulement qu’ils aient soin de mettre en pratique tout ce que je leur ai commandé et toute la loi que leur a prescrite mon serviteur Moïse."],[9,"Mais ils n’obéirent point; et Manassé fut cause qu’ils s’égarèrent et firent le mal plus que les nations que l’Éternel avait détruites devant les enfants d’Israël."]],"2 Chroniques 33:11-13":[[11,"Alors l’Éternel fit venir contre eux les chefs de l’armée du roi d’Assyrie, qui saisirent Manassé et le mirent dans les fers; ils le lièrent avec des chaînes d’airain, et le menèrent à Babylone."],[12,"Lorsqu’il fut dans la détresse, il implora l’Éternel, son Dieu, et il s’humilia profondément devant le Dieu de ses pères."],[13,"Il lui adressa ses prières; et l’Éternel, se laissant fléchir, exauça ses supplications, et le ramena à Jérusalem dans son royaume. Et Manassé reconnut que l’Éternel est Dieu."]],"2 Rois 21:19-23":[[19,"Amon avait vingt-deux ans lorsqu’il devint roi, et il régna deux ans à Jérusalem. Sa mère s’appelait Meschullémeth, fille de Haruts, de Jotba."],[20,"Il fit ce qui est mal aux yeux de l’Éternel, comme avait fait Manassé, son père;"],[21,"il marcha dans toute la voie où avait marché son père, il servit les idoles qu’avait servies son père, et il se prosterna devant elles;"],[22,"il abandonna l’Éternel, le Dieu de ses pères, et il ne marcha point dans la voie de l’Éternel."],[23,"Les serviteurs d’Amon conspirèrent contre lui, et firent mourir le roi dans sa maison."]],"2 Rois 21:23":[[23,"Les serviteurs d’Amon conspirèrent contre lui, et firent mourir le roi dans sa maison."]],"2 Rois 22:1-2":[[1,"Josias avait huit ans lorsqu’il devint roi, et il régna trente et un ans à Jérusalem. Sa mère s’appelait Jedida, fille d’Adaja, de Botskath."],[2,"Il fit ce qui est droit aux yeux de l’Éternel, et il marcha dans toute la voie de David, son père; il ne s’en détourna ni à droite ni à gauche."]],"2 Rois 22:11":[[11,"Lorsque le roi entendit les paroles du livre de la loi, il déchira ses vêtements."]],"2 Rois 23:25":[[25,"Avant Josias, il n’y eut point de roi qui, comme lui, revînt à l’Éternel de tout son cœur, de toute son âme et de toute sa force, selon toute la loi de Moïse; et après lui, il n’en a point paru de semblable."]],"2 Rois 23:29":[[29,"De son temps, Pharaon Néco, roi d’Égypte, monta contre le roi d’Assyrie, vers le fleuve de l’Euphrate. Le roi Josias marcha à sa rencontre; et Pharaon le tua à Meguiddo, dès qu’il le vit."]],"2 Rois 22:8-13":[[8,"Alors Hilkija, le souverain sacrificateur, dit à Schaphan, le secrétaire: J’ai trouvé le livre de la loi dans la maison de l’Éternel. Et Hilkija donna le livre à Schaphan, et Schaphan le lut."],[9,"Puis Schaphan, le secrétaire, alla rendre compte au roi, et dit: Tes serviteurs ont amassé l’argent qui se trouvait dans la maison, et l’ont remis entre les mains de ceux qui sont chargés de faire exécuter l’ouvrage dans la maison de l’Éternel."],[10,"Schaphan, le secrétaire, dit encore au roi: Le sacrificateur Hilkija m’a donné un livre. Et Schaphan le lut devant le roi."],[11,"Lorsque le roi entendit les paroles du livre de la loi, il déchira ses vêtements."],[12,"Et le roi donna cet ordre au sacrificateur Hilkija, à Achikam, fils de Schaphan, à Acbor, fils de Michée, à Schaphan, le secrétaire, et à Asaja, serviteur du roi:"],[13,"Allez, consultez l’Éternel pour moi, pour le peuple, et pour tout Juda, au sujet des paroles de ce livre qu’on a trouvé; car grande est la colère de l’Éternel, qui s’est enflammée contre nous, parce que nos pères n’ont point obéi aux paroles de ce livre et n’ont point mis en pratique tout ce qui nous y est prescrit."]],"2 Rois 23:31-34":[[31,"Joachaz avait vingt-trois ans lorsqu’il devint roi, et il régna trois mois à Jérusalem. Sa mère s’appelait Hamuthal, fille de Jérémie, de Libna."],[32,"Il fit ce qui est mal aux yeux de l’Éternel, entièrement comme avaient fait ses pères."],[33,"Pharaon Néco l’enchaîna à Ribla, dans le pays de Hamath, pour qu’il ne régnât plus à Jérusalem; et il mit sur le pays une contribution de cent talents d’argent et d’un talent d’or."],[34,"Et Pharaon Néco établit roi Éliakim, fils de Josias, à la place de Josias, son père, et il changea son nom en celui de Jojakim. Il prit Joachaz, qui alla en Égypte et y mourut."]],"2 Rois 23:34":[[34,"Et Pharaon Néco établit roi Éliakim, fils de Josias, à la place de Josias, son père, et il changea son nom en celui de Jojakim. Il prit Joachaz, qui alla en Égypte et y mourut."]],"2 Rois 23:36-37":[[36,"Jojakim avait vingt-cinq ans lorsqu’il devint roi, et il régna onze ans à Jérusalem. Sa mère s’appelait Zebudda, fille de Pedaja, de Ruma."],[37,"Il fit ce qui est mal aux yeux de l’Éternel, entièrement comme avaient fait ses pères."]],"Jérémie 36:23":[[23,"Lorsque Jehudi eut lu trois ou quatre feuilles, le roi coupa le livre avec le canif du secrétaire, et le jeta dans le feu du brasier, où il fut entièrement consumé."]],"Daniel 1:1-6":[[1,"La troisième année du règne de Jojakim, roi de Juda, Nebucadnetsar, roi de Babylone, marcha contre Jérusalem, et l’assiégea."],[2,"Le Seigneur livra entre ses mains Jojakim, roi de Juda, et une partie des ustensiles de la maison de Dieu. Nebucadnetsar emporta les ustensiles au pays de Schinear, dans la maison de son dieu, il les mit dans la maison du trésor de son dieu."],[3,"Le roi donna l’ordre à Aschpenaz, chef de ses eunuques, d’amener quelques-uns des enfants d’Israël de race royale ou de famille noble,"],[4,"de jeunes garçons sans défaut corporel, beaux de figure, doués de sagesse, d’intelligence et d’instruction, capables de servir dans le palais du roi, et à qui l’on enseignerait les lettres et la langue des Chaldéens."],[5,"Le roi leur assigna pour chaque jour une portion des mets de sa table et du vin dont il buvait, voulant les élever pendant trois années, au bout desquelles ils seraient au service du roi."],[6,"Il y avait parmi eux, d’entre les enfants de Juda, Daniel, Hanania, Mischaël et Azaria."]],"Daniel 1:1-2":[[1,"La troisième année du règne de Jojakim, roi de Juda, Nebucadnetsar, roi de Babylone, marcha contre Jérusalem, et l’assiégea."],[2,"Le Seigneur livra entre ses mains Jojakim, roi de Juda, et une partie des ustensiles de la maison de Dieu. Nebucadnetsar emporta les ustensiles au pays de Schinear, dans la maison de son dieu, il les mit dans la maison du trésor de son dieu."]],"2 Rois 24:8-15":[[8,"Jojakin avait dix-huit ans lorsqu’il devint roi, et il régna trois mois à Jérusalem. Sa mère s’appelait Nehuschtha, fille d’Elnathan, de Jérusalem."],[9,"Il fit ce qui est mal aux yeux de l’Éternel, entièrement comme avait fait son père."],[10,"En ce temps-là, les serviteurs de Nebucadnetsar, roi de Babylone, montèrent contre Jérusalem, et la ville fut assiégée."],[11,"Nebucadnetsar, roi de Babylone, arriva devant la ville pendant que ses serviteurs l’assiégeaient."],[12,"Alors Jojakin, roi de Juda, se rendit auprès du roi de Babylone, avec sa mère, ses serviteurs, ses chefs et ses eunuques. Et le roi de Babylone le fit prisonnier, la huitième année de son règne."],[13,"Il tira de là tous les trésors de la maison de l’Éternel et les trésors de la maison du roi; et il brisa tous les ustensiles d’or que Salomon, roi d’Israël, avait faits dans le temple de l’Éternel, comme l’Éternel l’avait prononcé."],[14,"Il emmena en captivité tout Jérusalem, tous les chefs et tous les hommes vaillants, au nombre de dix mille exilés, avec tous les charpentiers et les serruriers: il ne resta que le peuple pauvre du pays."],[15,"Il transporta Jojakin à Babylone; et il emmena captifs de Jérusalem à Babylone la mère du roi, les femmes du roi et ses eunuques, et les grands du pays,"]],"2 Rois 25:27-30":[[27,"La trente-septième année de la captivité de Jojakin, roi de Juda, le vingt-septième jour du douzième mois, Évil-Merodac, roi de Babylone, dans la première année de son règne, releva la tête de Jojakin, roi de Juda, et le tira de prison."],[28,"Il lui parla avec bonté, et il mit son trône au-dessus du trône des rois qui étaient avec lui à Babylone."],[29,"Il lui fit changer ses vêtements de prison, et Jojakin mangea toujours à sa table tout le temps de sa vie."],[30,"Le roi pourvut constamment à son entretien journalier tout le temps de sa vie."]],"Matthieu 1:12":[[12,"Après la déportation à Babylone, Jéchonias engendra Salathiel; Salathiel engendra Zorobabel;"]],"2 Rois 24:18-20":[[18,"Sédécias avait vingt et un ans lorsqu’il devint roi, et il régna onze ans à Jérusalem. Sa mère s’appelait Hamuthal, fille de Jérémie, de Libna."],[19,"Il fit ce qui est mal aux yeux de l’Éternel, entièrement comme avait fait Jojakim."],[20,"Et cela arriva à cause de la colère de l’Éternel contre Jérusalem et contre Juda, qu’il voulait rejeter de devant sa face. Et Sédécias se révolta contre le roi de Babylone."]],"2 Rois 25:6-7":[[6,"Ils saisirent le roi, et le firent monter vers le roi de Babylone à Ribla; et l’on prononça contre lui une sentence."],[7,"Les fils de Sédécias furent égorgés en sa présence; puis on creva les yeux à Sédécias, on le lia avec des chaînes d’airain, et on le mena à Babylone."]],"Jérémie 38:17-20":[[17,"Jérémie dit alors à Sédécias: Ainsi parle l’Éternel, le Dieu des armées, le Dieu d’Israël: Si tu vas te rendre aux chefs du roi de Babylone, tu auras la vie sauve, et cette ville ne sera pas brûlée par le feu; tu vivras, toi et ta maison."],[18,"Mais si tu ne te rends pas aux chefs du roi de Babylone, cette ville sera livrée entre les mains des Chaldéens, qui la brûleront par le feu; et toi, tu n’échapperas pas à leurs mains."],[19,"Le roi Sédécias dit à Jérémie: Je crains les Juifs qui ont passé aux Chaldéens; je crains qu’on ne me livre entre leurs mains, et qu’ils ne m’outragent."],[20,"Jérémie répondit: On ne te livrera pas. Écoute la voix de l’Éternel dans ce que je te dis; tu t’en trouveras bien, et tu auras la vie sauve."]],"1 Rois 12:28-30":[[28,"Après s’être consulté, le roi fit deux veaux d’or, et il dit au peuple: Assez longtemps vous êtes montés à Jérusalem; Israël! voici ton Dieu, qui t’a fait sortir du pays d’Égypte."],[29,"Il plaça l’un de ces veaux à Béthel, et il mit l’autre à Dan."],[30,"Ce fut là une occasion de péché. Le peuple alla devant l’un des veaux jusqu’à Dan."]],"1 Rois 15:25-28":[[25,"Nadab, fils de Jéroboam, régna sur Israël, la seconde année d’Asa, roi de Juda. Il régna deux ans sur Israël."],[26,"Il fit ce qui est mal aux yeux de l’Éternel; et il marcha dans la voie de son père, se livrant aux péchés que son père avait fait commettre à Israël."],[27,"Baescha, fils d’Achija, de la maison d’Issacar, conspira contre lui, et Baescha le tua à Guibbethon, qui appartenait aux Philistins, pendant que Nadab et tout Israël assiégeaient Guibbethon."],[28,"Baescha le fit périr la troisième année d’Asa, roi de Juda, et il régna à sa place."]],"1 Rois 15:27-28":[[27,"Baescha, fils d’Achija, de la maison d’Issacar, conspira contre lui, et Baescha le tua à Guibbethon, qui appartenait aux Philistins, pendant que Nadab et tout Israël assiégeaient Guibbethon."],[28,"Baescha le fit périr la troisième année d’Asa, roi de Juda, et il régna à sa place."]],"1 Rois 15:33-34":[[33,"La troisième année d’Asa, roi de Juda, Baescha, fils d’Achija, régna sur tout Israël à Thirtsa. Il régna vingt-quatre ans."],[34,"Il fit ce qui est mal aux yeux de l’Éternel, et il marcha dans la voie de Jéroboam, se livrant aux péchés que Jéroboam avait fait commettre à Israël."]],"1 Rois 15:34":[[34,"Il fit ce qui est mal aux yeux de l’Éternel, et il marcha dans la voie de Jéroboam, se livrant aux péchés que Jéroboam avait fait commettre à Israël."]],"1 Rois 16:8-10":[[8,"La vingt-sixième année d’Asa, roi de Juda, Éla, fils de Baescha, régna sur Israël à Thirtsa. Il régna deux ans."],[9,"Son serviteur Zimri, chef de la moitié des chars, conspira contre lui. Éla était à Thirtsa, buvant et s’enivrant dans la maison d’Artsa, chef de la maison du roi à Thirtsa."],[10,"Zimri entra, le frappa et le tua, la vingt-septième année d’Asa, roi de Juda, et il régna à sa place."]],"1 Rois 16:9-10":[[9,"Son serviteur Zimri, chef de la moitié des chars, conspira contre lui. Éla était à Thirtsa, buvant et s’enivrant dans la maison d’Artsa, chef de la maison du roi à Thirtsa."],[10,"Zimri entra, le frappa et le tua, la vingt-septième année d’Asa, roi de Juda, et il régna à sa place."]],"1 Rois 16:15-18":[[15,"La vingt-septième année d’Asa, roi de Juda, Zimri régna sept jours à Thirtsa. Le peuple campait contre Guibbethon, qui appartenait aux Philistins."],[16,"Et le peuple qui campait apprit cette nouvelle: Zimri a conspiré, et même il a tué le roi! Et ce jour-là, tout Israël établit dans le camp pour roi d’Israël Omri, chef de l’armée."],[17,"Omri et tout Israël avec lui partirent de Guibbethon, et ils assiégèrent Thirtsa."],[18,"Zimri, voyant que la ville était prise, se retira dans le palais de la maison du roi, et brûla sur lui la maison du roi."]],"1 Rois 16:18":[[18,"Zimri, voyant que la ville était prise, se retira dans le palais de la maison du roi, et brûla sur lui la maison du roi."]],"1 Rois 16:23-25":[[23,"La trente et unième année d’Asa, roi de Juda, Omri régna sur Israël. Il régna douze ans. Après avoir régné six ans à Thirtsa,"],[24,"il acheta de Schémer la montagne de Samarie pour deux talents d’argent; il bâtit sur la montagne, et il donna à la ville qu’il bâtit le nom de Samarie, d’après le nom de Schémer, seigneur de la montagne."],[25,"Omri fit ce qui est mal aux yeux de l’Éternel, et il agit plus mal que tous ceux qui avaient été avant lui."]],"1 Rois 16:24-25":[[24,"il acheta de Schémer la montagne de Samarie pour deux talents d’argent; il bâtit sur la montagne, et il donna à la ville qu’il bâtit le nom de Samarie, d’après le nom de Schémer, seigneur de la montagne."],[25,"Omri fit ce qui est mal aux yeux de l’Éternel, et il agit plus mal que tous ceux qui avaient été avant lui."]],"1 Rois 16:29-33":[[29,"Achab, fils d’Omri, régna sur Israël, la trente-huitième année d’Asa, roi de Juda. Achab, fils d’Omri, régna vingt-deux ans sur Israël à Samarie."],[30,"Achab, fils d’Omri, fit ce qui est mal aux yeux de l’Éternel, plus que tous ceux qui avaient été avant lui."],[31,"Et comme si c’eût été pour lui peu de chose de se livrer aux péchés de Jéroboam, fils de Nebath, il prit pour femme Jézabel, fille d’Ethbaal, roi des Sidoniens, et il alla servir Baal et se prosterner devant lui."],[32,"Il éleva un autel à Baal dans la maison de Baal qu’il bâtit à Samarie,"],[33,"et il fit une idole d’Astarté. Achab fit plus encore que tous les rois d’Israël qui avaient été avant lui, pour irriter l’Éternel, le Dieu d’Israël."]],"1 Rois 16:30-33":[[30,"Achab, fils d’Omri, fit ce qui est mal aux yeux de l’Éternel, plus que tous ceux qui avaient été avant lui."],[31,"Et comme si c’eût été pour lui peu de chose de se livrer aux péchés de Jéroboam, fils de Nebath, il prit pour femme Jézabel, fille d’Ethbaal, roi des Sidoniens, et il alla servir Baal et se prosterner devant lui."],[32,"Il éleva un autel à Baal dans la maison de Baal qu’il bâtit à Samarie,"],[33,"et il fit une idole d’Astarté. Achab fit plus encore que tous les rois d’Israël qui avaient été avant lui, pour irriter l’Éternel, le Dieu d’Israël."]],"1 Rois 18:17-18":[[17,"A peine Achab aperçut-il Élie qu’il lui dit: Est-ce toi, qui jettes le trouble en Israël?"],[18,"Élie répondit: Je ne trouble point Israël; c’est toi, au contraire, et la maison de ton père, puisque vous avez abandonné les commandements de l’Éternel et que tu es allé après les Baals."]],"1 Rois 21:17-19":[[17,"Alors la parole de l’Éternel fut adressée à Élie, le Thischbite, en ces mots:"],[18,"Lève-toi, descends au-devant d’Achab, roi d’Israël à Samarie; le voilà dans la vigne de Naboth, où il est descendu pour en prendre possession."],[19,"Tu lui diras: Ainsi parle l’Éternel: N’es-tu pas un assassin et un voleur? Et tu lui diras: Ainsi parle l’Éternel: Au lieu même où les chiens ont léché le sang de Naboth, les chiens lécheront aussi ton propre sang."]],"1 Rois 22:34-35":[[34,"Alors un homme tira de son arc au hasard, et frappa le roi d’Israël au défaut de la cuirasse. Le roi dit à celui qui dirigeait son char: Tourne, et fais-moi sortir du champ de bataille, car je suis blessé."],[35,"Le combat devint acharné ce jour-là. Le roi fut retenu dans son char en face des Syriens, et il mourut le soir. Le sang de la blessure coula dans l’intérieur du char."]],"1 Rois 22:34-38":[[34,"Alors un homme tira de son arc au hasard, et frappa le roi d’Israël au défaut de la cuirasse. Le roi dit à celui qui dirigeait son char: Tourne, et fais-moi sortir du champ de bataille, car je suis blessé."],[35,"Le combat devint acharné ce jour-là. Le roi fut retenu dans son char en face des Syriens, et il mourut le soir. Le sang de la blessure coula dans l’intérieur du char."],[36,"Au coucher du soleil, on cria par tout le camp: Chacun à sa ville et chacun dans son pays!"],[37,"Ainsi mourut le roi, qui fut ramené à Samarie; et on enterra le roi à Samarie."],[38,"Lorsqu’on lava le char à l’étang de Samarie, les chiens léchèrent le sang d’Achab, et les prostituées s’y baignèrent, selon la parole que l’Éternel avait prononcée."]],"1 Rois 19:1-2":[[1,"Achab rapporta à Jézabel tout ce qu’avait fait Élie, et comment il avait tué par l’épée tous les prophètes."],[2,"Jézabel envoya un messager à Élie, pour lui dire: Que les dieux me traitent dans toute leur rigueur, si demain, à cette heure, je ne fais de ta vie ce que tu as fait de la vie de chacun d’eux!"]],"1 Rois 19:2":[[2,"Jézabel envoya un messager à Élie, pour lui dire: Que les dieux me traitent dans toute leur rigueur, si demain, à cette heure, je ne fais de ta vie ce que tu as fait de la vie de chacun d’eux!"]],"2 Rois 9:30-37":[[30,"Jéhu entra dans Jizreel. Jézabel, l’ayant appris, mit du fard à ses yeux, se para la tête, et regarda par la fenêtre."],[31,"Comme Jéhu franchissait la porte, elle dit: Est-ce la paix, nouveau Zimri, assassin de son maître?"],[32,"Il leva le visage vers la fenêtre, et dit: Qui est pour moi? Qui? Et deux ou trois eunuques le regardèrent en s’approchant de la fenêtre."],[33,"Il dit: Jetez-la en bas! Ils la jetèrent, et il rejaillit de son sang sur la muraille et sur les chevaux. Jéhu la foula aux pieds;"],[34,"puis il entra, mangea et but, et il dit: Allez voir cette maudite, et enterrez-la, car elle est fille de roi."],[35,"Ils allèrent pour l’enterrer; mais ils ne trouvèrent d’elle que le crâne, les pieds et les paumes des mains."],[36,"Ils retournèrent l’annoncer à Jéhu, qui dit: C’est ce qu’avait déclaré l’Éternel par son serviteur Élie, le Thischbite, en disant: Les chiens mangeront la chair de Jézabel dans le champ de Jizreel;"],[37,"et le cadavre de Jézabel sera comme du fumier sur la face des champs, dans le champ de Jizreel, de sorte qu’on ne pourra dire: C’est Jézabel."]],"2 Rois 1:2-4":[[2,"Or Achazia tomba par le treillis de sa chambre haute à Samarie, et il en fut malade. Il fit partir des messagers, et leur dit: Allez, consultez Baal-Zebub, dieu d’Ékron, pour savoir si je guérirai de cette maladie."],[3,"Mais l’ange de l’Éternel dit à Élie, le Thischbite: Lève-toi, monte à la rencontre des messagers du roi de Samarie, et dis-leur: Est-ce parce qu’il n’y a point de Dieu en Israël que vous allez consulter Baal-Zebub, dieu d’Ékron?"],[4,"C’est pourquoi ainsi parle l’Éternel: Tu ne descendras pas du lit sur lequel tu es monté, car tu mourras. Et Élie s’en alla."]],"2 Rois 3:1-2":[[1,"Joram, fils d’Achab, régna sur Israël à Samarie, la dix-huitième année de Josaphat, roi de Juda. Il régna douze ans."],[2,"Il fit ce qui est mal aux yeux de l’Éternel, non pas toutefois comme son père et sa mère. Il renversa les statues de Baal que son père avait faites;"]],"2 Rois 9:24":[[24,"Mais Jéhu saisit son arc, et il frappa Joram entre les épaules: la flèche sortit par le cœur, et Joram s’affaissa dans son char."]],"2 Rois 10:28-31":[[28,"Jéhu extermina Baal du milieu d’Israël;"],[29,"mais il ne se détourna point des péchés de Jéroboam, fils de Nebath, qui avait fait pécher Israël, il n’abandonna point les veaux d’or qui étaient à Béthel et à Dan."],[30,"L’Éternel dit à Jéhu: Parce que tu as bien exécuté ce qui était droit à mes yeux, et que tu as fait à la maison d’Achab tout ce qui était conforme à ma volonté, tes fils jusqu’à la quatrième génération seront assis sur le trône d’Israël."],[31,"Toutefois Jéhu ne prit point garde à marcher de tout son cœur dans la loi de l’Éternel, le Dieu d’Israël; il ne se détourna point des péchés que Jéroboam avait fait commettre à Israël."]],"2 Rois 10:30":[[30,"L’Éternel dit à Jéhu: Parce que tu as bien exécuté ce qui était droit à mes yeux, et que tu as fait à la maison d’Achab tout ce qui était conforme à ma volonté, tes fils jusqu’à la quatrième génération seront assis sur le trône d’Israël."]],"2 Rois 9:1-6":[[1,"Élisée, le prophète, appela l’un des fils des prophètes, et lui dit: Ceins tes reins, prends avec toi cette fiole d’huile, et va à Ramoth en Galaad."],[2,"Quand tu y seras arrivé, vois Jéhu, fils de Josaphat, fils de Nimschi. Tu iras le faire lever du milieu de ses frères, et tu le conduiras dans une chambre retirée."],[3,"Tu prendras la fiole d’huile, que tu répandras sur sa tête, et tu diras: Ainsi parle l’Éternel: Je t’oins roi d’Israël! Puis tu ouvriras la porte, et tu t’enfuiras sans t’arrêter."],[4,"Le jeune homme, serviteur du prophète, partit pour Ramoth en Galaad."],[5,"Quand il arriva, voici, les chefs de l’armée étaient assis. Il dit: Chef, j’ai un mot à te dire. Et Jéhu dit: Auquel de nous tous? Il répondit: A toi, chef."],[6,"Jéhu se leva et entra dans la maison, et le jeune homme répandit l’huile sur sa tête, en lui disant: Ainsi parle l’Éternel, le Dieu d’Israël: Je t’oins roi d’Israël, du peuple de l’Éternel."]],"2 Rois 13:1-5":[[1,"La vingt-troisième année de Joas, fils d’Achazia, roi de Juda, Joachaz, fils de Jéhu, régna sur Israël à Samarie. Il régna dix-sept ans."],[2,"Il fit ce qui est mal aux yeux de l’Éternel; il commit les mêmes péchés que Jéroboam, fils de Nebath, qui avait fait pécher Israël, et il ne s’en détourna point."],[3,"La colère de l’Éternel s’enflamma contre Israël, et il les livra entre les mains de Hazaël, roi de Syrie, et entre les mains de Ben-Hadad, fils de Hazaël, tout le temps que ces rois vécurent."],[4,"Joachaz implora l’Éternel. L’Éternel l’exauça, car il vit l’oppression sous laquelle le roi de Syrie tenait Israël,"],[5,"et l’Éternel donna un libérateur à Israël. Les enfants d’Israël échappèrent aux mains des Syriens, et ils habitèrent dans leurs tentes comme auparavant."]],"2 Rois 13:4-5":[[4,"Joachaz implora l’Éternel. L’Éternel l’exauça, car il vit l’oppression sous laquelle le roi de Syrie tenait Israël,"],[5,"et l’Éternel donna un libérateur à Israël. Les enfants d’Israël échappèrent aux mains des Syriens, et ils habitèrent dans leurs tentes comme auparavant."]],"2 Rois 13:10-14":[[10,"La trente-septième année de Joas, roi de Juda, Joas, fils de Joachaz, régna sur Israël à Samarie. Il régna seize ans."],[11,"Il fit ce qui est mal aux yeux de l’Éternel; il ne se détourna d’aucun des péchés de Jéroboam, fils de Nebath, qui avait fait pécher Israël, et il s’y livra comme lui."],[12,"Le reste des actions de Joas, tout ce qu’il a fait, ses exploits, et la guerre qu’il eut avec Amatsia, roi de Juda, cela n’est-il pas écrit dans le livre des Chroniques des rois d’Israël?"],[13,"Joas se coucha avec ses pères. Et Jéroboam s’assit sur son trône. Joas fut enterré à Samarie avec les rois d’Israël."],[14,"Élisée était atteint de la maladie dont il mourut; et Joas, roi d’Israël, descendit vers lui, pleura sur son visage, et dit: Mon père! Mon père! Char d’Israël et sa cavalerie!"]],"2 Rois 13:14":[[14,"Élisée était atteint de la maladie dont il mourut; et Joas, roi d’Israël, descendit vers lui, pleura sur son visage, et dit: Mon père! Mon père! Char d’Israël et sa cavalerie!"]],"2 Rois 14:23-25":[[23,"La quinzième année d’Amatsia, fils de Joas, roi de Juda, Jéroboam, fils de Joas, roi d’Israël, régna à Samarie. Il régna quarante et un ans."],[24,"Il fit ce qui est mal aux yeux de l’Éternel; il ne se détourna d’aucun des péchés de Jéroboam, fils de Nebath, qui avait fait pécher Israël."],[25,"Il rétablit les limites d’Israël depuis l’entrée de Hamath jusqu’à la mer de la plaine, selon la parole que l’Éternel, le Dieu d’Israël, avait prononcée par son serviteur Jonas, le prophète, fils d’Amitthaï, de Gath-Hépher."]],"2 Rois 14:25":[[25,"Il rétablit les limites d’Israël depuis l’entrée de Hamath jusqu’à la mer de la plaine, selon la parole que l’Éternel, le Dieu d’Israël, avait prononcée par son serviteur Jonas, le prophète, fils d’Amitthaï, de Gath-Hépher."]],"2 Rois 15:8-12":[[8,"La trente-huitième année d’Azaria, roi de Juda, Zacharie, fils de Jéroboam, régna sur Israël à Samarie. Il régna six mois."],[9,"Il fit ce qui est mal aux yeux de l’Éternel, comme avaient fait ses pères; il ne se détourna point des péchés de Jéroboam, fils de Nebath, qui avait fait pécher Israël."],[10,"Schallum, fils de Jabesch, conspira contre lui, le frappa devant le peuple, et le fit mourir; et il régna à sa place."],[11,"Le reste des actions de Zacharie, cela est écrit dans le livre des Chroniques des rois d’Israël."],[12,"Ainsi s’accomplit ce que l’Éternel avait déclaré à Jéhu, en disant: Tes fils jusqu’à la quatrième génération seront assis sur le trône d’Israël."]],"2 Rois 15:10-12":[[10,"Schallum, fils de Jabesch, conspira contre lui, le frappa devant le peuple, et le fit mourir; et il régna à sa place."],[11,"Le reste des actions de Zacharie, cela est écrit dans le livre des Chroniques des rois d’Israël."],[12,"Ainsi s’accomplit ce que l’Éternel avait déclaré à Jéhu, en disant: Tes fils jusqu’à la quatrième génération seront assis sur le trône d’Israël."]],"2 Rois 15:13-14":[[13,"Schallum, fils de Jabesch, régna la trente-neuvième année d’Ozias, roi de Juda. Il régna pendant un mois à Samarie."],[14,"Menahem, fils de Gadi, monta de Thirtsa et vint à Samarie, frappa dans Samarie Schallum, fils de Jabesch, et le fit mourir; et il régna à sa place."]],"2 Rois 15:14":[[14,"Menahem, fils de Gadi, monta de Thirtsa et vint à Samarie, frappa dans Samarie Schallum, fils de Jabesch, et le fit mourir; et il régna à sa place."]],"2 Rois 15:17-20":[[17,"La trente-neuvième année d’Azaria, roi de Juda, Menahem, fils de Gadi, régna sur Israël. Il régna dix ans à Samarie."],[18,"Il fit ce qui est mal aux yeux de l’Éternel; il ne se détourna point, tant qu’il vécut, des péchés de Jéroboam, fils de Nebath, qui av
