AM('eve', 'Ève', 'origines', 0, 930, { u: 'd', m: 1, nm: '« Vivante » : la mère de tous les vivants (Genèse 3:20).',
  s: 'La première femme, mère de tous les vivants.',
  h: ['Dieu la forme à partir d’une côte d’Adam : « os de mes os et chair de ma chair » (Genèse 2:22-23). Trompée par le serpent, elle mange du fruit et en donne à son mari.',
    'Elle est la mère de Caïn, d’Abel et de Seth. À la naissance de Seth, elle dit : « Dieu m’a donné un autre fils à la place d’Abel » (Genèse 4:25).',
    'La Bible ne dit pas quand elle meurt : sa barre s’arrête ici avec celle d’Adam, à titre indicatif.'],
  refs: ['Genèse 2:22-23', 'Genèse 3:20', 'Genèse 4:25'] });
AM('seth', 'Seth', 'origines', 130, 1042, { age: 912, ar: 'Genèse 5:8', p: 'adam', nm: '« Mis à la place » (d’Abel).',
  s: 'Fils d’Adam, né à la place d’Abel. De son temps, « on commença à invoquer le nom de l’Éternel » (Genèse 4:26).', refs: ['Genèse 4:25-26', 'Genèse 5:6-8'] });
AM('enosch', 'Énosch', 'origines', 235, 1140, { age: 905, ar: 'Genèse 5:11', p: 'seth', s: 'Fils de Seth. Il a connu Adam pendant 695 ans, et a vécu 84 ans en même temps que Noé.', refs: ['Genèse 5:9-11'] });
AM('kenan', 'Kénan', 'origines', 325, 1235, { age: 910, ar: 'Genèse 5:14', p: 'enosch', s: 'Fils d’Énosch, ancêtre de Noé.', refs: ['Genèse 5:12-14'] });
AM('mahalaleel', 'Mahalaleel', 'origines', 395, 1290, { age: 895, ar: 'Genèse 5:17', p: 'kenan', nm: '« Louange de Dieu ».', s: 'Fils de Kénan, ancêtre de Noé.', refs: ['Genèse 5:15-17'] });
AM('jered', 'Jéred', 'origines', 460, 1422, { age: 962, ar: 'Genèse 5:20', p: 'mahalaleel', s: 'Père d’Hénoc. Avec 962 ans, c’est la deuxième plus longue vie de la Bible.', refs: ['Genèse 5:18-20'] });
AM('henoc', 'Hénoc', 'origines', 622, 987, { m: 1, age: 365, ar: 'Genèse 5:23', p: 'jered', nm: '« Consacré ».', end: 'enlevé',
  s: 'Il marcha avec Dieu, puis Dieu le prit : il n’a pas connu la mort.',
  h: ['Après la naissance de Metuschélah, « Hénoc marcha avec Dieu » trois cents ans. Puis « il ne fut plus, parce que Dieu le prit » (Genèse 5:22-24) : il n’est pas mort.',
    'Hébreux 11:5 explique : par la foi, Hénoc fut enlevé pour qu’il ne vît point la mort ; il avait reçu le témoignage qu’il était agréable à Dieu. Jude rapporte sa prophétie sur la venue du Seigneur (Jude 1:14-15).',
    'Il a vécu 365 ans sur la terre, moins que tous ses ancêtres. Adam était encore vivant pendant 308 ans de sa vie. Noé, lui, ne l’a pas connu : il est né 69 ans après son enlèvement.'],
  refs: ['Genèse 5:21-24', 'Hébreux 11:5', 'Jude 1:14-15'] });
AM('metuschelah', 'Metuschélah', 'origines', 687, 1656, { m: 1, age: 969, ar: 'Genèse 5:27', p: 'henoc', nm: 'Sens discuté (« homme du javelot »).',
  s: 'L’homme le plus âgé de la Bible : 969 ans. Il meurt l’année du déluge.',
  h: ['Fils d’Hénoc et grand-père de Noé. Avec 969 ans, c’est la plus longue vie rapportée par la Bible (Genèse 5:27).',
    'Fais le calcul : il a 187 ans à la naissance de Lémec, Lémec a 182 ans à la naissance de Noé, et Noé a 600 ans au déluge. 187 + 182 + 600 = 969 : Metuschélah meurt l’année même du déluge. Dieu a patienté jusqu’au bout.',
    'Il a connu Adam pendant 243 ans, et Sem, le fils de Noé, pendant 98 ans.'],
  refs: ['Genèse 5:25-27', 'Genèse 7:6'] });
AM('lemec', 'Lémec', 'origines', 874, 1651, { age: 777, ar: 'Genèse 5:31', p: 'metuschelah',
  s: 'Père de Noé. À sa naissance, il dit : « Celui-ci nous consolera de nos fatigues » (Genèse 5:29). Il a connu Adam pendant 56 ans. (À ne pas confondre avec Lémec, descendant de Caïn.)', refs: ['Genèse 5:28-31'] });
AM('noe', 'Noé', 'origines', 1056, 2006, { m: 1, age: 950, ar: 'Genèse 9:29', p: 'lemec', nm: '« Repos ».',
  s: 'L’homme juste qui construit l’arche ; Dieu fait alliance avec lui après le déluge.',
  h: ['« Noé trouva grâce aux yeux de l’Éternel » (Genèse 6:8) : un homme juste dans une génération corrompue. Dieu lui demande de construire une arche pour sauver sa famille et les animaux.',
    'Il a 600 ans quand le déluge commence (Genèse 7:6). En sortant de l’arche, il bâtit un autel ; Dieu fait alliance avec lui et avec toute la terre, et l’arc-en-ciel en est le signe (Genèse 9:12-13).',
    'Il vit encore 350 ans après le déluge. Ses fils sont Sem, Cham et Japhet : c’est d’eux que vient toute la population de la terre (Genèse 9:19). Jésus compare son retour aux jours de Noé (Matthieu 24:37-39).',
    'Une précision : Noé n’a pas connu Hénoc (né 69 ans après son enlèvement), mais il a connu Metuschélah pendant 600 ans, et celui-ci meurt l’année du déluge.'],
  refs: ['Genèse 6:8-9', 'Genèse 7:6', 'Genèse 9:12-13', 'Genèse 9:28-29', 'Matthieu 24:37-39', 'Hébreux 11:7'] });

/* ============ DE NOÉ À ABRAHAM ============ */
AM('japhet', 'Japhet', 'noe', 1554, 1900, { u: 'bd', p: 'noe', s: 'Fils aîné de Noé (Genèse 10:21), ancêtre des peuples des îles et du nord (Grecs, Mèdes…). Noé dit : « Que Dieu étende les possessions de Japhet » (Genèse 9:27). Dates inconnues.', refs: ['Genèse 9:27', 'Genèse 10:2-5'] });
AM('sem', 'Sem', 'noe', 1558, 2158, { m: 1, age: 600, ar: 'Genèse 11:10-11', p: 'noe', nm: '« Nom ».',
  s: 'Fils de Noé, ancêtre d’Abraham. Il vit 500 ans après le déluge.',
  h: ['Fils de Noé, il entre dans l’arche avec sa femme. Noé le bénit : « Béni soit l’Éternel, Dieu de Sem ! » (Genèse 9:26).',
    'C’est l’ancêtre d’Abraham, donc d’Israël et de Jésus (Luc 3:36). De son nom vient le mot « sémite ».',
    'D’après les âges de Genèse 11, Sem est encore vivant quand Abraham a 150 ans et quand Isaac a 50 ans. Une ancienne tradition juive l’identifie à Melchisédek, mais la Bible ne le dit pas.'],
  refs: ['Genèse 9:26', 'Genèse 11:10-11', 'Luc 3:36'] });
AM('cham', 'Cham', 'noe', 1560, 1900, { u: 'bd', p: 'noe', s: 'Fils cadet de Noé (Genèse 9:24), père de Cusch, de Mitsraïm (l’Égypte), de Puth et de Canaan (Genèse 10:6). Il voit la nudité de son père et le raconte ; Noé maudit Canaan. Dates inconnues.', refs: ['Genèse 9:22-25', 'Genèse 10:6'] });
AM('arpacschad', 'Arpacschad', 'noe', 1658, 2096, { age: 438, ar: 'Genèse 11:12-13', p: 'sem', s: 'Fils de Sem, né deux ans après le déluge (Genèse 11:10).', refs: ['Genèse 11:10-13'] });
AM('schelach', 'Schélach', 'noe', 1693, 2126, { age: 433, ar: 'Genèse 11:14-15', p: 'arpacschad', s: 'Fils d’Arpacschad, ancêtre d’Abraham.', refs: ['Genèse 11:14-15'] });
AM('heber', 'Héber', 'noe', 1723, 2187, { age: 464, ar: 'Genèse 11:16-17', p: 'schelach', m: 1,
  s: 'Ancêtre dont viendrait le nom « Hébreu ». Il survit à Abraham !',
  h: ['Fils de Schélach. Son nom serait à l’origine du mot « Hébreu » (Genèse 10:21 ; 14:13).',
    'Avec 464 ans, il vit plus longtemps que tous ses descendants : il meurt 4 ans après Abraham, alors que Jacob a déjà 19 ans.'],
  refs: ['Genèse 10:21', 'Genèse 11:16-17'] });
AM('peleg', 'Péleg', 'noe', 1757, 1996, { age: 239, ar: 'Genèse 11:18-19', p: 'heber', nm: '« Partage ».', s: '« De son temps la terre fut partagée » (Genèse 10:25), ce qu’on relie souvent à la tour de Babel. Les durées de vie chutent fortement à partir de lui.', refs: ['Genèse 10:25', 'Genèse 11:18-19'] });
AM('rehu', 'Rehu', 'noe', 1787, 2026, { age: 239, ar: 'Genèse 11:20-21', p: 'peleg', s: 'Fils de Péleg, ancêtre d’Abraham.', refs: ['Genèse 11:20-21'] });
AM('serug', 'Serug', 'noe', 1819, 2049, { age: 230, ar: 'Genèse 11:22-23', p: 'rehu', s: 'Fils de Rehu, arrière-grand-père d’Abraham.', refs: ['Genèse 11:22-23'] });
AM('nachor', 'Nachor', 'noe', 1849, 1997, { age: 148, ar: 'Genèse 11:24-25', p: 'serug', s: 'Grand-père d’Abraham. Il meurt à 148 ans, avant son propre père Serug et même avant Noé.', refs: ['Genèse 11:24-25'] });
AM('terach', 'Térach', 'noe', 1878, 2083, { age: 205, ar: 'Genèse 11:32', p: 'nachor', m: 1,
  s: 'Père d’Abraham. Il part d’Ur vers Canaan, mais s’arrête à Charan.',
  h: ['Père d’Abram, de Nachor et d’Haran. Il quitte Ur des Chaldéens avec Abram, Saraï et Lot pour aller en Canaan, mais s’installe à Charan, où il meurt à 205 ans (Genèse 11:31-32).',
    'Josué rappelle qu’il servait d’autres dieux (Josué 24:2). Étienne précise qu’Abraham a quitté Charan après la mort de son père (Actes 7:4) : c’est pourquoi on calcule ici qu’Abraham est né quand Térach avait 130 ans.'],
  refs: ['Genèse 11:31-32', 'Josué 24:2', 'Actes 7:4'] });

/* ============ PATRIARCHES ============ */
A('abraham', 'Abraham', 'patri', -2166, -1991, { m: 1, am: [2008, 2183], age: 175, ar: 'Genèse 25:7', p: 'terach', route: 'abraham', nm: 'Abram, « père élevé », devient Abraham, « père d’une multitude » (Genèse 17:5).',
  s: 'Le père des croyants : il part sur la parole de Dieu.',
  h: ['À 75 ans, Dieu l’appelle à quitter Charan : « Je ferai de toi une grande nation… et toutes les familles de la terre seront bénies en toi » (Genèse 12:1-4). Il part sans savoir où il allait (Hébreux 11:8).',
    '« Abram eut confiance en l’Éternel, qui le lui imputa à justice » (Genèse 15:6) : c’est le verset que Paul cite pour expliquer la justification par la foi (Romains 4:3).',
    'À 100 ans, Sara lui donne Isaac, le fils de la promesse (Genèse 21:5). Dieu l’éprouve en lui demandant d’offrir Isaac sur le mont Morija, puis pourvoit un bélier (Genèse 22:13-14).',
    'Il est appelé « ami de Dieu » (Jacques 2:23). Il meurt à 175 ans ; Isaac et Ismaël l’enterrent ensemble (Genèse 25:7-9). Jésus dira : « Avant qu’Abraham fût, je suis » (Jean 8:58).'],
  refs: ['Genèse 12:1-4', 'Genèse 15:6', 'Genèse 22:13-14', 'Genèse 25:7-9', 'Hébreux 11:8', 'Jean 8:58'], meet: ['sara', 'lot', 'melchisedek', 'ismael', 'isaac'] });
A('sara', 'Sara', 'patri', -2156, -2029, { age: 127, ar: 'Genèse 23:1', nm: 'Saraï devient Sara, « princesse ».',
  s: 'Femme d’Abraham, mère d’Isaac à 90 ans.',
  h: ['Femme d’Abraham, stérile pendant longtemps. Elle rit en apprenant qu’elle aura un fils à 90 ans ; Dieu répond : « Y a-t-il rien qui soit étonnant de la part de l’Éternel ? » (Genèse 18:14).',
    'Mère d’Isaac, elle meurt à Hébron à 127 ans (Genèse 23:1-2). Hébreux 11:11 la cite parmi les héros de la foi.'],
  refs: ['Genèse 18:14', 'Genèse 21:1-3', 'Genèse 23:1-2', 'Hébreux 11:11'] });
A('lot', 'Lot', 'patri', -2140, -2040, { u: 'bd', s: 'Neveu d’Abraham. Il s’installe à Sodome et en est sauvé par deux anges ; sa femme regarde en arrière (Genèse 19:15-26). Pierre l’appelle « le juste » (2 Pierre 2:7). Dates inconnues.', refs: ['Genèse 13:10-12', 'Genèse 19:15-26', '2 Pierre 2:7'] });
A('melchisedek', 'Melchisédek', 'patri', -2110, -2060, { u: 'bd', m: 1, nm: '« Roi de justice », roi de Salem (« paix »).',
  s: 'Roi de Salem et sacrificateur du Dieu Très-Haut ; une image du Christ.',
  h: ['Roi de Salem et sacrificateur du Dieu Très-Haut, il apporte du pain et du vin à Abram, le bénit, et Abram lui donne la dîme de tout (Genèse 14:18-20).',
    'Le Psaume 110:4 annonce un prêtre « à la manière de Melchisédek », et l’épître aux Hébreux l’applique à Jésus (Hébreux 7:1-3). Ses dates sont inconnues : on sait seulement qu’il a rencontré Abraham.'],
  refs: ['Genèse 14:18-20', 'Psaume 110:4', 'Hébreux 7:1-3'] });
A('ismael', 'Ismaël', 'patri', -2080, -1943, { age: 137, ar: 'Genèse 25:17', p: 'abraham', nm: '« Dieu entend ».', s: 'Fils d’Abraham et d’Agar, né quand Abraham avait 86 ans (Genèse 16:16). Dieu promet de faire de lui une grande nation (Genèse 21:17-18). Avec Isaac, il enterre leur père.', refs: ['Genèse 16:11', 'Genèse 16:16', 'Genèse 21:17-18', 'Genèse 25:17'], meet: ['isaac'] });
A('isaac', 'Isaac', 'patri', -2066, -1886, { m: 1, am: [2108, 2288], age: 180, ar: 'Genèse 35:28', p: 'abraham', nm: '« Il rit ».',
  s: 'Le fils de la promesse.',
  h: ['Né quand Abraham a 100 ans et Sara 90. Sur le mont Morija, il se laisse lier sur l’autel ; Dieu pourvoit un bélier à sa place (Genèse 22).',
    'À 40 ans, il épouse Rebecca (Genèse 25:20) ; à 60 ans naissent les jumeaux Ésaü et Jacob (Genèse 25:26). Devenu aveugle, il bénit Jacob en croyant bénir Ésaü (Genèse 27).',
    'Il meurt à 180 ans, enterré par Ésaü et Jacob (Genèse 35:28-29). Calcul étonnant : il vit encore quand Joseph est vendu en Égypte, et meurt un an avant que Joseph devienne gouverneur.'],
  refs: ['Genèse 21:5', 'Genèse 22:7-8', 'Genèse 25:20', 'Genèse 25:26', 'Genèse 35:28-29'], meet: ['rebecca', 'jacob', 'esau'] });
A('rebecca', 'Rebecca', 'patri', -2046, -1910, { u: 'bd', s: 'Femme d’Isaac, trouvée près d’un puits par le serviteur d’Abraham (Genèse 24). Mère d’Ésaü et de Jacob, elle aide Jacob à obtenir la bénédiction (Genèse 27). Dates approximatives.', refs: ['Genèse 24:15-20', 'Genèse 25:21-23'] });
A('job', 'Job', 'patri', -2050, -1850, { u: 'bd', m: 1, s: 'L’homme intègre éprouvé, puis restauré. Époque incertaine.',
  h: ['Homme intègre du pays d’Uts, il perd ses biens, ses enfants et sa santé, mais ne maudit pas Dieu : « L’Éternel a donné, et l’Éternel a ôté ; que le nom de l’Éternel soit béni ! » (Job 1:21).',
    'Au cœur de l’épreuve, il dit : « Je sais que mon rédempteur est vivant » (Job 19:25). Dieu lui répond du milieu de la tempête et le rétablit ; il vit encore 140 ans (Job 42:16).',
    'Le livre ne donne pas son époque ; beaucoup le placent au temps des patriarches. Sa barre est donc indicative.'],
  refs: ['Job 1:21', 'Job 19:25', 'Job 42:10-17'] });
A('jacob', 'Jacob', 'patri', -2006, -1859, { m: 1, am: [2168, 2315], age: 147, ar: 'Genèse 47:28', p: 'isaac', route: 'jacob', nm: 'Jacob, « il supplante », devient Israël (Genèse 32:28).',
  s: 'Renommé Israël : ses douze fils sont les douze tribus.',
  h: ['Fils cadet d’Isaac, il obtient le droit d’aînesse d’Ésaü (Genèse 25:29-34), puis la bénédiction de son père par la ruse (Genèse 27).',
    'En fuyant vers Charan, il voit à Béthel une échelle qui relie la terre au ciel (Genèse 28:12-15). Chez son oncle Laban, il épouse Léa et Rachel et travaille vingt ans (Genèse 31:41).',
    'Au retour, il lutte toute une nuit avec Dieu au gué du Jabbok et reçoit le nom d’Israël (Genèse 32:24-30).',
    'À 130 ans, il descend en Égypte avec toute sa famille (Genèse 47:9). Il meurt à 147 ans après avoir béni ses fils ; il annonce que le sceptre ne s’écartera pas de Juda (Genèse 49:10).'],
  refs: ['Genèse 28:12-15', 'Genèse 32:24-30', 'Genèse 47:9', 'Genèse 49:10'], meet: ['esau', 'lea', 'rachel', 'joseph', 'juda', 'levi', 'benjamin'] });
A('esau', 'Ésaü', 'patri', -2006, -1880, { u: 'd', p: 'isaac', nm: 'Aussi appelé Édom, « roux ».', s: 'Jumeau de Jacob, ancêtre des Édomites. Il vend son droit d’aînesse pour un plat de lentilles (Genèse 25:29-34), puis se réconcilie avec Jacob (Genèse 33:4). Sa mort n’est pas datée.', refs: ['Genèse 25:29-34', 'Genèse 33:4'] });
A('lea', 'Léa', 'patri', -1945, -1880, { u: 'bd', s: 'Première femme de Jacob, mère de Ruben, Siméon, Lévi, Juda, Issacar, Zabulon et Dina. De Lévi viennent les prêtres, de Juda les rois et le Messie. Elle est enterrée avec Abraham et Isaac (Genèse 49:31).', refs: ['Genèse 29:31-35', 'Genèse 49:31'] });
A('rachel', 'Rachel', 'patri', -1940, -1900, { u: 'bd', m: 1, s: 'La femme que Jacob aimait, mère de Joseph et de Benjamin.',
  h: ['Jacob travaille sept ans pour l’épouser, « et ils furent à ses yeux comme quelques jours, parce qu’il l’aimait » (Genèse 29:20).',
    'Longtemps stérile, elle met au monde Joseph, puis meurt en donnant naissance à Benjamin sur la route de Bethléhem (Genèse 35:16-19). Jérémie la montre « pleurant ses enfants », une image reprise à la naissance de Jésus (Matthieu 2:18).'],
  refs: ['Genèse 29:20', 'Genèse 30:22-24', 'Genèse 35:16-19', 'Matthieu 2:18'] });
A('levi', 'Lévi', 'patri', -1919, -1782, { u: 'b', age: 137, ar: 'Exode 6:16', p: 'jacob', s: 'Troisième fils de Jacob et de Léa. De lui viennent les Lévites et les prêtres : Moïse et Aaron sont ses arrière-petits-fils (Exode 6:16-20). Il vit 137 ans.', refs: ['Genèse 29:34', 'Exode 6:16-20'] });
A('juda', 'Juda', 'patri', -1918, -1800, { u: 'bd', m: 1, p: 'jacob', nm: '« Louange ».', s: 'Le fils de Jacob d’où viennent David et Jésus.',
  h: ['Quatrième fils de Jacob et de Léa. C’est lui qui propose de vendre Joseph (Genèse 37:26-27), mais plus tard il offre sa vie à la place de Benjamin (Genèse 44:33).',
    'Jacob annonce : « Le sceptre ne s’éloignera point de Juda » (Genèse 49:10). De sa tribu viennent David et Jésus, « le lion de la tribu de Juda » (Apocalypse 5:5). Sa mort n’est pas datée.'],
  refs: ['Genèse 37:26-27', 'Genèse 44:33', 'Genèse 49:10', 'Apocalypse 5:5'], meet: ['tamar'] });
A('tamar', 'Tamar', 'patri', -1905, -1830, { u: 'bd', m: 1, s: 'Belle-fille de Juda, ancêtre de David et de Jésus.',
  h: ['Veuve de deux fils de Juda, elle se voit refuser le troisième. Elle se déguise et obtient de Juda lui-même une descendance ; Juda reconnaît : « Elle est moins coupable que moi » (Genèse 38:26).',
    'Elle met au monde des jumeaux, Pérets et Zérach. Pérets est l’ancêtre de Boaz et de David (Ruth 4:18-22) : Tamar est l’une des quatre femmes citées dans la généalogie de Jésus (Matthieu 1:3).',
    'Quand a-t-elle vécu ? Son histoire se place entre la vente de Joseph (vers 1898 av. J.-C.) et la descente en Égypte (vers 1876 av. J.-C.). À ne pas confondre avec Tamar, fille de David (2 Samuel 13).'],
  refs: ['Genèse 38:26-30', 'Ruth 4:18-22', 'Matthieu 1:3'] });
A('joseph', 'Joseph', 'patri', -1915, -1805, { m: 1, age: 110, ar: 'Genèse 50:26', p: 'jacob', route: 'joseph', nm: '« Qu’il ajoute ».',
  s: 'Vendu par ses frères, devenu gouverneur de l’Égypte.',
  h: ['Fils de Jacob et de Rachel, préféré de son père. À 17 ans, ses frères jaloux le vendent comme esclave (Genèse 37:2-28).',
    'En Égypte, il reste fidèle chez Potiphar, puis en prison. À 30 ans, il explique les rêves de Pharaon et devient gouverneur de tout le pays (Genèse 41:39-46).',
    'Pendant la famine, ses frères viennent acheter du blé. Il se fait reconnaître et pardonne : « Vous aviez médité de me faire du mal, Dieu l’a changé en bien » (Genèse 50:20).',
    'Il meurt à 110 ans et demande que ses os soient emportés au pays promis (Genèse 50:25 ; Hébreux 11:22).'],
  refs: ['Genèse 37:3-4', 'Genèse 41:39-46', 'Genèse 45:4-8', 'Genèse 50:20', 'Genèse 50:24-26'], meet: ['benjamin', 'juda', 'levi'] });
A('benjamin', 'Benjamin', 'patri', -1900, -1810, { u: 'bd', p: 'jacob', nm: '« Fils de la droite ».', s: 'Dernier fils de Jacob ; sa mère Rachel meurt à sa naissance. De sa tribu viennent le roi Saül et l’apôtre Paul (Philippiens 3:5).', refs: ['Genèse 35:16-18', 'Philippiens 3:5'] });

/* ============ EXODE ET CONQUÊTE ============ */
A('moise', 'Moïse', 'exode', -1526, -1406, { m: 1, age: 120, ar: 'Deutéronome 34:7', route: 'exode', nm: '« Tiré des eaux » (Exode 2:10).',
  s: 'Il conduit Israël hors d’Égypte et reçoit la Loi au Sinaï.',
  h: ['Né en Égypte quand Pharaon fait jeter les garçons hébreux dans le Nil, il est sauvé dans une corbeille et élevé par la fille de Pharaon (Exode 2:1-10).',
    'À 40 ans, il fuit au pays de Madian (Actes 7:23-29). À 80 ans, Dieu lui parle dans le buisson ardent : « Je suis celui qui suis » (Exode 3:14). Après les dix plaies et la Pâque, il fait sortir Israël d’Égypte.',
    'Au Sinaï, il reçoit la Loi et les dix commandements (Exode 20). Il conduit le peuple quarante ans dans le désert.',
    'Il meurt à 120 ans sur le mont Nebo, en voyant le pays promis (Deutéronome 34:1-7). Il réapparaît avec Élie aux côtés de Jésus, à la transfiguration (Matthieu 17:3).'],
  refs: ['Exode 2:10', 'Exode 3:14', 'Exode 14:21-22', 'Exode 20:1-3', 'Deutéronome 34:5-7', 'Matthieu 17:3'], meet: ['aaron', 'myriam', 'josue', 'caleb'] });
A('aaron', 'Aaron', 'exode', -1529, -1407, { age: 123, ar: 'Nombres 33:39', m: 1, s: 'Frère aîné de Moïse et premier grand prêtre.',
  h: ['Frère aîné de Moïse de trois ans (Exode 7:7), il est son porte-parole devant Pharaon.',
    'Premier grand prêtre d’Israël. Il cède au peuple et fabrique le veau d’or (Exode 32:1-4). Il meurt à 123 ans sur la montagne de Hor (Nombres 33:38-39).'],
  refs: ['Exode 4:14-16', 'Exode 7:7', 'Exode 28:1', 'Nombres 33:38-39'], meet: ['myriam'] });
A('myriam', 'Myriam', 'exode', -1535, -1407, { u: 'b', nm: 'La Segond 1910 l’appelle « Marie ».', s: 'Sœur de Moïse et d’Aaron, prophétesse. Après le passage de la mer, elle chante : « Chantez à l’Éternel, car il a fait éclater sa gloire » (Exode 15:20-21). Elle meurt à Kadès (Nombres 20:1).', refs: ['Exode 15:20-21', 'Nombres 20:1'] });
A('josue', 'Josué', 'exode', -1490, -1380, { u: 'bd', m: 1, age: 110, ar: 'Josué 24:29', nm: '« L’Éternel sauve » : la forme hébraïque du nom de Jésus.',
  s: 'Il fait entrer le peuple dans le pays promis.',
  h: ['Serviteur de Moïse, il combat Amalek (Exode 17:9-13). Envoyé parmi les douze espions, il est, avec Caleb, le seul à faire confiance à Dieu (Nombres 14:6-9).',
    'Après Moïse, il fait traverser le Jourdain au peuple et prend Jéricho (Josué 3 ; 6). Dieu lui dit : « Fortifie-toi et prends courage » (Josué 1:9). Il partage le pays entre les tribus.',
    'À la fin, il déclare : « Moi et ma maison, nous servirons l’Éternel » (Josué 24:15). Il meurt à 110 ans.'],
  refs: ['Nombres 14:6-9', 'Josué 1:9', 'Josué 6:20', 'Josué 24:15', 'Josué 24:29'], meet: ['caleb', 'rahab'] });
A('caleb', 'Caleb', 'exode', -1485, -1385, { u: 'd', s: 'Espion fidèle avec Josué. À 85 ans, il dit : « Je suis encore vigoureux » et demande la montagne d’Hébron (Josué 14:10-14).', refs: ['Nombres 14:24', 'Josué 14:10-14'] });
A('rahab', 'Rahab', 'exode', -1430, -1360, { u: 'bd', m: 1, s: 'Femme de Jéricho qui cache les espions d’Israël.',
  h: ['Elle cache les espions et attache un cordon écarlate à sa fenêtre : « L’Éternel, votre Dieu, est Dieu en haut dans les cieux et en bas sur la terre » (Josué 2:11).',
    'Sauvée avec sa famille (Josué 6:25), elle épouse Salmon et devient la mère de Boaz (Matthieu 1:5). Elle figure parmi les héros de la foi (Hébreux 11:31).'],
  refs: ['Josué 2:11-12', 'Josué 6:25', 'Matthieu 1:5', 'Hébreux 11:31'] });

/* ============ JUGES ============ */
A('othniel', 'Othniel', 'juges', -1374, -1334, { act: 1, s: 'Premier juge, neveu de Caleb. Après sa victoire, le pays est en repos quarante ans (Juges 3:9-11).', refs: ['Juges 3:9-11'] });
A('debora', 'Débora', 'juges', -1240, -1200, { act: 1, m: 1, s: 'Prophétesse et juge en Israël.',
  h: ['Prophétesse, elle juge Israël sous un palmier. Elle appelle Barak à combattre Sisera, le chef de l’armée de Jabin (Juges 4:4-9).',
    'Après la victoire, elle chante le cantique de Juges 5. Le pays est ensuite en repos quarante ans (Juges 5:31). Dates approximatives.'],
  refs: ['Juges 4:4-9', 'Juges 5:31'] });
A('gedeon', 'Gédéon', 'juges', -1180, -1140, { act: 1, m: 1, s: 'Avec 300 hommes, il met en fuite Madian.',
  h: ['Le plus petit de sa famille, il est appelé « vaillant héros » par l’ange de l’Éternel (Juges 6:12). Il demande des signes avec une toison.',
    'Avec 300 hommes, des trompettes et des cruches, il met Madian en fuite (Juges 7:19-22). Il refuse d’être roi : « C’est l’Éternel qui dominera sur vous » (Juges 8:23).'],
  refs: ['Juges 6:12-16', 'Juges 7:19-22', 'Juges 8:23'] });
A('ruth', 'Ruth', 'juges', -1170, -1100, { u: 'bd', m: 1, s: 'La Moabite fidèle, arrière-grand-mère de David.',
  h: ['Moabite et veuve, elle refuse de quitter sa belle-mère Naomi : « Ton peuple sera mon peuple, et ton Dieu sera mon Dieu » (Ruth 1:16).',
    'À Bethléhem, elle glane dans le champ de Boaz, qui la rachète et l’épouse. Leur fils Obed est le grand-père de David (Ruth 4:13-17).',
    'Elle a vécu « du temps des juges » (Ruth 1:1), trois générations avant David, donc vers 1150-1100 av. J.-C. Elle est citée dans la généalogie de Jésus (Matthieu 1:5).'],
  refs: ['Ruth 1:1', 'Ruth 1:16', 'Ruth 4:13-17', 'Matthieu 1:5'], meet: ['boaz'] });
A('boaz', 'Boaz', 'juges', -1180, -1100, { u: 'bd', s: 'Riche cultivateur de Bethléhem, fils de Salmon et de Rahab. Il rachète et épouse Ruth : une image du Rédempteur (Ruth 4:9-13).', refs: ['Ruth 2:1', 'Ruth 4:9-13'] });
A('samson', 'Samson', 'juges', -1090, -1070, { act: 1, m: 1, s: 'Le juge à la force extraordinaire.',
  h: ['Nazaréen dès sa naissance, il a une force extraordinaire tant que ses cheveux ne sont pas coupés (Juges 13:5).',
    'Trahi par Delila, capturé et aveuglé par les Philistins, il prie une dernière fois et fait s’écrouler le temple de Dagon (Juges 16:28-30). Il a jugé Israël vingt ans (Juges 16:31).'],
  refs: ['Juges 13:5', 'Juges 16:28-31'] });
A('eli', 'Éli', 'juges', -1202, -1104, { u: 'bd', age: 98, ar: '1 Samuel 4:15', s: 'Sacrificateur à Silo qui élève le jeune Samuel. Ses fils sont méchants. Il meurt à 98 ans en apprenant la prise de l’arche (1 Samuel 4:15-18).', refs: ['1 Samuel 3:8-10', '1 Samuel 4:15-18'], meet: ['samuel', 'anne'] });
A('anne', 'Anne', 'juges', -1130, -1060, { u: 'bd', s: 'Stérile, elle prie à Silo et promet de donner son fils à l’Éternel. Dieu lui donne Samuel ; elle chante : « Mon cœur se réjouit en l’Éternel » (1 Samuel 2:1).', refs: ['1 Samuel 1:27-28', '1 Samuel 2:1-2'] });
A('samuel', 'Samuel', 'juges', -1105, -1015, { u: 'bd', m: 1, p: 'anne', nm: '« Demandé à Dieu » (sens discuté).',
  s: 'Dernier juge et prophète ; il oint Saül puis David.',
  h: ['Consacré à Dieu dès l’enfance, il entend l’Éternel l’appeler la nuit et répond : « Parle, car ton serviteur écoute » (1 Samuel 3:10).',
    'Juge et prophète, il ramène Israël à Dieu. Quand le peuple demande un roi, il oint Saül (1 Samuel 10:1), puis David, car « l’Éternel regarde au cœur » (1 Samuel 16:7).',
    'Il meurt à Rama, pleuré par tout Israël (1 Samuel 25:1).'],
  refs: ['1 Samuel 3:10', '1 Samuel 10:1', '1 Samuel 16:7', '1 Samuel 16:13', '1 Samuel 25:1'], meet: ['saul', 'david'] });

/* ============ ROYAUME UNI ============ */
A('saul', 'Saül', 'uni', -1080, -1010, { u: 'b', r: [-1050, -1010], rl: '40 ans', rr: 'Actes 13:21', v: 'm', m: 1, nm: '« Demandé ».',
  s: 'Premier roi d’Israël, de la tribu de Benjamin.',
  h: ['De la tribu de Benjamin, grand et beau, il est oint par Samuel comme premier roi d’Israël (1 Samuel 10:1).',
    'Il désobéit en offrant lui-même l’holocauste, puis en épargnant Amalek. Samuel lui dit : « L’obéissance vaut mieux que les sacrifices » (1 Samuel 15:22).',
    'Jaloux de David, il le poursuit pendant des années. Il meurt avec son fils Jonathan sur le mont Guilboa (1 Samuel 31:6). Il a régné 40 ans (Actes 13:21).'],
  refs: ['1 Samuel 10:1', '1 Samuel 15:22', '1 Samuel 31:6', 'Actes 13:21'], meet: ['jonathan', 'david'] });
A('jonathan', 'Jonathan', 'uni', -1075, -1010, { u: 'b', p: 'saul', s: 'Fils de Saül et ami fidèle de David : « l’âme de Jonathan fut attachée à l’âme de David » (1 Samuel 18:1). Il meurt avec son père à Guilboa.', refs: ['1 Samuel 18:1-4', '2 Samuel 1:26'], meet: ['david'] });
A('david', 'David', 'uni', -1040, -970, { r: [-1010, -970], ac: 30, rl: '40 ans', rr: '2 Samuel 5:4', v: 'b', m: 1, age: 70, ar: '2 Samuel 5:4', nm: '« Bien-aimé ».',
  s: 'Le berger devenu roi, « un homme selon le cœur de Dieu ».',
  h: ['Plus jeune fils d’Isaï, berger à Bethléhem, il est oint par Samuel (1 Samuel 16:13). Il bat Goliath « au nom de l’Éternel des armées » (1 Samuel 17:45).',
    'Roi à 30 ans, il règne 40 ans : 7 ans à Hébron, puis 33 à Jérusalem, où il fait monter l’arche (2 Samuel 5:4-5).',
    'Dieu lui promet que son trône sera affermi pour toujours (2 Samuel 7:16) : la promesse du Messie, le « Fils de David ».',
    'Il tombe gravement avec Bath-Schéba, puis se repent (Psaume 51). Il écrit de nombreux psaumes, dont le 22 et le 23. Dieu l’appelle « un homme selon mon cœur » (Actes 13:22).'],
  refs: ['1 Samuel 16:13', '1 Samuel 17:45', '2 Samuel 5:4-5', '2 Samuel 7:16', 'Psaume 23:1', 'Actes 13:22'], meet: ['nathan', 'bathscheba', 'salomon'] });
A('bathscheba', 'Bath-Schéba', 'uni', -1020, -950, { u: 'bd', s: 'Femme d’Urie, prise par David ; après la mort de leur premier enfant, elle met au monde Salomon (2 Samuel 12:24). Elle est citée dans la généalogie de Jésus (Matthieu 1:6).', refs: ['2 Samuel 12:24', 'Matthieu 1:6'] });
A('salomon', 'Salomon', 'uni', -990, -931, { u: 'b', p: 'david', r: [-970, -931], rl: '40 ans', rr: '1 Rois 11:42', v: 'x', m: 1, nm: '« Paisible ».',
  s: 'Le roi sage qui bâtit le temple.',
  h: ['Fils de David et de Bath-Schéba. Il demande à Dieu un cœur intelligent pour gouverner ; Dieu lui donne la sagesse, et aussi richesse et gloire (1 Rois 3:9-13).',
    'Il bâtit le temple de Jérusalem, commencé la 480e année après la sortie d’Égypte (1 Rois 6:1), en 966 av. J.-C. On lui attribue les Proverbes, l’Ecclésiaste et le Cantique des cantiques.',
    'À la fin, ses nombreuses femmes détournent son cœur vers d’autres dieux (1 Rois 11:4). Après lui, le royaume se divise.'],
  refs: ['1 Rois 3:9-13', '1 Rois 6:1', '1 Rois 11:4', '1 Rois 11:42'] });

/* ============ ROIS DE JUDA ============ */
function KJ(id, n, b, d, r, ac, rl, rr, v, s, o) { var x = { r: r, ac: ac, rl: rl, rr: rr, v: v, s: s, refs: [rr] }; for (var k in o) x[k] = o[k]; A(id, n, 'juda', b, d, x); }
KJ('roboam', 'Roboam', -972, -913, [-931, -913], 41, '17 ans', '1 Rois 14:21', 'm', 'Fils de Salomon. Il écoute les jeunes conseillers et alourdit le joug : dix tribus se séparent et le royaume se divise (1 Rois 12:13-16).', { p: 'salomon', refs: ['1 Rois 12:13-16', '1 Rois 14:21'] });
KJ('abijam', 'Abijam', -913, -911, [-913, -911], null, '3 ans', '1 Rois 15:1-3', 'm', 'Il marche dans tous les péchés de son père (1 Rois 15:3).', { act: 1, p: 'roboam' });
KJ('asa', 'Asa', -911, -870, [-911, -870], null, '41 ans', '1 Rois 15:10-11', 'b', 'Il fait ce qui est droit, comme David, et ôte les idoles du pays ; il retire même à sa grand-mère son rang de reine (1 Rois 15:11-13).', { act: 1, p: 'abijam' });
KJ('josaphat', 'Josaphat', -907, -848, [-872, -848], 35, '25 ans', '1 Rois 22:42', 'b', 'Il envoie des lévites enseigner la Loi dans les villes (2 Chroniques 17:7-9), mais s’allie avec Achab.', { p: 'asa', refs: ['1 Rois 22:42-43', '2 Chroniques 17:7-9'] });
KJ('joramj', 'Joram (Juda)', -885, -841, [-853, -841], 32, '8 ans', '2 Rois 8:16-18', 'm', 'Il épouse Athalie, fille d’Achab, et marche dans la voie des rois d’Israël (2 Rois 8:18).', { p: 'josaphat' });
KJ('achaziaj', 'Achazia (Juda)', -863, -841, [-841, -841], 22, '1 an', '2 Rois 8:26-27', 'm', 'Petit-fils d’Achab par sa mère Athalie ; tué par Jéhu après un an (2 Rois 9:27).', { p: 'joramj' });
KJ('athalie', 'Athalie', -880, -835, [-841, -835], null, '6 ans', '2 Rois 11:1-3', 'm', 'Fille d’Achab. À la mort de son fils, elle fait périr la famille royale et règne six ans. Seul le petit Joas est sauvé, caché dans le temple (2 Rois 11:1-3).', { u: 'b' });
KJ('joasj', 'Joas (Juda)', -842, -796, [-835, -796], 7, '40 ans', '2 Rois 12:1-2', 'x', 'Roi à 7 ans, guidé par le sacrificateur Jehojada, il répare le temple. Après la mort de Jehojada, il se détourne et fait lapider Zacharie, son fils (2 Chroniques 24:20-22).', { p: 'achaziaj', refs: ['2 Rois 12:1-2', '2 Chroniques 24:20-22'] });
KJ('amatsia', 'Amatsia', -821, -767, [-796, -767], 25, '29 ans', '2 Rois 14:1-3', 'x', 'Il fait ce qui est droit, « non pas toutefois comme David » (2 Rois 14:3). Vaincu par Joas d’Israël, il meurt assassiné.', { p: 'joasj' });
KJ('ozias', 'Ozias', -808, -740, [-792, -740], 16, '52 ans', '2 Rois 15:1-3', 'b', 'Aussi appelé Azaria. Prospère tant qu’il cherche Dieu ; devenu orgueilleux, il entre dans le temple pour brûler l’encens et est frappé de lèpre (2 Chroniques 26:16-21). L’année de sa mort, Ésaïe voit le Seigneur (Ésaïe 6:1).', { p: 'amatsia', refs: ['2 Rois 15:1-3', '2 Chroniques 26:16-21', 'Ésaïe 6:1'] });
KJ('jotham', 'Jotham', -775, -732, [-750, -735], 25, '16 ans', '2 Rois 15:32-34', 'b', 'Il fait ce qui est droit (2 Rois 15:34). Ésaïe, Osée et Michée prophétisent sous son règne.', { p: 'ozias' });
KJ('achaz', 'Achaz', -755, -715, [-735, -715], 20, '16 ans', '2 Rois 16:2-3', 'm', 'Il fait passer son fils par le feu (2 Rois 16:3). C’est à lui qu’Ésaïe annonce le signe d’Emmanuel (Ésaïe 7:14).', { p: 'jotham', refs: ['2 Rois 16:2-3', 'Ésaïe 7:10-14'] });
KJ('ezechias', 'Ézéchias', -740, -686, [-715, -686], 25, '29 ans', '2 Rois 18:1-5', 'b', 'Un des meilleurs rois de Juda, conseillé par Ésaïe.', { p: 'achaz', m: 1,
  h: ['Roi à 25 ans, il règne 29 ans. « Il mit sa confiance en l’Éternel… et parmi tous les rois de Juda après lui et avant lui il n’y en eut point de semblable » (2 Rois 18:5).',
    'Il purifie le temple et célèbre la Pâque. Quand Sanchérib, roi d’Assyrie, assiège Jérusalem, il prie avec Ésaïe et l’ange de l’Éternel délivre la ville (2 Rois 19:14-35).',
    'Malade à mourir, il prie et Dieu ajoute quinze ans à sa vie (2 Rois 20:1-6).'],
  refs: ['2 Rois 18:1-5', '2 Rois 19:14-19', '2 Rois 19:35', '2 Rois 20:5-6'] });
KJ('manasse', 'Manassé', -709, -642, [-697, -642], 12, '55 ans', '2 Rois 21:1-2', 'm', 'Le règne le plus long et l’un des pires : il rebâtit les idoles et verse beaucoup de sang (2 Rois 21:1-9). Emmené captif à Babylone, il s’humilie et Dieu l’exauce (2 Chroniques 33:11-13). Une tradition juive dit qu’Ésaïe aurait été tué sous son règne.', { p: 'ezechias', refs: ['2 Rois 21:1-2', '2 Chroniques 33:11-13'] });
KJ('amon', 'Amon', -664, -640, [-642, -640], 22, '2 ans', '2 Rois 21:19-23', 'm', 'Il fait ce qui est mal, comme son père, et est assassiné par ses serviteurs (2 Rois 21:23).', { p: 'manasse' });
KJ('josias', 'Josias', -648, -609, [-640, -609], 8, '31 ans', '2 Rois 22:1-2', 'b', 'Le roi réformateur qui retrouve le livre de la Loi.', { p: 'amon', m: 1,
  h: ['Roi à 8 ans. Pendant les travaux du temple, on retrouve le livre de la Loi ; en l’entendant, il déchire ses vêtements et conduit une grande réforme (2 Rois 22:8-13 ; 23).',
    '« Avant Josias, il n’y eut point de roi qui revînt comme lui à l’Éternel de tout son cœur » (2 Rois 23:25). Jérémie et Sophonie prophétisent sous son règne. Il meurt à Meguiddo en combattant le pharaon Néco (2 Rois 23:29).'],
  refs: ['2 Rois 22:1-2', '2 Rois 22:11', '2 Rois 23:25', '2 Rois 23:29'] });
KJ('joachazj', 'Joachaz (Juda)', -632, -605, [-609, -609], 23, '3 mois', '2 Rois 23:31-34', 'm', 'Après trois mois, le pharaon Néco l’emmène en Égypte, où il meurt (2 Rois 23:34).', { u: 'd', p: 'josias' });
KJ('jojakim', 'Jojakim', -634, -598, [-609, -598], 25, '11 ans', '2 Rois 23:36-37', 'm', 'Il brûle le rouleau des prophéties de Jérémie (Jérémie 36:23). En 605, Nebucadnetsar emmène les premiers captifs, dont Daniel (Daniel 1:1-6).', { p: 'josias', refs: ['2 Rois 23:36-37', 'Jérémie 36:23', 'Daniel 1:1-2'] });
KJ('jojakin', 'Jojakin', -616, -560, [-598, -597], 18, '3 mois', '2 Rois 24:8-15', 'm', 'Aussi appelé Jéconia (Jéchonias). Emmené à Babylone en 597 avec Ézéchiel, il est libéré de prison 37 ans plus tard (2 Rois 25:27-30). Il fait partie de la généalogie de Jésus (Matthieu 1:12).', { u: 'd', p: 'jojakim', refs: ['2 Rois 24:8-15', '2 Rois 25:27-30', 'Matthieu 1:12'] });
KJ('sedecias', 'Sédécias', -618, -586, [-597, -586], 21, '11 ans', '2 Rois 24:18-20', 'm', 'Dernier roi de Juda. Il refuse d’écouter Jérémie. Jérusalem tombe en 586 ; ses fils sont égorgés sous ses yeux, puis on lui crève les yeux et on l’emmène à Babylone (2 Rois 25:6-7).', { u: 'd', p: 'josias', refs: ['2 Rois 24:18-20', '2 Rois 25:6-7', 'Jérémie 38:17-20'] });

/* ============ ROIS D'ISRAËL ============ */
function KI(id, n, r, rl, rr, v, s, o) { var x = { act: 1, r: r, rl: rl, rr: rr, v: v, s: s, refs: [rr] }; for (var k in o) x[k] = o[k]; A(id, n, 'israel', r[0], r[1], x); }
KI('jeroboam', 'Jéroboam Ier', [-931, -910], '22 ans', '1 Rois 12:28-30', 'm', 'Premier roi des dix tribus du Nord. Pour que le peuple n’aille plus à Jérusalem, il place deux veaux d’or à Béthel et à Dan : c’est « le péché de Jéroboam », que suivront presque tous les rois du Nord.', { dy: 1 });
KI('nadab', 'Nadab', [-910, -909], '2 ans', '1 Rois 15:25-28', 'm', 'Fils de Jéroboam, tué par Baescha (1 Rois 15:27-28).', { dy: 1 });
KI('baescha', 'Baescha', [-909, -886], '24 ans', '1 Rois 15:33-34', 'm', 'Il extermine la maison de Jéroboam, mais suit ses péchés (1 Rois 15:34).', { dy: 2 });
KI('ela', 'Éla', [-886, -885], '2 ans', '1 Rois 16:8-10', 'm', 'Tué par Zimri pendant qu’il s’enivre (1 Rois 16:9-10).', { dy: 2 });
KI('zimri', 'Zimri', [-885, -885], '7 jours', '1 Rois 16:15-18', 'm', 'Il règne sept jours, puis se donne la mort dans le palais en flammes (1 Rois 16:18).', { dy: 3 });
KI('omri', 'Omri', [-885, -874], '12 ans', '1 Rois 16:23-25', 'm', 'Il fonde Samarie, la nouvelle capitale, et agit plus mal que tous ses prédécesseurs (1 Rois 16:24-25).', { dy: 4 });
KI('achab', 'Achab', [-874, -853], '22 ans', '1 Rois 16:29-33', 'm', 'L’adversaire d’Élie, mari de Jézabel.', { dy: 4, m: 1, p: 'omri',
  h: ['Fils d’Omri, il épouse Jézabel, princesse de Sidon, et sert Baal (1 Rois 16:30-33).',
    'Élie lui annonce la sécheresse, puis défie les prophètes de Baal sur le Carmel (1 Rois 18). Il fait tuer Naboth pour prendre sa vigne (1 Rois 21).',
    'Il meurt au combat à Ramoth en Galaad, touché par une flèche tirée au hasard (1 Rois 22:34-38).'],
  refs: ['1 Rois 16:30-33', '1 Rois 18:17-18', '1 Rois 21:17-19', '1 Rois 22:34-35'], meet: ['elie', 'jezabel'] });
KI('jezabel', 'Jézabel', [-874, -841], 'reine', '1 Rois 19:1-2', 'm', 'Reine, femme d’Achab. Elle fait tuer les prophètes de l’Éternel et menace Élie (1 Rois 19:2). Elle meurt jetée d’une fenêtre sur l’ordre de Jéhu (2 Rois 9:30-37).', { dy: 4, refs: ['1 Rois 19:1-2', '2 Rois 9:30-37'], meet: ['elie'] });
KI('achaziai', 'Achazia (Israël)', [-853, -852], '2 ans', '2 Rois 1:2-4', 'm', 'Fils d’Achab ; malade, il consulte Baal-Zebub, et Élie lui annonce sa mort (2 Rois 1).', { dy: 4, p: 'achab', meet: ['elie'] });
KI('jorami', 'Joram (Israël)', [-852, -841], '12 ans', '2 Rois 3:1-2', 'm', 'Fils d’Achab ; tué par Jéhu (2 Rois 9:24).', { dy: 4, p: 'achab', meet: ['elisee'] });
KI('jehu', 'Jéhu', [-841, -814], '28 ans', '2 Rois 10:28-31', 'x', 'Oint sur l’ordre d’Élisée, il extermine la maison d’Achab et le culte de Baal, mais garde les veaux d’or (2 Rois 9–10). Sa dynastie dure quatre générations, comme Dieu l’avait dit (2 Rois 10:30).', { dy: 5, refs: ['2 Rois 9:1-6', '2 Rois 10:28-31'] });
KI('joachazi', 'Joachaz (Israël)', [-814, -798], '17 ans', '2 Rois 13:1-5', 'm', 'Israël est opprimé par la Syrie ; il implore l’Éternel, qui l’exauce (2 Rois 13:4-5).', { dy: 5, p: 'jehu' });
KI('joasi', 'Joas (Israël)', [-798, -782], '16 ans', '2 Rois 13:10-14', 'm', 'Il pleure au chevet d’Élisée mourant : « Mon père ! mon père ! Char d’Israël et sa cavalerie ! » (2 Rois 13:14).', { dy: 5, p: 'joachazi', meet: ['elisee'] });
KI('jeroboam2', 'Jéroboam II', [-793, -753], '41 ans', '2 Rois 14:23-25', 'm', 'Un long règne prospère. Jonas prophétise sous son règne (2 Rois 14:25) ; Amos et Osée dénoncent l’injustice et l’idolâtrie de son temps.', { dy: 5, p: 'joasi' });
KI('zachariei', 'Zacharie (roi)', [-753, -753], '6 mois', '2 Rois 15:8-12', 'm', 'Dernier roi de la dynastie de Jéhu, tué après six mois (2 Rois 15:10-12).', { dy: 5, p: 'jeroboam2' });
KI('schallum', 'Schallum', [-752, -752], '1 mois', '2 Rois 15:13-14', 'm', 'Un mois de règne, tué par Menahem (2 Rois 15:14).', { dy: 6 });
KI('menahem', 'Menahem', [-752, -742], '10 ans', '2 Rois 15:17-20', 'm', 'Il paie un lourd tribut au roi d’Assyrie (2 Rois 15:19-20).', { dy: 7 });
KI('pekachia', 'Pekachia', [-742, -740], '2 ans', '2 Rois 15:23-25', 'm', 'Fils de Menahem, tué par Pékach, un de ses officiers (2 Rois 15:25).', { dy: 7, p: 'menahem' });
KI('pekach', 'Pékach', [-752, -732], '20 ans', '2 Rois 15:27-29', 'm', 'Allié à la Syrie contre Juda (Ésaïe 7:1). Sous son règne, l’Assyrie déporte une partie d’Israël (2 Rois 15:29). Ses 20 ans comptent probablement à partir de 752, quand il régnait en rival de Menahem en Galaad ; il règne seul de 740 à 732.', { dy: 8, rd: [-740, -732], s2: 1 });
KI('roiosee', 'Osée (roi)', [-732, -722], '9 ans', '2 Rois 17:1-6', 'm', 'Dernier roi d’Israël. Il cesse de payer le tribut à l’Assyrie : Samarie est assiégée trois ans et tombe en 722, et Israël est déporté (2 Rois 17:5-6). Il a régné pendant le ministère du prophète Osée.', { dy: 9 });

/* ============ PROPHÈTES ============ */
A('nathan', 'Nathan', 'proph', -1005, -965, { act: 1, s: 'Prophète à la cour de David : il lui annonce un trône éternel (2 Samuel 7:12-16), puis le confronte après son péché : « Tu es cet homme-là ! » (2 Samuel 12:7).', refs: ['2 Samuel 7:12-16', '2 Samuel 12:7'], meet: ['david', 'bathscheba'] });
A('elie', 'Élie', 'proph', -875, -848, { act: 1, m: 1, route: 'elie', end: 'enlevé', nm: '« Mon Dieu est l’Éternel ».',

A('elisee', 'Élisée', 'proph', -855, -795, { act: 1, m: 1, nm: '« Dieu sauve ».', s: 'Le successeur d’Élie, aux nombreux miracles.',

  refs: ['2 Rois 2:9-15', '2 Rois 5:14', '2 Rois 13:20-21'], meet: ['jehu'] });
A('joel', 'Joël', 'proph', -835, -820, { act: 1, u: 'bd', s: 'Il annonce le jour de l’Éternel et l’effusion de l’Esprit « sur toute chair » (Joël 2:28), une parole que Pierre cite à la Pentecôte (Actes 2:16-17). Sa date est débattue.', refs: ['Joël 2:28', 'Actes 2:16-17'] });
A('jonas', 'Jonas', 'proph', -790, -760, { act: 1, m: 1, route: 'jonas', nm: '« Colombe ».', s: 'Le prophète avalé par un grand poisson, envoyé à Ninive.',

  refs: ['2 Rois 14:25', 'Jonas 1:3', 'Jonas 2:1', 'Jonas 3:10', 'Matthieu 12:40'] });
A('amos', 'Amos', 'proph', -762, -752, { act: 1, s: 'Berger de Tekoa, il prophétise sous Ozias et Jéroboam II, « deux ans avant le tremblement de terre » (Amos 1:1). « Que la droiture soit comme un courant d’eau » (Amos 5:24).', refs: ['Amos 1:1', 'Amos 5:24', 'Amos 7:14-15'] });
A('osee', 'Osée', 'proph', -755, -715, { act: 1, m: 1, nm: '« Salut ».', s: 'Le prophète de l’amour fidèle de Dieu pour un peuple infidèle.',

    'Dieu lui demande d’épouser Gomer, une femme infidèle, puis de la reprendre : une image de l’amour fidèle de Dieu pour son peuple (Osée 3:1).',
    'Le prophète Osée a-t-il croisé le roi Osée ? Le roi Osée, dernier roi d’Israël, a régné de 732 à 722, pendant le ministère du prophète : ils ont donc vécu en même temps, dans le même royaume du Nord. Le livre, pourtant, ne nomme jamais ce roi.'],
  refs: ['Osée 1:1', 'Osée 3:1', 'Osée 11:1', 'Osée 14:2'] });
A('esaie', 'Ésaïe', 'proph', -740, -681, { act: 1, m: 1, nm: '« L’Éternel sauve ».', s: 'Le prophète du Messie : Emmanuel, le Serviteur souffrant.',

    'Le chapitre 43 : « Ne crains rien, car je te rachète, je t’appelle par ton nom : tu es à moi ! » (Ésaïe 43:1). Une tradition juive rapporte qu’il aurait été tué sous Manassé.'],
  refs: ['Ésaïe 1:1', 'Ésaïe 6:1-8', 'Ésaïe 7:14', 'Ésaïe 9:5', 'Ésaïe 43:1', 'Ésaïe 53:5'], meet: ['achaz', 'ezechias'] });
A('michee', 'Michée', 'proph', -735, -700, { act: 1, s: 'Prophète de Moréscheth sous Jotham, Achaz et Ézéchias (Michée 1:1). Il annonce que le Messie naîtra à Bethléhem (Michée 5:1) et résume : « pratiquer la justice, aimer la miséricorde, marcher humblement avec ton Dieu » (Michée 6:8).', refs: ['Michée 1:1', 'Michée 5:1', 'Michée 6:8'] });
A('nahum', 'Nahum', 'proph', -660, -612, { act: 1, s: 'Il annonce la chute de Ninive, qui arrive en 612 av. J.-C. « L’Éternel est bon, il est un refuge au jour de la détresse » (Nahum 1:7).', refs: ['Nahum 1:7'] });
A('sophonie', 'Sophonie', 'proph', -640, -620, { act: 1, s: 'Descendant d’Ézéchias, il prophétise sous Josias (Sophonie 1:1). « L’Éternel ton Dieu est au milieu de toi… il se réjouira à ton sujet avec des cris de joie » (Sophonie 3:17).', refs: ['Sophonie 1:1', 'Sophonie 3:17'] });
A('jeremie', 'Jérémie', 'proph', -645, -580, { u: 'bd', r: [-627, -580], m: 1, nm: '« L’Éternel élève ».', s: 'Le prophète qui pleure, qui annonce la nouvelle alliance.',

  refs: ['Jérémie 1:1-5', 'Jérémie 25:11', 'Jérémie 31:31-33', 'Jérémie 38:6'], meet: ['josias', 'jojakim', 'sedecias'] });
A('habakuk', 'Habakuk', 'proph', -609, -598, { act: 1, s: 'Il demande à Dieu pourquoi le mal triomphe. La réponse : « le juste vivra par sa foi » (Habakuk 2:4), citée par Paul (Romains 1:17).', refs: ['Habakuk 1:2', 'Habakuk 2:4', 'Romains 1:17'] });
A('daniel', 'Daniel', 'proph', -620, -530, { u: 'bd', r: [-605, -536], m: 1, nm: '« Dieu est mon juge ».', s: 'Fidèle à Babylone, de Nebucadnetsar à Cyrus.',

    'Il voit « quelqu’un de semblable à un fils d’homme » recevoir un règne éternel (Daniel 7:13-14) : c’est le titre que Jésus se donne. Il vit toute la durée de l’exil, jusqu’au règne de Cyrus (Daniel 1:21). Il lit même les écrits de son contemporain Jérémie (Daniel 9:2).'],
  refs: ['Daniel 1:8', 'Daniel 2:44', 'Daniel 6:22', 'Daniel 7:13-14', 'Daniel 9:2'], meet: ['nebucadnetsar', 'cyrus'] });
A('ezechiel', 'Ézéchiel', 'proph', -623, -570, { u: 'd', r: [-593, -571], m: 1, nm: '« Dieu fortifie ».', s: 'Le prophète des exilés : un cœur nouveau, des ossements qui revivent.',

    'Il annonce la chute de Jérusalem, puis l’espérance : le bon berger (Ézéchiel 34), un cœur nouveau (Ézéchiel 36:26), la vallée des ossements desséchés qui revivent (Ézéchiel 37).',
    'Il cite Daniel comme un modèle de justice (Ézéchiel 14:14) : les deux hommes sont contemporains et vivent tous deux en exil.'],
  refs: ['Ézéchiel 1:1-3', 'Ézéchiel 14:14', 'Ézéchiel 36:26', 'Ézéchiel 37:4-5'] });
A('abdias', 'Abdias', 'proph', -586, -580, { act: 1, u: 'bd', s: 'Le plus court livre de l’Ancien Testament : il annonce le jugement d’Édom. Sa date est débattue (souvent juste après 586).', refs: ['Abdias 1:15'] });
A('aggee', 'Aggée', 'proph', -520, -519, { act: 1, s: 'En 520, il pousse le peuple revenu d’exil à rebâtir le temple : « Considérez attentivement vos voies ! » (Aggée 1:5).', refs: ['Aggée 1:1', 'Aggée 1:5'], meet: ['zorobabel'] });
A('zachariep', 'Zacharie', 'proph', -520, -480, { act: 1, m: 1, s: 'Prophète du retour d’exil : le roi humble sur un âne, celui qu’ils ont percé.',

A('malachie', 'Malachie', 'proph', -440, -420, { act: 1, nm: '« Mon messager ».', s: 'Dernier livre de l’Ancien Testament. Il annonce le messager qui préparera le chemin (Malachie 3:1), accompli en Jean-Baptiste (Luc 7:27). Dans la Segond 1910, son livre compte 4 chapitres.', refs: ['Malachie 3:1', 'Luc 7:27'] });

/* ============ EXIL ET RETOUR ============ */

A('esther', 'Esther', 'exil', -500, -460, { u: 'bd', m: 1, nm: 'En hébreu Hadassa, « myrte ».', s: 'La reine qui risque sa vie pour sauver son peuple.',

    'Le peuple est sauvé : c’est l’origine de la fête de Pourim (Esther 9:26-28).'],
  refs: ['Esther 2:16-17', 'Esther 4:14-16', 'Esther 9:26-28'], meet: ['assuerus'] });
A('esdras', 'Esdras', 'exil', -458, -430, { act: 1, m: 1, s: 'Le scribe qui enseigne la Loi au peuple revenu.',

  refs: ['Néhémie 1:4', 'Néhémie 2:4-5', 'Néhémie 6:15', 'Néhémie 8:10'], meet: ['artaxerxes'] });

A('cyrus', 'Cyrus', 'nations', -600, -530, { u: 'b', r: [-559, -530], m: 1, s: 'Roi de Perse, nommé par Ésaïe plus d’un siècle à l’avance.',

A('darius', 'Darius Ier', 'nations', -522, -486, { act: 1, r: [-522, -486], s: 'Roi de Perse sous qui le temple est achevé, en 516 (Esdras 6:15).', refs: ['Esdras 6:15'] });
A('assuerus', 'Assuérus (Xerxès)', 'nations', -486, -465, { act: 1, r: [-486, -465], s: 'Roi de Perse, mari de la reine Esther (Esther 1:1-2).', refs: ['Esther 1:1-2'] });
A('artaxerxes', 'Artaxerxès Ier', 'nations', -465, -424, { act: 1, r: [-465, -424], s: 'Roi de Perse qui envoie Esdras (458), puis Néhémie (445), à Jérusalem (Esdras 7:11-13 ; Néhémie 2:1-8).', refs: ['Esdras 7:11-13', 'Néhémie 2:1-8'] });
A('auguste', 'César Auguste', 'nations', -63, 14, { r: [-27, 14], s: 'Premier empereur romain. Son recensement amène Joseph et Marie à Bethléhem (Luc 2:1-7).', refs: ['Luc 2:1-7'] });
A('herode', 'Hérode le Grand', 'nations', -73, -4, { r: [-37, -4], s: 'Roi de Judée sous l’autorité de Rome ; il agrandit le temple. Il fait tuer les enfants de Bethléhem (Matthieu 2:16) et meurt peu après.', refs: ['Matthieu 2:1-3', 'Matthieu 2:16'] });
A('tibere', 'Tibère', 'nations', 14, 37, { act: 1, r: [14, 37], s: 'Empereur romain pendant le ministère de Jean-Baptiste et de Jésus (Luc 3:1).', refs: ['Luc 3:1-2'] });
A('pilate', 'Ponce Pilate', 'nations', 26, 36, { act: 1, s: 'Gouverneur romain de Judée. Il reconnaît : « Je ne trouve aucun crime en lui » (Jean 18:38), mais livre Jésus pour qu’il soit crucifié.', refs: ['Jean 18:37-38', 'Jean 19:16'], meet: ['jesus'] });
A('neron', 'Néron', 'nations', 37, 68, { r: [54, 68], s: 'Empereur à qui Paul en appelle (Actes 25:11). Il persécute les chrétiens à Rome, où Pierre et Paul meurent selon la tradition.', refs: ['Actes 25:11'] });

/* ============ JÉSUS ET L'ÉGLISE ============ */

    'Il baptise Jésus et le désigne : « Voici l’Agneau de Dieu, qui ôte le péché du monde » (Jean 1:29).',
    'Emprisonné, il est décapité sur l’ordre d’Hérode Antipas (Marc 6:27). Jésus dit : « parmi ceux qui sont nés de femmes, il n’en a point paru de plus grand que Jean-Baptiste » (Matthieu 11:11).'],
  refs: ['Luc 1:36', 'Matthieu 3:3', 'Jean 1:29', 'Matthieu 11:11'], meet: ['jesus'] });
A('josephnt', 'Joseph (époux de Marie)', 'nt', -30, 20, { u: 'bd', s: 'Charpentier, descendant de David, homme juste (Matthieu 1:19-20). Il protège Marie et l’enfant, fuit en Égypte, puis s’installe à Nazareth. Il n’est plus mentionné après les 12 ans de Jésus (Luc 2:41-51).', refs: ['Matthieu 1:19-21', 'Matthieu 2:13-14'], meet: ['marie', 'jesus'] });

    'Elle chante le Magnificat (Luc 1:46-55) et suit Jésus jusqu’à la croix, où il la confie à Jean (Jean 19:26-27). Elle prie avec les disciples avant la Pentecôte (Actes 1:14). Ses dates sont inconnues.'],
  refs: ['Luc 1:30-38', 'Luc 1:46-48', 'Jean 19:26-27', 'Actes 1:14'], meet: ['jesus', 'jean'] });
A('jesus', 'Jésus', 'nt', -5, 30, { m: 1, alive: 1, routes: ['jesus'], nm: '« L’Éternel sauve » ; Christ veut dire « oint », comme Messie.',

C.sources = [
  ['Les âges avant Abraham', 'Calculés directement à partir des âges donnés par Genèse 5 et 11 (Segond 1910). Des commentaires bibliques extérieurs font les mêmes calculs : Sem vivant pendant les 150 dernières années… et des lectures où Sem survit à Abraham. La différence vient d’un seul choix : l’âge de Térach à la naissance d’Abraham (70 ou 130 ans). Ici : 130 ans, d’après Actes 7:4.', [['BibleTools (Forerunner)', 'https://www.bibletools.org/index.cfm/fuseaction/Topical.show/RTD/CGG/ID/9980/Arphaxad.htm'], ['Vannoy, cours sur Genèse 1–11', 'https://biblicalelearning.org/vannoy_history_lecture04_age_gen1_11-2']]],
  ['Les rois de Juda et d’Israël', 'Dates d’Edwin Thiele (The Mysterious Numbers of the Hebrew Kings), co-régences comprises. Comparées au tableau de Wikipédia : mêmes dates, à un an près ; Wikipédia donne le règne seul (par exemple Ozias 767–740, ici 792–740 avec la co-régence).', [['Wikipédia : Kings of Israel and Judah', 'https://en.wikipedia.org/wiki/Kings_of_Israel_and_Judah'], ['Wikipédia : The Mysterious Numbers of the Hebrew Kings', 'https://en.wikipedia.org/wiki/The_Mysterious_Numbers_of_the_Hebrew_Kings']]],
  ['Les prophètes', 'Seule la période d’activité est connue, à partir des rois nommés au début de chaque livre (Osée 1:1, Ésaïe 1:1, Michée 1:1…). Les tableaux consultés varient de quelques années à quelques décennies : les dates choisies ici restent dans leurs fourchettes.', [['Dates des douze petits prophètes', 'https://www.bombaxo.com/?p=2132'], ['Prophets: approximate dates', 'https://mbfallon.com/prophets_dates.html']]],
  ['Jean-Baptiste et Jésus', 'La plupart des estimations placent la mort de Jean-Baptiste vers 28-29 ap. J.-C., avant la crucifixion (vers 30 ou 33). Les Évangiles le confirment : Jésus apprend sa mort pendant son ministère (Matthieu 14:10-13).', [['Religion Wiki : John the Baptist', 'https://religion.fandom.com/wiki/John_the_Baptist']]],
  ['L’Exode, les juges, les patriarches', 'Exode en 1446 av. J.-C. (1 Rois 6:1 : 480 ans avant le temple, commencé en 966) et 430 ans en Égypte (Exode 12:40). C’est la chronologie évangélique conservatrice ; d’autres historiens proposent des dates plus tardives.', []]
];

CHRONO.verses={"Genèse 5:5":[[5,"Tous les jours qu’Adam vécut furent de neuf cent trente ans; puis il mourut."]],"Genèse 2:7":[[7,"L’Éternel Dieu forma l’homme de la poussière de la terre, il souffla dans ses narines un souffle de vie et l’homme devint un être vivant."]],"Romains 5:12":[[12,"C’est pourquoi, comme par un seul homme le péché est entré dans le monde, et par le péché la mort, et qu’ainsi la mort s’est étendue sur tous les hommes, parce que tous ont péché,…"]],"Genèse 3:15":[[15,"Je mettrai inimitié entre toi et la femme, entre ta postérité et sa postérité: celle-ci t’écrasera la tête, et tu lui blesseras le talon."]],"Genèse 5:3-5":[[3,"Adam, âgé de cent trente ans, engendra un fils à sa ressemblance, selon son image, et il lui donna le nom de Seth."],[4,"Les jours d’Adam, après la naissance de Seth, furent de huit cents ans; et il engendra des fils et des filles."],[5,"Tous les jours qu’Adam vécut furent de neuf cent trente ans; puis il mourut."]],"1 Corinthiens 15:45":[[45,"C’est pourquoi il est écrit: Le premier homme, Adam, devint une âme vivante. Le dernier Adam est devenu un esprit vivifiant."]],"Genèse 3:20":[[20,"Adam donna à sa femme le nom d’Ève: car elle a été la mère de tous les vivants."]],"Genèse 2:22-23":[[22,"L’Éternel Dieu forma une femme de la côte qu’il avait prise de l’homme, et il l’amena vers l’homme."],[23,"Et l’homme dit: Voici cette fois celle qui est os de mes os et chair de ma chair! On l’appellera femme, parce qu’elle a été prise de l’homme."]],"Genèse 4:25":[[25,"Adam connut encore sa femme; elle enfanta un fils, et l’appela du nom de Seth, car, dit-elle, Dieu m’a donné un autre fils à la place d’Abel, que Caïn a tué."]],"Genèse 5:8":[[8,"Tous les jours de Seth furent de neuf cent douze ans; puis il mourut."]],"Genèse 4:26":[[26,"Seth eut aussi un fils, et il l’appela du nom d’Énosch. C’est alors que l’on commença à invoquer le nom de l’Éternel."]],"Genèse 4:25-26":[[25,"Adam connut encore sa femme; elle enfanta un fils, et Tous les jours d’Hénoc furent de trois cent soixante-cinq ans."]],"Genèse 5:22-24":[[22,"Hénoc, après la naissance de Metuschélah, marcha avec Dieu trois cents ans; et il engendra des fils et des filles."],[23,"Tous les jours d’Hénoc furent de trois cent soixante-cinq ans."],[24,"Hénoc marcha avec Dieu; puis il ne fut plus, parce que Dieu le prit."]],"Hébreux 11:5":[[5,"C’est par la foi qu’Énoch fut enlevé pour qu’il ne vît point la mort, et qu’il ne parut plus parce que Dieu l’avait enlevé; car, avant son enlèvement, il avait reçu le témoignage qu’il était agréable à Dieu."]],"Jude 1:14-15":[[14,"C’est aussi pour eux qu’Énoch, le septième depuis Adam, a prophétisé en ces termes: Voici, le Seigneur est venu avec ses saintes myriades,"],[15,"pour exercer un jugement contre tous, et pour faire rendre compte à tous les impies parmi eux de tous les actes d’impiété qu’ils ont commis et de toutes les paroles injurieuses qu’ont proférées contre lui des pécheurs impies."]],"Genèse 5:21-24":[[21,"Hénoc, âgé de soixante-cinq ans, engendra Metuschélah."],[22,"Hénoc, après la naissance de Metuschélah, marcha avec Dieu trois cents ans; et il engendra des fils et des filles."],[23,"Tous les jours d’Hénoc furent de trois cent soixante-cinq ans."],[24,"Hénoc marcha avec Dieu; puis il ne fut plus, parce que Dieu le prit."]],"Genèse 5:27":[[27,"Tous les jours de Metuschélah furent de neuf cent soixante-neuf ans; puis il mourut."]],"Genèse 5:25-27":[[25,"Metuschélah, âgé de cent quatre-vingt-sept ans, engendra Lémec."],[26,"Metuschélah vécut, après la naissance de Lémec, sept cent quatre-vingt-deux ans; et il engendra des fils et des filles."],[27,"Tous les jours de Metuschélah furent de neuf cent soixante-neuf ans; puis il mourut."]],"Genèse 7:6":[[6,"Noé avait six cents ans, lorsque le déluge d’eaux fut sur la terre."]],"Genèse 5:31":[[31,"Tous les jours de Lémec furent de sept cent soixante-dix sept ans; puis il mourut."]],"Genèse 5:29":[[29,"Il lui donna le nom de Noé, en disant: Celui-ci nous consolera de nos fatigues et du travail pénible de nos mains, provenant de cette terre que l’Éternel a maudite."]],"Genèse 5:28-31":[[28,"Lémec, âgé de cent quatre-vingt-deux ans, engendra un fils."],[29,"Il lui donna le nom de Noé, en disant: Celui-ci nous consolera de nos fatigues et du travail pénible de nos mains, provenant de cette terre que l’Éternel a maudite."],[30,"Lémec vécut, après la naissance de Noé, cinq cent quatre-vingt-quinze ans; et il engendra des fils et des filles."],[31,"Tous les jours de Lémec furent de sept cent soixante-dix sept ans; puis il mourut."]],"Genèse 9:29":[[29,"Tous les jours de Noé furent de neuf cent cinquante ans; puis il mourut."]],"Genèse 6:8":[[8,"Mais Noé trouva grâce aux yeux de l’Éternel."]],"Genèse 9:12-13":[[12,"Et Dieu dit: C’est ici le signe de l’alliance que j’établis entre moi et vous, et tous les êtres vivants qui sont avec vous, pour les générations à toujours:"],[13,"j’ai placé mon arc dans la nue, et il servira de signe d’alliance entre moi et la terre."]],"Genèse 9:19":[[19,"Ce sont là les trois fils de Noé, et c’est leur postérité qui peupla toute la terre."]],"Matthieu 24:37-39":[[37,"Ce qui arriva du temps de Noé arrivera de même à l’avènement du Fils de l’homme."],[38,"Car, dans les jours qui précédèrent le déluge, les hommes mangeaient et buvaient, se mariaient et mariaient leurs enfants, jusqu’au jour où Noé entra dans l’arche;"],[39,"et ils ne se doutèrent de rien, jusqu’à ce que le déluge vînt et les emportât tous: il en sera de même à l’avènement du Fils de l’homme."]],"Genèse 6:8-9":[[8,"Mais Noé trouva grâce aux yeux de l’Éternel."],[9,"Voici la postérité de Noé. Noé était un homme juste et intègre dans son temps; Noé marchait avec Dieu."]],"Genèse 9:28-29":[[28,"Noé vécut, après le déluge, trois cent cinquante ans."],[29,"Tous les jours de Noé furent de neuf cent cinquante ans; puis il mourut."]],"Hébreux 11:7":[[7,"C’est par la foi que Noé, divinement averti des choses qu’on ne voyait pas encore, et saisi d’une crainte respectueuse, construisit une arche pour sauver sa famille; c’est par elle qu’il condamna le monde, et devint héritier de la justice qui s’obtient par la foi."]],"Genèse 10:21":[[21,"Il naquit aussi des fils à Sem, père de tous les fils d’Héber, et frère de Japhet l’aîné."]],"Genèse 9:27":[[27,"Que Dieu étende les possessions de Japhet, qu’il habite dans les tentes de Sem, et que Canaan soit leur esclave!"]],"Genèse 10:2-5":[[2,"Les fils de Japhet furent: Gomer, Magog, Madaï, Javan, Tubal, Méschec et Tiras."],[3,"Les fils de Gomer: Aschkenaz, Riphat et Togarma."],[4,"Les fils de Javan: Élischa, Tarsis, Kittim et Dodanim."],[5,"C’est par eux qu’ont été peuplées les îles des nations selon leurs terres, selon la langue de chacun, selon leurs familles, selon leurs nations."]],"Genèse 11:10-11":[[10,"Voici la postérité de Sem. Sem, âgé de cent ans, engendra Arpacschad, deux ans après le déluge."],[11,"Sem vécut, après la naissance d’Arpacschad, cinq cents ans; et il engendra des fils et des filles."]],"Genèse 9:26":[[26,"Il dit encore: Béni soit l’Éternel, Dieu de Sem, et que Canaan soit leur esclave!"]],"Luc 3:36":[[36,"fils de Kaïnam, fils d’Arphaxad, fils de Sem, fils de Noé, fils de Lamech,"]],"Genèse 9:24":[[24,"Lorsque Noé se réveilla de son vin, il apprit ce que lui avait fait son fils cadet."]],"Genèse 10:6":[[6,"Les fils de Cham furent: Cusch, Mitsraïm, Puth et Canaan."]],"Genèse 9:22-25":[[22,"Cham, père de Canaan, vit la nudité de son père, et il le rapporta dehors à ses deux frères."],[23,"Alors Sem et Japhet prirent le manteau, le mirent sur leurs épaules, marchèrent à reculons, et couvrirent la nudité de leur père; comme leur visage était détourné, ils ne virent point la nudité de leur père."],[24,"Lorsque Noé se réveilla de son vin, il apprit ce que lui avait fait son fils cadet."],[25,"Et il dit: Maudit soit Canaan! Qu’il soit l’esclave des esclaves de ses frères!"]],"Genèse 11:12-13":[[12,"Arpacschad, âgé de trente-cinq ans, engendra Schélach."],[13,"Arpacschad vécut, après la naissance de Schélach, quatre cent trois ans; et il engendra des fils et des filles."]],"Genèse 11:10":[[10,"Voici la postérité de Sem. Sem, âgé de cent ans, engendra Arpacschad, deux ans après le déluge."]],"Genèse 11:10-13":[[10,"Voici la postérité de Sem. Sem, âgé de cent ans, engendra Arpacschad, deux ans après le déluge."],[11,"Sem vécut, après la naissance d’Arpacschad, cinq cents ans; et il engendra des fils et des filles."],[12,"Arpacschad, âgé de trente-cinq ans, engendra Schélach."],[13,"Arpacschad vécut, après la naissance de Schélach, quatre cent trois ans; et il engendra des fils et des filles."]],"Genèse 11:14-15":[[14,"Schélach, âgé de trente ans, engendra Héber."],[15,"Schélach vécut, après la naissance d’Héber, quatre cent trois ans; et il engendra des fils et des filles."]],"Genèse 11:16-17":[[16,"Héber, âgé de trente-quatre ans, engendra Péleg."],[17,"Héber vécut, après la naissance de Péleg, quatre cent trente ans; et il engendra des fils et des filles."]],"Genèse 11:18-19":[[18,"Péleg, âgé de trente ans, engendra Rehu."],[19,"Péleg vécut, après la naissance de Rehu, deux cent neuf ans; et il engendra des fils et des filles."]],"Genèse 10:25":[[25,"Il naquit à Héber deux fils: le nom de l’un était Péleg, parce que de son temps la terre fut partagée, et le nom de son frère était Jokthan."]],"Genèse 11:20-21":[[20,"Rehu, âgé de trente-deux ans, engendra Serug."],[21,"Rehu vécut, après la naissance de Serug, deux cent sept ans; et il engendra des fils et des filles."]],"Genèse 11:22-23":[[22,"Serug, âgé de trente ans, engendra Nachor."],[23,"Serug vécut, après la naissance de Nachor, deux cents ans; et il engendra des fils et des filles."]],"Genèse 11:24-25":[[24,"Nachor, âgé de vingt-neuf ans, engendra Térach."],[25,"Nachor vécut, après la naissance de Térach, cent dix-neuf ans; et il engendra des fils et des filles."]],"Genèse 11:32":[[32,"Les jours de Térach furent de deux cent cinq ans; et Térach mourut à Charan."]],"Genèse 11:31-32":[[31,"Térach prit Abram, son fils, et Lot, fils d’Haran, fils de son fils, et Saraï, sa belle-fille, femme d’Abram, son fils. Ils sortirent ensemble d’Ur en Chaldée, pour aller au pays de Canaan. Ils vinrent jusqu’à Charan, et ils y habitèrent."],[32,"Les jours de Térach furent de deux cent cinq ans; et Térach mourut à Charan."]],"Josué 24:2":[[2,"Josué dit à tout le peuple: Ainsi parle l’Éternel, le Dieu d’Israël: Vos pères, Térach, père d’Abraham et père de Nachor, habitaient anciennement de l’autre côté du fleuve, et ils servaient d’autres dieux."]],"Actes 7:4":[[4,"Il sortit alors du pays des Chaldéens, et s’établit à Charran. De là, après la mort de son père, Dieu le fit passer dans ce pays que vous habitez maintenant;"]],"Genèse 25:7":[[7,"Voici les jours des années de la vie d’Abraham: il vécut cent soixante quinze ans."]],"Genèse 17:5":[[5,"On ne t’appellera plus Abram; mais ton nom sera Abraham, car je te rends père d’une multitude de nations."]],"Genèse 12:1-4":[[1,"L’Éternel dit à Abram: Vat’en de ton pays, de ta patrie, et de la maison de ton père, dans le pays que je te montrerai."],[2,"Je ferai de toi une grande nation, et je te bénirai; je rendrai ton nom grand, et tu seras une source de bénédiction."],[3,"Je bénirai ceux qui te béniront, et je maudirai ceux qui te maudiront; et toutes les familles de la terre seront bénies en toi."],[4,"Abram partit, comme l’Éternel le lui avait dit, et Lot partit avec lui. Abram était âgé de soixante-quinze ans, lorsqu’il sortit de Charan."]],"Hébreux 11:8":[[8,"C’est par la foi qu’Abraham, lors de sa vocation, obéit et partit pour un lieu qu’il devait recevoir en héritage, et qu’il partit sans savoir où il allait."]],"Genèse 15:6":[[6,"Abram eut confiance en l’Éternel, qui le lui imputa à justice."]],"Romains 4:3":[[3,"Car que dit l’Écriture? Abraham crut à Dieu, et cela lui fut imputé à justice."]],"Genèse 21:5":[[5,"Abraham était âgé de cent ans, à la naissance d’Isaac, son fils."]],"Genèse 22:13-14":[[13,"Abraham leva les yeux, et vit derrière lui un bélier retenu dans un buisson par les cornes; et Abraham alla prendre le bélier, et l’offrit en holocauste à la place de son fils."],[14,"Abraham donna à ce lieu le nom de Jehova-Jiré. C’est pourquoi l’on dit aujourd’hui: A la montagne de l’Éternel il sera pourvu."]],"Jacques 2:23":[[23,"Ainsi s’accomplit ce que dit l’Écriture: Abraham crut à Dieu, et cela lui fut imputé à justice; et il fut appelé ami de Dieu."]],"Genèse 25:7-9":[[7,"Voici les jours des années de la vie d’Abraham: il vécut cent soixante quinze ans."],[8,"Abraham expira et mourut, après une heureuse vieillesse, âgé et rassasié de jours, et il fut recueilli auprès de son peuple."],[9,"Isaac et Ismaël, ses fils, l’enterrèrent dans la caverne de Macpéla, dans le champ d’Éphron, fils de Tsochar, le Héthien, vis-à-vis de Mamré."]],"Jean 8:58":[[58,"Jésus leur dit: En vérité, en vérité, je vous le dis, avant qu’Abraham fût, je suis."]],"Genèse 23:1":[[1,"La vie de Sara fut de cent vingt-sept ans: telles sont les années de la vie de Sara."]],"Genèse 18:14":[[14,"Y a-t-il rien qui soit étonnant de la part de l’Éternel? Au temps fixé je reviendrai vers toi, à cette même époque; et Sara aura un fils."]],"Genèse 23:1-2":[[1,"La vie de Sara fut de cent vingt-sept ans: telles sont les années de la vie de Sara."],[2,"Sara mourut à Kirjath-Arba, qui est Hébron, dans le pays de Canaan; et Abraham vint pour mener deuil sur Sara et pour la pleurer."]],"Hébreux 11:11":[[11,"C’est par la foi que Sara elle-même, malgré son âge avancé, fut rendue capable d’avoir une postérité, parce qu’elle crut à la fidélité de celui qui avait fait la promesse."]],"Genèse 21:1-3":[[1,"L’Éternel se souvint de ce qu’il avait dit à Sara, et l’Éternel accomplit pour Sara ce qu’il avait promis."],[2,"Sara devint enceinte, et elle enfanta un fils à Abraham dans sa vieillesse, au temps fixé dont Dieu lui avait parlé."],[3,"Abraham donna le nom d’Isaac au fils qui lui était né, que Sara lui avait enfanté."]],"Genèse 19:15-26":[[15,"Dès l’aube du jour, les anges insistèrent auprès de Lot, en disant: Lève-toi, prends ta femme et tes deux filles qui se trouvent ici, de peur que tu ne périsses dans la ruine de la ville."],[16,"Et comme il tardait, les hommes le saisirent par la main, lui, sa femme et ses deux filles, car l’Éternel voulait l’épargner; ils l’emmenèrent, et le laissèrent hors de la ville."],[17,"Après les avoir fait sortir, l’un d’eux dit: Sauve-toi, pour ta vie; ne regarde pas derrière toi, et ne t’arrête pas dans toute la plaine; sauve-toi vers la montagne, de peur que tu ne périsses."],[18,"Lot leur dit: Oh! Non, Seigneur!"],[19,"Voici, j’ai trouvé grâce à tes yeux, et tu as montré la grandeur de ta miséricorde à mon égard, en me conservant la vie; mais je ne puis me sauver à la montagne, avant que le désastre m’atteigne, et je périrai."],[20,"Voici, cette ville est assez proche pour que je m’y réfugie, et elle est petite. Oh! Que je puisse m’y sauver,… n’est-elle pas petite?… et que mon âme vive!"],[21,"Et il lui dit: Voici, je t’accorde encore cette grâce, et je ne détruirai pas la ville dont tu parles."],[22,"Hâte-toi de t’y réfugier, car je ne puis rien faire jusqu’à ce que tu y sois arrivé. C’est pour cela que l’on a donné à cette ville le nom de Tsoar."],[23,"Le soleil se levait sur la terre, lorsque Lot entra dans Tsoar."],[24,"Alors l’Éternel fit pleuvoir du ciel sur Sodome et sur Gomorrhe du soufre et du feu, de par l’Éternel."],[25,"Il détruisit ces villes, toute la plaine et tous les habitants des villes, et les plantes de la terre."],[26,"La femme de Lot regarda en arrière, et elle devint une statue de sel."]],"2 Pierre 2:7":[[7,"et s’il a délivré le juste Lot, profondément attristé de la conduite de ces hommes sans frein dans leur dissolution"]],"Genèse 13:10-12":[[10,"Lot leva les yeux, et vit toute la plaine du Jourdain, qui était entièrement arrosée. Avant que l’Éternel eût détruit Sodome et Gomorrhe, c’était, jusqu’à Tsoar, comme un jardin de l’Éternel, comme le pays d’Égypte."],[11,"Lot choisit pour lui toute la plaine du Jourdain, et il s’avança vers l’orient. C’est ainsi qu’ils se séparèrent l’un de l’autre."],[12,"Abram habita dans le pays de Canaan; et Lot habita dans les villes de la plaine, et dressa ses tentes jusqu’à Sodome."]],"Genèse 14:18-20":[[18,"Melchisédek, roi de Salem, fit apporter du pain et du vin: il était sacrificateur du Dieu Très-Haut."],[19,"Il bénit Abram, et dit: Béni soit Abram par le Dieu Très-Haut, maître du ciel et de la terre!"],[20,"Béni soit le Dieu Très-Haut, qui a livré tes ennemis entre tes mains! Et Abram lui donna la dîme de tout."]],"Psaume 110:4":[[4,"L’Éternel l’a juré, et il ne s’en repentira point: Tu es sacrificateur pour toujours, A la manière de Melchisédek."]],"Hébreux 7:1-3":[[1,"En effet, ce Melchisédek, roi de Salem, sacrificateur du Dieu Très-Haut, qui alla au-devant d’Abraham lorsqu’il revenait de la défaite des rois, qui le bénit,"],[2,"et à qui Abraham donna la dîme de tout, qui est d’abord roi de justice, d’après la signification de son nom, ensuite roi de Salem, c’est-à-dire roi de paix,"],[3,"qui est sans père, sans mère, sans généalogie, qui n’a ni commencement de jours ni fin de vie, mais qui est rendu semblable au Fils de Dieu, ce Melchisédek demeure sacrificateur à perpétuité."]],"Genèse 25:17":[[17,"Et voici les années de la vie d’Ismaël: cent trente-sept ans. Il expira et mourut, et il fut recueilli auprès de son peuple."]],"Genèse 16:16":[[16,"Abram était âgé de quatre-vingt-six ans lorsqu’Agar enfanta Ismaël à Abram."]],"Genèse 21:17-18":[[17,"Dieu entendit la voix de l’enfant; et l’ange de Dieu appela du ciel Agar, et lui dit: Qu’as-tu, Agar? Ne crains point, car Dieu a entendu la voix de l’enfant dans le lieu où il est."],[18,"Lève-toi, prends l’enfant, saisis-le de ta main; car je ferai de lui une grande nation."]],"Genèse 16:11":[[11,"L’ange de l’Éternel lui dit: Voici, tu es enceinte, et tu enfanteras un fils, à qui tu donneras le nom d’Ismaël; car l’Éternel t’a entendue dans ton affliction."]],"Genèse 35:28":[[28,"Les jours d’Isaac furent de cent quatre-vingts ans."]],"Genèse 25:20":[[20,"Abraham engendra Isaac. Isaac était âgé de quarante ans, quand il prit pour femme Rebecca, fille de Bethuel, l’Araméen, de Paddan-Aram, et sœur de Laban, l’Araméen."]],"Genèse 25:26":[[26,"Ensuite sortit son frère, dont la main tenait le talon d’Ésaü; et on lui donna le nom de Jacob. Isaac était âgé de soixante ans, lorsqu’ils naquirent."]],"Genèse 35:28-29":[[28,"Les jours d’Isaac furent de cent quatre-vingts ans."],[29,"Il expira et mourut, et il fut recueilli auprès de son peuple, âgé et rassasié de jours, et Ésaü et Jacob, ses fils, l’enterrèrent."]],"Genèse 22:7-8":[[7,"Alors Isaac, parlant à Abraham, son père, dit: Mon père! Et il répondit: Me voici, mon fils! Isaac reprit: Voici le feu et le bois; mais où est l’agneau pour l’holocauste?"],[8,"Abraham répondit: Mon fils, Dieu se pourvoira lui-même de l’agneau pour l’holocauste. Et ils marchèrent tous deux ensemble."]],"Genèse 24:15-20":[[15,"Il n’avait pas encore fini de parler que sortit, sa cruche sur l’épaule, Rebecca, née de Bethuel, fils de Milca, femme de Nachor, frère d’Abraham."],[16,"C’était une jeune fille très belle de figure; elle était vierge, et aucun homme ne l’avait connue. Elle descendit à la source, remplit sa cruche, et remonta."],[17,"Le serviteur courut au-devant d’elle, et dit: Laisse-moi boire, je te prie, un peu d’eau de ta cruche."],[18,"Elle répondit: Bois, mon seigneur. Et elle s’empressa d’abaisser sa cruche sur sa main, et de lui donner à boire."],[19,"Quand elle eut achevé de lui donner à boire, elle dit: Je puiserai aussi pour tes chameaux, jusqu’à ce qu’ils aient assez bu."],[20,"Et elle s’empressa de vider sa cruche dans l’abreuvoir, et courut encore au puits pour puiser; et elle puisa pour tous les chameaux."]],"Genèse 25:21-23":[[21,"Isaac implora l’Éternel pour sa femme, car elle était stérile, et l’Éternel l’exauça: Rebecca, sa femme, devint enceinte."],[22,"Les enfants se heurtaient dans son sein; et elle dit: S’il en est ainsi, pourquoi suis-je enceinte? Elle alla consulter l’Éternel."],[23,"Et l’Éternel lui dit: Deux nations sont dans ton ventre, et deux peuples se sépareront au sortir de tes entrailles; un de ces peuples sera plus fort que l’autre, et le plus grand sera assujetti au plus petit."]],"Job 1:21":[[21,"et dit: Je suis sorti nu du sein de ma mère, et nu je retournerai dans le sein de la terre. L’Éternel a donné, et l’Éternel a ôté; que le nom de l’Éternel soit béni!"]],"Job 19:25":[[25,"Mais je sais que mon rédempteur est vivant, Et qu’il se lèvera le dernier sur la terre."]],"Job 42:16":[[16,"Job vécut après cela cent quarante ans, et il vit ses fils et les fils de ses fils jusqu’à la quatrième génération."]],"Job 42:10-17":[[10,"L’Éternel rétablit Job dans son premier état, quand Job eut prié pour ses amis; et l’Éternel lui accorda le double de tout ce qu’il avait possédé."],[11,"Les frères, les sœurs, et les anciens amis de Job vinrent tous le visiter, et ils mangèrent avec lui dans sa maison. Ils le plaignirent et le consolèrent de tous les malheurs que l’Éternel avait fait venir sur lui, et chacun lui donna un kesita et un anneau d’or."],[12,"Pendant ses dernières années, Job reçut de l’Éternel plus de bénédictions qu’il n’en avait reçu dans les premières. Il posséda quatorze mille brebis, six mille chameaux, mille paires de bœufs, et mille ânesses."],[13,"Il eut sept fils et trois filles:"],[14,"il donna à la première le nom de Jemima, à la seconde celui de Ketsia, et à la troisième celui de Kéren-Happuc."],[15,"Il n’y avait pas dans tout le pays d’aussi belles femmes que les filles de Job. Leur père leur accorda une part d’héritage parmi leurs frères."],[16,"Job vécut après cela cent quarante ans, et il vit ses fils et les fils de ses fils jusqu’à la quatrième génération."],[17,"Et Job mourut âgé et rassasié de jours."]],"Genèse 47:28":[[28,"Jacob vécut dix-sept ans dans le pays d’Égypte; et les jours des années de la vie de Jacob furent de cent quarante-sept ans."]],"Genèse 32:28":[[28,"Il dit encore: Ton nom ne sera plus Jacob, mais tu seras appelé Israël; car tu as lutté avec Dieu et avec des hommes, et tu as été vainqueur."]],"Genèse 25:29-34":[[29,"Comme Jacob faisait cuire un potage, Ésaü revint des champs, accablé de fatigue."],[30,"Et Ésaü dit à Jacob: Laisse-moi, je te prie, manger de ce roux, de ce roux-là, car je suis fatigué. C’est pour cela qu’on a donné à Ésaü le nom d’Édom."],[31,"Jacob dit: Vends-moi aujourd’hui ton droit d’aînesse."],[32,"Ésaü répondit: Voici, je m’en vais mourir; à quoi me sert ce droit d’aînesse?"],[33,"Et Jacob dit: Jure-le moi d’abord. Il le lui jura, et il vendit son droit d’aînesse à Jacob."],[34,"Alors Jacob donna à Ésaü du pain et du potage de lentilles. Il mangea et but, puis se leva et s’en alla. C’est ainsi qu’Ésaü méprisa le droit d’aînesse."]],"Genèse 28:12-15":[[12,"Il eut un songe. Et voici, une échelle était appuyée sur la terre, et son sommet touchait au ciel. Et voici, les anges de Dieu montaient et descendaient par cette échelle."],[13,"Et voici, l’Éternel se tenait au-dessus d’elle; et il dit: Je suis l’Éternel, le Dieu d’Abraham, ton père, et le Dieu d’Isaac. La terre sur laquelle tu es couché, je la donnerai à toi et à ta postérité."],[14,"Ta postérité sera comme la poussière de la terre; tu t’étendras à l’occident et à l’orient, au septentrion et au midi; et toutes les familles de la terre seront bénies en toi et en ta postérité."],[15,"Voici, je suis avec toi, je te garderai partout où tu iras, et je te ramènerai dans ce pays; car je ne t’abandonnerai point, que je n’aie exécuté ce que je te dis."]],"Genèse 31:41":[[41,"Voilà vingt ans que j’ai passés dans ta maison; je t’ai servi quatorze ans pour tes deux filles, et six ans pour ton troupeau, et tu as changé dix fois mon salaire."]],"Genèse 32:24-30":[[24,"Jacob demeura seul. Alors un homme lutta avec lui jusqu’au lever de l’aurore."],[25,"Voyant qu’il ne pouvait le vaincre, cet homme le frappa à l’emboîture de la hanche; et l’emboîture de la hanche de Jacob se démit pendant qu’il luttait avec lui."],[26,"Il dit: Laisse-moi aller, car l’aurore se lève. Et Jacob répondit: Je ne te laisserai point aller, que tu ne m’aies béni."],[27,"Il lui dit: Quel est ton nom? Et il répondit: Jacob."],[28,"Il dit encore: Ton nom ne sera plus Jacob, mais tu seras appelé Israël; car tu as lutté avec Dieu et avec des hommes, et tu as été vainqueur."],[29,"Jacob l’interrogea, en disant: Fais-moi je te prie, connaître ton nom. Il répondit: Pourquoi demandes-tu mon nom? Et il le bénit là."],[30,"Jacob appela ce lieu du nom de Peniel: car, dit-il, j’ai vu Dieu face à face, et mon âme a été sauvée."]],"Genèse 47:9":[[9,"Jacob répondit à Pharaon: Les jours des années de mon pèlerinage sont de cent trente ans. Les jours des années de ma vie ont été peu nombreux et mauvais, et ils n’ont point atteint les jours des années de la vie de mes pères durant leur pèlerinage."]],"Genèse 49:10":[[10,"Le sceptre ne s’éloignera point de Juda, Ni le bâton souverain d’entre ses pieds, Jusqu’à ce que vienne le Schilo, Et que les peuples lui obéissent."]],"Genèse 33:4":[[4,"Ésaü courut à sa rencontre; il l’embrassa, se jeta à son cou, et le baisa. Et ils pleurèrent."]],"Genèse 49:31":[[31,"Là on a enterré Abraham et Sara, sa femme; là on a enterré Isaac et Rebecca, sa femme; et là j’ai enterré Léa."]],"Genèse 29:31-35":[[31,"L’Éternel vit que Léa n’était pas aimée; et il la rendit féconde, tandis que Rachel était stérile."],[32,"Léa devint enceinte, et enfanta un fils, à qui elle donna le nom de Ruben; car elle dit: L’Éternel a vu mon humiliation, et maintenant mon mari m’aimera."],[33,"Elle devint encore enceinte, et enfanta un fils, et elle dit: L’Éternel a entendu que je n’étais pas aimée, et il m’a aussi accordé celui-ci. Et elle lui donna le nom de Siméon."],[34,"Elle devint encore enceinte, et enfanta un fils, et elle dit: Pour cette fois, mon mari s’attachera à moi; car je lui ai enfanté trois fils. C’est pourquoi on lui donna le nom de Lévi."],[35,"Elle devint encore enceinte, et enfanta un fils, et elle dit: Cette fois, je louerai l’Éternel. C’est pourquoi elle lui donna le nom de Juda. Et elle cessa d’enfanter."]],"Genèse 29:20":[[20,"Ainsi Jacob servit sept années pour Rachel: et elles furent à ses yeux comme quelques jours, parce qu’il l’aimait."]],"Genèse 35:16-19":[[16,"Ils partirent de Béthel; et il y avait encore une certaine distance jusqu’à Éphrata, lorsque Rachel accoucha. Elle eut un accouchement pénible;"],[17,"et pendant les douleurs de l’enfantement, la sage-femme lui dit: Ne crains point, car tu as encore un fils!"],[18,"Et comme elle allait rendre l’âme, car elle était mourante, elle lui donna le nom de Ben-Oni; mais le père l’appela Benjamin."],[19,"Rachel mourut, et elle fut enterrée sur le chemin d’Éphrata, qui est Bethléhem."]],"Matthieu 2:18":[[18,"On a entendu des cris à Rama, Des pleurs et de grandes lamentations: Rachel pleure ses enfants, Et n’a pas voulu être consolée, Parce qu’ils ne sont plus."]],"Genèse 30:22-24":[[22,"Dieu se souvint de Rachel, il l’exauça, et il la rendit féconde."],[23,"Elle devint enceinte, et enfanta un fils, et elle dit: Dieu a enlevé mon opprobre."],[24,"Et elle lui donna le nom de Joseph, en disant: Que l’Éternel m’ajoute un autre fils!"]],"Exode 6:16":[[16,"Voici les noms des fils de Lévi, avec leur postérité: Guerschon, Kehath et Merari. Les années de la vie de Lévi furent de cent trente-sept ans."]],"Exode 6:16-20":[[16,"Voici les noms des fils de Lévi, avec leur postérité: Guerschon, Kehath et Merari. Les années de la vie de Lévi furent de cent trente-sept ans."],[17,"Fils de Guerschon: Libni et Schimeï, et leurs familles."],[18,"Fils de Kehath: Amram, Jitsehar, Hébron et Uziel. Les années de la vie de Kehath furent de cent trente-trois ans."],[19,"Fil
