autel, qu’il appela El-Élohé-Israël."]],"Genèse 35:27-29":[[27,"Jacob arriva auprès d’Isaac, son père, à Mamré, à Kirjath-Arba, qui est Hébron, où avaient séjourné Abraham et Isaac."],[28,"Les jours d’Isaac furent de cent quatre-vingts ans."],[29,"Il expira et mourut, et il fut recueilli auprès de son peuple, âgé et rassasié de jours, et Ésaü et Jacob, ses fils, l’enterrèrent."]],"Genèse 46:3-4":[[3,"Et Dieu dit: Je suis le Dieu, le Dieu de ton père. Ne crains point de descendre en Égypte, car là je te ferai devenir une grande nation."],[4,"Moi-même je descendrai avec toi en Égypte, et moi-même je t’en ferai remonter; et Joseph te fermera les yeux."]],"Genèse 37:13-14":[[13,"Israël dit à Joseph: Tes frères ne font-ils pas paître le troupeau à Sichem? Viens, je veux t’envoyer vers eux. Et il répondit: Me voici!"],[14,"Israël lui dit: Va, je te prie, et vois si tes frères sont en bonne santé et si le troupeau est en bon état; et tu m’en rapporteras des nouvelles. Il l’envoya ainsi de la vallée d’Hébron; et Joseph alla à Sichem."]],"Genèse 37:15-17":[[15,"Un homme le rencontra, comme il errait dans les champs. Il le questionna, en disant: Que cherches-tu?"],[16,"Joseph répondit: Je cherche mes frères; dis-moi, je te prie, où ils font paître leur troupeau."],[17,"Et l’homme dit: Ils sont partis d’ici; car je les ai entendus dire: Allons à Dothan. Joseph alla après ses frères, et il les trouva à Dothan."]],"Genèse 37:23-28":[[23,"Lorsque Joseph fut arrivé auprès de ses frères, ils le dépouillèrent de sa tunique, de la tunique de plusieurs couleurs, qu’il avait sur lui."],[24,"Ils le prirent, et le jetèrent dans la citerne. Cette citerne était vide; il n’y avait point d’eau."],[25,"Ils s’assirent ensuite pour manger. Ayant levé les yeux, ils virent une caravane d’Ismaélites venant de Galaad; leurs chameaux étaient chargés d’aromates, de baume et de myrrhe, qu’ils transportaient en Égypte."],[26,"Alors Juda dit à ses frères: Que gagnerons-nous à tuer notre frère et à cacher son sang?"],[27,"Venez, vendons-le aux Ismaélites, et ne mettons pas la main sur lui, car il est notre frère, notre chair. Et ses frères l’écoutèrent."],[28,"Au passage des marchands madianites, ils tirèrent et firent remonter Joseph hors de la citerne; et ils le vendirent pour vingt sicles d’argent aux Ismaélites, qui l’emmenèrent en Égypte."]],"Genèse 39:1-2":[[1,"On fit descendre Joseph en Égypte; et Potiphar, officier de Pharaon, chef des gardes, Égyptien, l’acheta des Ismaélites qui l’y avaient fait descendre."],[2,"L’Éternel fut avec lui, et la prospérité l’accompagna; il habitait dans la maison de son maître, l’Égyptien."]],"Genèse 41:39-41":[[39,"Et Pharaon dit à Joseph: Puisque Dieu t’a fait connaître toutes ces choses, il n’y a personne qui soit aussi intelligent et aussi sage que toi."],[40,"Je t’établis sur ma maison, et tout mon peuple obéira à tes ordres. Le trône seul m’élèvera au-dessus de toi."],[41,"Pharaon dit à Joseph: Vois, je te donne le commandement de tout le pays d’Égypte."]],"Genèse 41:46":[[46,"Joseph était âgé de trente ans lorsqu’il se présenta devant Pharaon, roi d’Égypte; et il quitta Pharaon, et parcourut tout le pays d’Égypte."]],"Exode 12:37":[[37,"Les enfants d’Israël partirent de Ramsès pour Succoth au nombre d’environ six cent mille hommes de pied, sans les enfants."]],"Exode 13:17-18":[[17,"Lorsque Pharaon laissa aller le peuple, Dieu ne le conduisit point par le chemin du pays des Philistins, quoique le plus proche; car Dieu dit: Le peuple pourrait se repentir en voyant la guerre, et retourner en Égypte."],[18,"Mais Dieu fit faire au peuple un détour par le chemin du désert, vers la mer Rouge. Les enfants d’Israël montèrent en armes hors du pays d’Égypte."]],"Exode 19:1-2":[[1,"Le troisième mois après leur sortie du pays d’Égypte, les enfants d’Israël arrivèrent ce jour-là au désert de Sinaï."],[2,"Étant partis de Rephidim, ils arrivèrent au désert de Sinaï, et ils campèrent dans le désert; Israël campa là, vis-à-vis de la montagne."]],"Exode 19:5-6":[[5,"Maintenant, si vous écoutez ma voix, et si vous gardez mon alliance, vous m’appartiendrez entre tous les peuples, car toute la terre est à moi;"],[6,"vous serez pour moi un royaume de sacrificateurs et une nation sainte. Voilà les paroles que tu diras aux enfants d’Israël."]],"Nombres 13:26":[[26,"A leur arrivée, ils se rendirent auprès de Moïse et d’Aaron, et de toute l’assemblée des enfants d’Israël, à Kadès dans le désert de Paran. Ils leur firent un rapport, ainsi qu’à toute l’assemblée, et ils leur montrèrent les fruits du pays."]],"Nombres 14:33-34":[[33,"et vos enfants paîtront quarante années dans le désert, et porteront la peine de vos infidélités, jusqu’à ce que vos cadavres soient tous tombés dans le désert."],[34,"De même que vous avez mis quarante jours à explorer le pays, vous porterez la peine de vos iniquités quarante années, une année pour chaque jour; et vous saurez ce que c’est que d’être privé de ma présence."]],"Deutéronome 34:1-5":[[1,"Moïse monta des plaines de Moab sur le mont Nebo, au sommet du Pisga, vis-à-vis de Jéricho. Et l’Éternel lui fit voir tout le pays:"],[2,"Galaad jusqu’à Dan, tout Nephthali, le pays d’Éphraïm et de Manassé, tout le pays de Juda jusqu’à la mer occidentale,"],[3,"le midi, les environs du Jourdain, la vallée de Jéricho, la ville des palmiers, jusqu’à Tsoar."],[4,"L’Éternel lui dit: C’est là le pays que j’ai juré de donner à Abraham, à Isaac et à Jacob, en disant: Je le donnerai à ta postérité. Je te l’ai fait voir de tes yeux; mais tu n’y entreras point."],[5,"Moïse, serviteur de l’Éternel, mourut là, dans le pays de Moab, selon l’ordre de l’Éternel."]],"Josué 3:14-17":[[14,"Le peuple sortit de ses tentes pour passer le Jourdain, et les sacrificateurs qui portaient l’arche de l’alliance marchèrent devant le peuple."],[15,"Quand les sacrificateurs qui portaient l’arche furent arrivés au Jourdain, et que leurs pieds se furent mouillés au bord de l’eau, le Jourdain regorge par-dessus toutes ses rives tout le temps de la moisson,"],[16,"les eaux qui descendent d’en haut s’arrêtèrent, et s’élevèrent en un monceau, à une très grande distance, près de la ville d’Adam, qui est à côté de Tsarthan; et celles qui descendaient vers la mer de la plaine, la mer Salée, furent complètement coupées. Le peuple passa vis-à-vis de Jéricho."],[17,"Les sacrificateurs qui portaient l’arche de l’alliance de l’Éternel s’arrêtèrent de pied ferme sur le sec, au milieu du Jourdain, pendant que tout Israël passait à sec, jusqu’à ce que toute la nation eût achevé de passer le Jourdain."]],"1 Rois 17:1-6":[[1,"Élie, le Thischbite, l’un des habitants de Galaad, dit à Achab: L’Éternel est vivant, le Dieu d’Israël, dont je suis le serviteur! il n’y aura ces années-ci ni rosée ni pluie, sinon à ma parole."],[2,"Et la parole de l’Éternel fut adressée à Élie, en ces mots:"],[3,"Pars d’ici, dirige-toi vers l’orient, et cache-toi près du torrent de Kerith, qui est en face du Jourdain."],[4,"Tu boiras de l’eau du torrent, et j’ai ordonné aux corbeaux de te nourrir là."],[5,"Il partit et fit selon la parole de l’Éternel, et il alla s’établir près du torrent de Kerith, qui est en face du Jourdain."],[6,"Les corbeaux lui apportaient du pain et de la viande le matin, et du pain et de la viande le soir, et il buvait de l’eau du torrent."]],"1 Rois 17:14-16":[[14,"Car ainsi parle l’Éternel, le Dieu d’Israël: La farine qui est dans le pot ne manquera point et l’huile qui est dans la cruche ne diminuera point, jusqu’au jour où l’Éternel fera tomber de la pluie sur la face du sol."],[15,"Elle alla, et elle fit selon la parole d’Élie. Et pendant longtemps elle eut de quoi manger, elle et sa famille, aussi bien qu’Élie."],[16,"La farine qui était dans le pot ne manqua point, et l’huile qui était dans la cruche ne diminua point, selon la parole que l’Éternel avait prononcée par Élie."]],"1 Rois 17:22-24":[[22,"L’Éternel écouta la voix d’Élie, et l’âme de l’enfant revint au-dedans de lui, et il fut rendu à la vie."],[23,"Élie prit l’enfant, le descendit de la chambre haute dans la maison, et le donna à sa mère. Et Élie dit: Vois, ton fils est vivant."],[24,"Et la femme dit à Élie: Je reconnais maintenant que tu es un homme de Dieu, et que la parole de l’Éternel dans ta bouche est vérité."]],"1 Rois 18:46":[[46,"Et la main de l’Éternel fut sur Élie, qui se ceignit les reins et courut devant Achab jusqu’à l’entrée de Jizreel."]],"1 Rois 19:1-3":[[1,"Achab rapporta à Jézabel tout ce qu’avait fait Élie, et comment il avait tué par l’épée tous les prophètes."],[2,"Jézabel envoya un messager à Élie, pour lui dire: Que les dieux me traitent dans toute leur rigueur, si demain, à cette heure, je ne fais de ta vie ce que tu as fait de la vie de chacun d’eux!"],[3,"Élie, voyant cela, se leva et s’en alla, pour sauver sa vie. Il arriva à Beer-Schéba, qui appartient à Juda, et il y laissa son serviteur."]],"1 Rois 19:4-8":[[4,"Pour lui, il alla dans le désert où, après une journée de marche, il s’assit sous un genêt, et demanda la mort, en disant: C’est assez! Maintenant, Éternel, prends mon âme, car je ne suis pas meilleur que mes pères."],[5,"Il se coucha et s’endormit sous un genêt. Et voici, un ange le toucha, et lui dit: Lève-toi, mange."],[6,"Il regarda, et il y avait à son chevet un gâteau cuit sur des pierres chauffées et une cruche d’eau. Il mangea et but, puis se recoucha."],[7,"L’ange de l’Éternel vint une seconde fois, le toucha, et dit: Lève-toi, mange, car le chemin est trop long pour toi."],[8,"Il se leva, mangea et but; et avec la force que lui donna cette nourriture, il marcha quarante jours et quarante nuits jusqu’à la montagne de Dieu, à Horeb."]],"1 Rois 19:19-21":[[19,"Élie partit de là, et il trouva Élisée, fils de Schaphath, qui labourait. Il y avait devant lui douze paires de bœufs, et il était avec la douzième. Élie s’approcha de lui, et il jeta sur lui son manteau."],[20,"Élisée, quittant ses bœufs, courut après Élie, et dit: Laisse-moi embrasser mon père et ma mère, et je te suivrai. Élie lui répondit: Va, et reviens; car pense à ce que je t’ai fait."],[21,"Après s’être éloigné d’Élie, il revint prendre une paire de bœufs, qu’il offrit en sacrifice; avec l’attelage des bœufs, il fit cuire leur chair, et la donna à manger au peuple. Puis il se leva, suivit Élie, et fut à son service."]],"2 Rois 2:8-11":[[8,"Alors Élie prit son manteau, le roula, et en frappa les eaux, qui se partagèrent çà et là, et ils passèrent tous deux à sec."],[9,"Lorsqu’ils eurent passé, Élie dit à Élisée: Demande ce que tu veux que je fasse pour toi, avant que je sois enlevé d’avec toi. Élisée répondit: Qu’il y ait sur moi, je te prie, une double portion de ton esprit!"],[10,"Élie dit: Tu demandes une chose difficile. Mais si tu me vois pendant que je serai enlevé d’avec toi, cela t’arrivera ainsi; sinon, cela n’arrivera pas."],[11,"Comme ils continuaient à marcher en parlant, voici, un char de feu et des chevaux de feu les séparèrent l’un de l’autre, et Élie monta au ciel dans un tourbillon."]],"Jonas 1:15":[[15,"Puis ils prirent Jonas, et le jetèrent dans la mer. Et la fureur de la mer s’apaisa."]],"Jonas 2:10":[[10,"Pour moi, je t’offrirai des sacrifices avec un cri d’actions de grâces, J’accomplirai les vœux que j’ai faits: Le salut vient de l’Éternel."]],"Jonas 3:4-10":[[4,"Jonas fit d’abord dans la ville une journée de marche; il criait et disait: Encore quarante jours, et Ninive est détruite!"],[5,"Les gens de Ninive crurent à Dieu, ils publièrent un jeûne, et se revêtirent de sacs, depuis les plus grands jusqu’aux plus petits."],[6,"La chose parvint au roi de Ninive; il se leva de son trône, ôta son manteau, se couvrit d’un sac, et s’assit sur la cendre."],[7,"Et il fit faire dans Ninive cette publication, par ordre du roi et de ses grands; Que les hommes et les bêtes, les bœufs et les brebis, ne goûtent de rien, ne paissent point, et ne boivent point d’eau!"],[8,"Que les hommes et les bêtes soient couverts de sacs, qu’ils crient à Dieu avec force, et qu’ils reviennent tous de leur mauvaise voie et des actes de violence dont leurs mains sont coupables!"],[9,"Qui sait si Dieu ne reviendra pas et ne se repentira pas, et s’il ne renoncera pas à son ardente colère, en sorte que nous ne périssions point?"],[10,"Dieu vit qu’ils agissaient ainsi et qu’ils revenaient de leur mauvaise voie. Alors Dieu se repentit du mal qu’il avait résolu de leur faire, et il ne le fit pas."]],"Jérémie 46:2":[[2,"Sur l’Égypte. Sur l’armée de Pharaon Neco, roi d’Égypte, qui était près du fleuve de l’Euphrate, à Carkemisch, et qui fut battue par Nebucadnetsar, roi de Babylone, la quatrième année de Jojakim, fils de Josias, roi de Juda."]],"Psaume 137:1":[[1,"Sur les bords des fleuves de Babylone, Nous étions assis et nous pleurions, En nous souvenant de Sion."]],"Daniel 1:3-6":[[3,"Le roi donna l’ordre à Aschpenaz, chef de ses eunuques, d’amener quelques-uns des enfants d’Israël de race royale ou de famille noble,"],[4,"de jeunes garçons sans défaut corporel, beaux de figure, doués de sagesse, d’intelligence et d’instruction, capables de servir dans le palais du roi, et à qui l’on enseignerait les lettres et la langue des Chaldéens."],[5,"Le roi leur assigna pour chaque jour une portion des mets de sa table et du vin dont il buvait, voulant les élever pendant trois années, au bout desquelles ils seraient au service du roi."],[6,"Il y avait parmi eux, d’entre les enfants de Juda, Daniel, Hanania, Mischaël et Azaria."]],"Esther 1:2":[[2,"et le roi Assuérus était alors assis sur son trône royal à Suse, dans la capitale."]],"Esdras 1:1-3":[[1,"La première année de Cyrus, roi de Perse, afin que s’accomplît la parole de l’Éternel prononcée par la bouche de Jérémie, l’Éternel réveilla l’esprit de Cyrus, roi de Perse, qui fit faire de vive voix et par écrit cette publication dans tout son royaume:"],[2,"Ainsi parle Cyrus, roi des Perses: L’Éternel, le Dieu des cieux, m’a donné tous les royaumes de la terre, et il m’a commandé de lui bâtir une maison à Jérusalem en Juda."],[3,"Qui d’entre vous est de son peuple? Que son Dieu soit avec lui, et qu’il monte à Jérusalem en Juda et bâtisse la maison de l’Éternel, le Dieu d’Israël! C’est le Dieu qui est à Jérusalem."]],"Esdras 8:21-23":[[21,"Là, près du fleuve d’Ahava, je publiai un jeûne d’humiliation devant notre Dieu, afin d’implorer de lui un heureux voyage pour nous, pour nos enfants, et pour tout ce qui nous appartenait."],[22,"J’aurais eu honte de demander au roi une escorte et des cavaliers pour nous protéger contre l’ennemi pendant la route, car nous avions dit au roi: La main de notre Dieu est pour leur bien sur tous ceux qui le cherchent, mais sa force et sa colère sont sur tous ceux qui l’abandonnent."],[23,"C’est à cause de cela que nous jeûnâmes et que nous invoquâmes notre Dieu. Et il nous exauça."]],"Esdras 7:9":[[9,"il était parti de Babylone le premier jour du premier mois, et il arriva à Jérusalem le premier jour du cinquième mois, la bonne main de son Dieu étant sur lui."]],"Luc 1:26-31":[[26,"Au sixième mois, l’ange Gabriel fut envoyé par Dieu dans une ville de Galilée, appelée Nazareth,"],[27,"auprès d’une vierge fiancée à un homme de la maison de David, nommé Joseph. Le nom de la vierge était Marie."],[28,"L’ange entra chez elle, et dit: Je te salue, toi à qui une grâce a été faite; le Seigneur est avec toi."],[29,"Troublée par cette parole, Marie se demandait ce que pouvait signifier une telle salutation."],[30,"L’ange lui dit: Ne crains point, Marie; car tu as trouvé grâce devant Dieu."],[31,"Et voici, tu deviendras enceinte, et tu enfanteras un fils, et tu lui donneras le nom de Jésus."]],"Matthieu 2:13-15":[[13,"Lorsqu’ils furent partis, voici, un ange du Seigneur apparut en songe à Joseph, et dit: Lève-toi, prends le petit enfant et sa mère, fuis en Égypte, et restes-y jusqu’à ce que je te parle; car Hérode cherchera le petit enfant pour le faire périr."],[14,"Joseph se leva, prit de nuit le petit enfant et sa mère, et se retira en Égypte."],[15,"Il y resta jusqu’à la mort d’Hérode, afin que s’accomplît ce que le Seigneur avait annoncé par le prophète: J’ai appelé mon fils hors d’Égypte."]],"Matthieu 2:23":[[23,"et vint demeurer dans une ville appelée Nazareth, afin que s’accomplît ce qui avait été annoncé par les prophètes: Il sera appelé Nazaréen."]],"Luc 2:51-52":[[51,"Puis il descendit avec eux pour aller à Nazareth, et il leur était soumis. Sa mère gardait toutes ces choses dans son cœur."],[52,"Et Jésus croissait en sagesse, en stature, et en grâce, devant Dieu et devant les hommes."]],"Matthieu 3:16-17":[[16,"Dès que Jésus eut été baptisé, il sortit de l’eau. Et voici, les cieux s’ouvrirent, et il vit l’Esprit de Dieu descendre comme une colombe et venir sur lui."],[17,"Et voici, une voix fit entendre des cieux ces paroles: Celui-ci est mon Fils bien-aimé, en qui j’ai mis toute mon affection."]],"Matthieu 4:1-4":[[1,"Alors Jésus fut emmené par l’Esprit dans le désert, pour être tenté par le diable."],[2,"Après avoir jeûné quarante jours et quarante nuits, il eut faim."],[3,"Le tentateur, s’étant approché, lui dit: Si tu es Fils de Dieu, ordonne que ces pierres deviennent des pains."],[4,"Jésus répondit: Il est écrit: L’homme ne vivra pas de pain seulement, mais de toute parole qui sort de la bouche de Dieu."]],"Jean 2:1-11":[[1,"Trois jours après, il y eut des noces à Cana en Galilée. La mère de Jésus était là,"],[2,"et Jésus fut aussi invité aux noces avec ses disciples."],[3,"Le vin ayant manqué, la mère de Jésus lui dit: Ils n’ont plus de vin."],[4,"Jésus lui répondit: Femme, qu’y a-t-il entre moi et toi? Mon heure n’est pas encore venue."],[5,"Sa mère dit aux serviteurs: Faites ce qu’il vous dira."],[6,"Or, il y avait là six vases de pierre, destinés aux purifications des Juifs, et contenant chacun deux ou trois mesures."],[7,"Jésus leur dit: Remplissez d’eau ces vases. Et ils les remplirent jusqu’au bord."],[8,"Puisez maintenant, leur dit-il, et portez-en à l’ordonnateur du repas. Et ils en portèrent."],[9,"Quand l’ordonnateur du repas eut goûté l’eau changée en vin, ne sachant d’où venait ce vin, tandis que les serviteurs, qui avaient puisé l’eau, le savaient bien, il appela l’époux,"],[10,"et lui dit: Tout homme sert d’abord le bon vin, puis le moins bon après qu’on s’est enivré; toi, tu as gardé le bon vin jusqu’à présent."],[11,"Tel fut, à Cana en Galilée, le premier des miracles que fit Jésus. Il manifesta sa gloire, et ses disciples crurent en lui."]],"Matthieu 4:13":[[13,"Il quitta Nazareth, et vint demeurer à Capernaüm, située près de la mer, dans le territoire de Zabulon et de Nephthali,"]],"Matthieu 4:18-22":[[18,"Comme il marchait le long de la mer de Galilée, il vit deux frères, Simon, appelé Pierre, et André, son frère, qui jetaient un filet dans la mer; car ils étaient pêcheurs."],[19,"Il leur dit: Suivez-moi, et je vous ferai pêcheurs d’hommes."],[20,"Aussitôt, ils laissèrent les filets, et le suivirent."],[21,"De là étant allé plus loin, il vit deux autres frères, Jacques, fils de Zébédée, et Jean, son frère, qui étaient dans une barque avec Zébédée, leur père, et qui réparaient leurs filets."],[22,"Il les appela, et aussitôt ils laissèrent la barque et leur père, et le suivirent."]],"Jean 4:25-26":[[25,"La femme lui dit: Je sais que le Messie doit venir (celui qu’on appelle Christ); quand il sera venu, il nous annoncera toutes choses."],[26,"Jésus lui dit: Je le suis, moi qui te parle."]],"Matthieu 16:13-16":[[13,"Jésus, étant arrivé dans le territoire de Césarée de Philippe, demanda à ses disciples: Qui dit-on que je suis, moi, le Fils de l’homme?"],[14,"Ils répondirent: Les uns disent que tu es Jean-Baptiste; les autres, Élie; les autres, Jérémie, ou l’un des prophètes."],[15,"Et vous, leur dit-il, qui dites-vous que je suis?"],[16,"Simon Pierre répondit: Tu es le Christ, le Fils du Dieu vivant."]],"Jean 19:30":[[30,"Quand Jésus eut pris le vinaigre, il dit: Tout est accompli. Et, baissant la tête, il rendit l’esprit."]],"Actes 1:9-11":[[9,"Après avoir dit cela, il fut élevé pendant qu’ils le regardaient, et une nuée le déroba à leurs yeux."],[10,"Et comme ils avaient les regards fixés vers le ciel pendant qu’il s’en allait, voici, deux hommes vêtus de blanc leur apparurent,"],[11,"et dirent: Hommes Galiléens, pourquoi vous arrêtez-vous à regarder au ciel? Ce Jésus, qui a été enlevé au ciel du milieu de vous, reviendra de la même manière que vous l’avez vu allant au ciel."]],"Actes 9:17-20":[[17,"Ananias sortit; et, lorsqu’il fut arrivé dans la maison, il imposa les mains à Saul, en disant: Saul, mon frère, le Seigneur Jésus, qui t’est apparu sur le chemin par lequel tu venais, m’a envoyé pour que tu recouvres la vue et que tu sois rempli du Saint-Esprit."],[18,"Au même instant, il tomba de ses yeux comme des écailles, et il recouvra la vue. Il se leva, et fut baptisé;"],[19,"et, après qu’il eut pris de la nourriture, les forces lui revinrent. Saul resta quelques jours avec les disciples qui étaient à Damas."],[20,"Et aussitôt il prêcha dans les synagogues que Jésus est le Fils de Dieu."]],"Galates 1:17":[[17,"et je ne montai point à Jérusalem vers ceux qui furent apôtres avant moi, mais je partis pour l’Arabie. Puis je revins encore à Damas."]],"Galates 1:18-19":[[18,"Trois ans plus tard, je montai à Jérusalem pour faire la connaissance de Céphas, et je demeurai quinze jours chez lui."],[19,"Mais je ne vis aucun autre des apôtres, si ce n’est Jacques, le frère du Seigneur."]],"Actes 9:30":[[30,"Les frères, l’ayant su, l’emmenèrent à Césarée, et le firent partir pour Tarse."]],"Actes 11:25-26":[[25,"Barnabas se rendit ensuite à Tarse, pour chercher Saul;"],[26,"et, l’ayant trouvé, il l’amena à Antioche. Pendant toute une année, ils se réunirent aux assemblées de l’Église, et ils enseignèrent beaucoup de personnes. Ce fut à Antioche que, pour la première fois, les disciples furent appelés chrétiens."]],"Actes 13:2-3":[[2,"Pendant qu’ils servaient le Seigneur dans leur ministère et qu’ils jeûnaient, le Saint-Esprit dit: Mettez-moi à part Barnabas et Saul pour l’œuvre à laquelle je les ai appelés."],[3,"Alors, après avoir jeûné et prié, ils leur imposèrent les mains, et les laissèrent partir."]],"Actes 13:4":[[4,"Barnabas et Saul, envoyés par le Saint-Esprit, descendirent à Séleucie, et de là ils s’embarquèrent pour l’île de Chypre."]],"Actes 13:5":[[5,"Arrivés à Salamine, ils annoncèrent la parole de Dieu dans les synagogues des Juifs. Ils avaient Jean pour aide."]],"Actes 13:12":[[12,"Alors le proconsul, voyant ce qui était arrivé, crut, étant frappé de la doctrine du Seigneur."]],"Actes 13:13":[[13,"Paul et ses compagnons, s’étant embarqués à Paphos, se rendirent à Perge en Pamphylie. Jean se sépara d’eux, et retourna à Jérusalem."]],"Actes 13:46-48":[[46,"Paul et Barnabas leur dirent avec assurance: C’est à vous premièrement que la parole de Dieu devait être annoncée; mais, puisque vous la repoussez, et que vous vous jugez vous-mêmes indignes de la vie éternelle, voici, nous nous tournons vers les païens."],[47,"Car ainsi nous l’a ordonné le Seigneur: Je t’ai établi pour être la lumière des nations, Pour porter le salut jusqu’aux extrémités de la terre."],[48,"Les païens se réjouissaient en entendant cela, ils glorifiaient la parole du Seigneur, et tous ceux qui étaient destinés à la vie éternelle crurent."]],"Actes 14:1-6":[[1,"A Icone, Paul et Barnabas entrèrent ensemble dans la synagogue des Juifs, et ils parlèrent de telle manière qu’une grande multitude de Juifs et de Grecs crurent."],[2,"Mais ceux des Juifs qui ne crurent point excitèrent et aigrirent les esprits des païens contre les frères."],[3,"Ils restèrent cependant assez longtemps à Icone, parlant avec assurance, appuyés sur le Seigneur, qui rendait témoignage à la parole de sa grâce et permettait qu’il se fît par leurs mains des prodiges et des miracles."],[4,"La population de la ville se divisa: les uns étaient pour les Juifs, les autres pour les apôtres."],[5,"Et comme les païens et les Juifs, de concert avec leurs chefs, se mettaient en mouvement pour les outrager et les lapider,"],[6,"Paul et Barnabas, en ayant eu connaissance, se réfugièrent dans les villes de la Lycaonie, à Lystre et à Derbe, et dans la contrée d’alentour."]],"Actes 14:8-10":[[8,"A Lystre, se tenait assis un homme impotent des pieds, boiteux de naissance, et qui n’avait jamais marché."],[9,"Il écoutait parler Paul. Et Paul, fixant les regards sur lui et voyant qu’il avait la foi pour être guéri,"],[10,"dit d’une voix forte: Lève-toi droit sur tes pieds. Et il se leva d’un bond et marcha."]],"Actes 14:19-20":[[19,"Alors survinrent d’Antioche et d’Icone des Juifs qui gagnèrent la foule, et qui, après avoir lapidé Paul, le traînèrent hors de la ville, pensant qu’il était mort."],[20,"Mais, les disciples l’ayant entouré, il se leva, et entra dans la ville. Le lendemain, il partit pour Derbe avec Barnabas."]],"Actes 14:21":[[21,"Quand ils eurent évangélisé cette ville et fait un certain nombre de disciples, ils retournèrent à Lystre, à Icone et à Antioche,"]],"Actes 14:25":[[25,"annoncèrent la parole à Perge, et descendirent à Attalie."]],"Actes 14:26-27":[[26,"De là ils s’embarquèrent pour Antioche, d’où ils avaient été recommandés à la grâce de Dieu pour l’œuvre qu’ils venaient d’accomplir."],[27,"Après leur arrivée, ils convoquèrent l’Église, et ils racontèrent tout ce que Dieu avait fait avec eux, et comment il avait ouvert aux nations la porte de la foi."]],"Actes 15:40-41":[[40,"Paul fit choix de Silas, et partit, recommandé par les frères à la grâce du Seigneur."],[41,"Il parcourut la Syrie et la Cilicie, fortifiant les Églises."]],"Actes 16:9-10":[[9,"Pendant la nuit, Paul eut une vision: un Macédonien lui apparut, et lui fit cette prière: Passe en Macédoine, secours-nous!"],[10,"Après cette vision de Paul, nous cherchâmes aussitôt à nous rendre en Macédoine, concluant que le Seigneur nous appelait à y annoncer la bonne nouvelle."]],"Actes 16:14":[[14,"L’une d’elles, nommée Lydie, marchande de pourpre, de la ville de Thyatire, était une femme craignant Dieu, et elle écoutait. Le Seigneur lui ouvrit le cœur, pour qu’elle fût attentive à ce que disait Paul."]],"Actes 16:25-31":[[25,"Vers le milieu de la nuit, Paul et Silas priaient et chantaient les louanges de Dieu, et les prisonniers les entendaient."],[26,"Tout à coup il se fit un grand tremblement de terre, en sorte que les fondements de la prison furent ébranlés; au même instant, toutes les portes s’ouvrirent, et les liens de tous les prisonniers furent rompus."],[27,"Le geôlier se réveilla, et, lorsqu’il vit les portes de la prison ouvertes, il tira son épée et allait se tuer, pensant que les prisonniers s’étaient enfuis."],[28,"Mais Paul cria d’une voix forte: Ne te fais point de mal, nous sommes tous ici."],[29,"Alors le geôlier, ayant demandé de la lumière, entra précipitamment, et se jeta tout tremblant aux pieds de Paul et de Silas;"],[30,"il les fit sortir, et dit: Seigneurs, que faut-il que je fasse pour être sauvé?"],[31,"Paul et Silas répondirent: Crois au Seigneur Jésus, et tu seras sauvé, toi et ta famille."]],"Actes 17:1-4":[[1,"Paul et Silas passèrent par Amphipolis et Apollonie, et ils arrivèrent à Thessalonique, où les Juifs avaient une synagogue."],[2,"Paul y entra, selon sa coutume. Pendant trois sabbats, il discuta avec eux, d’après les Écritures,"],[3,"expliquant et établissant que le Christ devait souffrir et ressusciter des morts. Et Jésus que je vous annonce, disait-il, c’est lui qui est le Christ."],[4,"Quelques-uns d’entre eux furent persuadés, et se joignirent à Paul et à Silas, ainsi qu’une grande multitude de Grecs craignant Dieu, et beaucoup de femmes de qualité."]],"Actes 17:11":[[11,"Ces Juifs avaient des sentiments plus nobles que ceux de Thessalonique; ils reçurent la parole avec beaucoup d’empressement, et ils examinaient chaque jour les Écritures, pour voir si ce qu’on leur disait était exact."]],"Actes 17:22-23":[[22,"Paul, debout au milieu de l’Aréopage, dit: Hommes Athéniens, je vous trouve à tous égards extrêmement religieux."],[23,"Car, en parcourant votre ville et en considérant les objets de votre dévotion, j’ai même découvert un autel avec cette inscription: A un dieu inconnu! Ce que vous révérez sans le connaître, c’est ce que je vous annonce."]],"Actes 18:9-11":[[9,"Le Seigneur dit à Paul en vision pendant la nuit: Ne crains point; mais parle, et ne te tais point,"],[10,"Car je suis avec toi, et personne ne mettra la main sur toi pour te faire du mal: parle, car j’ai un peuple nombreux dans cette ville."],[11,"Il y demeura un an et six mois, enseignant parmi les Corinthiens la parole de Dieu."]],"Actes 18:19-21":[[19,"Ils arrivèrent à Éphèse, et Paul y laissa ses compagnons. Étant entré dans la synagogue, il s’entretint avec les Juifs,"],[20,"qui le prièrent de prolonger son séjour."],[21,"Mais il n’y consentit point, et il prit congé d’eux, en disant: Il faut absolument que je célèbre la fête prochaine à Jérusalem. Je reviendrai vers vous, si Dieu le veut. Et il partit d’Éphèse."]],"Actes 18:22":[[22,"Étant débarqué à Césarée, il monta à Jérusalem, et, après avoir salué l’Église, il descendit à Antioche."]],"Actes 18:23":[[23,"Lorsqu’il eut passé quelque temps à Antioche, Paul se mit en route, et parcourut successivement la Galatie et la Phrygie, fortifiant tous les disciples."]],"Actes 19:10":[[10,"Cela dura deux ans, de sorte que tous ceux qui habitaient l’Asie, Juifs et Grecs, entendirent la parole du Seigneur."]],"Actes 20:1-2":[[1,"Lorsque le tumulte eut cessé, Paul réunit les disciples, et, après les avoir exhortés, prit congé d’eux, et partit pour aller en Macédoine."],[2,"Il parcourut cette contrée, en adressant aux disciples de nombreuses exhortations."]],"Actes 20:2-3":[[2,"Il parcourut cette contrée, en adressant aux disciples de nombreuses exhortations."],[3,"Puis il se rendit en Grèce, où il séjourna trois mois. Il était sur le point de s’embarquer pour la Syrie, quand les Juifs lui dressèrent des embûches. Alors il se décida à reprendre la route de la Macédoine."]],"Actes 20:9-12":[[9,"Or, un jeune homme nommé Eutychus, qui était assis sur la fenêtre, s’endormit profondément pendant le long discours de Paul; entraîné par le sommeil, il tomba du troisième étage en bas, et il fut relevé mort."],[10,"Mais Paul, étant descendu, se pencha sur lui et le prit dans ses bras, en disant: Ne vous troublez pas, car son âme est en lui."],[11,"Quand il fut remonté, il rompit le pain et mangea, et il parla longtemps encore jusqu’au jour. Après quoi il partit."],[12,"Le jeune homme fut ramené vivant, et ce fut le sujet d’une grande consolation."]],"Actes 20:35-38":[[35,"Je vous ai montré de toutes manières que c’est en travaillant ainsi qu’il faut soutenir les faibles, et se rappeler les paroles du Seigneur, qui a dit lui-même: Il y a plus de bonheur à donner qu’à recevoir."],[36,"Après avoir ainsi parlé, il se mit à genoux, et il pria avec eux tous."],[37,"Et tous fondirent en larmes, et, se jetant au cou de Paul,"],[38,"ils l’embrassaient, affligés surtout de ce qu’il avait dit qu’ils ne verraient plus son visage. Et ils l’accompagnèrent jusqu’au navire."]],"Actes 21:3-4":[[3,"Quand nous fûmes en vue de l’île de Chypre, nous la laissâmes à gauche, poursuivant notre route du côté de la Syrie, et nous abordâmes à Tyr, où le bâtiment devait décharger sa cargaison."],[4,"Nous trouvâmes les disciples, et nous restâmes là sept jours. Les disciples, poussés par l’Esprit, disaient à Paul de ne pas monter à Jérusalem."]],"Actes 21:10-13":[[10,"Comme nous étions là depuis plusieurs jours, un prophète, nommé Agabus, descendit de Judée,"],[11,"et vint nous trouver. Il prit la ceinture de Paul, se lia les pieds et les mains, et dit: Voici ce que déclare le Saint-Esprit: L’homme à qui appartient cette ceinture, les Juifs le lieront de la même manière à Jérusalem, et le livreront entre les mains des païens."],[12,"Quand nous entendîmes cela, nous et ceux de l’endroit, nous priâmes Paul de ne pas monter à Jérusalem."],[13,"Alors il répondit: Que faites-vous, en pleurant et en me brisant le cœur? Je suis prêt, non seulement à être lié, mais encore à mourir à Jérusalem pour le nom du Seigneur Jésus."]],"Actes 21:17":[[17,"Lorsque nous arrivâmes à Jérusalem, les frères nous reçurent avec joie."]],"Actes 25:11-12":[[11,"Si j’ai commis quelque injustice, ou quelque crime digne de mort, je ne refuse pas de mourir; mais, si les choses dont ils m’accusent sont fausses, personne n’a le droit de me livrer à eux. J’en appelle à César."],[12,"Alors Festus, après avoir délibéré avec le conseil, répondit: Tu en as appelé à César; tu iras devant César."]],"Actes 27:3":[[3,"Le jour suivant, nous abordâmes à Sidon; et Julius, qui traitait Paul avec bienveillance, lui permit d’aller chez ses amis et de recevoir leurs soins."]],"Actes 27:5-6":[[5,"Après avoir traversé la mer qui baigne la Cilicie et la Pamphylie, nous arrivâmes à Myra en Lycie."],[6,"Et là, le centenier, ayant trouvé un navire d’Alexandrie qui allait en Italie, nous y fit monter."]],"Actes 27:8-11":[[8,"Nous la côtoyâmes avec peine, et nous arrivâmes à un lieu nommé Beaux Ports, près duquel était la ville de Lasée."],[9,"Un temps assez long s’était écoulé, et la navigation devenait dangereuse, car l’époque même du jeûne était déjà passée."],[10,"C’est pourquoi Paul avertit les autres, en disant: O hommes, je vois que la navigation ne se fera pas sans péril et sans beaucoup de dommage, non seulement pour la cargaison et pour le navire, mais encore pour nos personnes."],[11,"Le centenier écouta le pilote et le patron du navire plutôt que les paroles de Paul."]],"Actes 27:20-25":[[20,"Le soleil et les étoiles ne parurent pas pendant plusieurs jours, et la tempête était si forte que nous perdîmes enfin toute espérance de nous sauver."],[21,"On n’avait pas mangé depuis longtemps. Alors Paul, se tenant au milieu d’eux, leur dit: O hommes, il fallait m’écouter et ne pas partir de Crète, afin d’éviter ce péril et ce dommage."],[22,"Maintenant je vous exhorte à prendre courage; car aucun de vous ne périra, et il n’y aura de perte que celle du navire."],[23,"Un ange du Dieu à qui j’appartiens et que je sers m’est apparu cette nuit,"],[24,"et m’a dit: Paul, ne crains point; il faut que tu comparaisses devant César, et voici, Dieu t’a donné tous ceux qui naviguent avec toi."],[25,"C’est pourquoi, ô hommes, rassurez-vous, car j’ai cette confiance en Dieu qu’il en sera comme il m’a été dit."]],"Actes 28:1-6":[[1,"Après nous être sauvés, nous reconnûmes que l’île s’appelait Malte."],[2,"Les barbares nous témoignèrent une bienveillance peu commune; ils nous recueillirent tous auprès d’un grand feu, qu’ils avaient allumé parce que la pluie tombait et qu’il faisait grand froid."],[3,"Paul ayant ramassé un tas de broussailles et l’ayant mis au feu, une vipère en sortit par l’effet de la chaleur et s’attacha à sa main."],[4,"Quand les barbares virent l’animal suspendu à sa main, ils se dirent les uns aux autres: Assurément cet homme est un meurtrier, puisque la Justice n’a pas voulu le laisser vivre, après qu’il a été sauvé de la mer."],[5,"Paul secoua l’animal dans le feu, et ne ressentit aucun mal."],[6,"Ces gens s’attendaient à le voir enfler ou tomber mort subitement; mais, après avoir longtemps attendu, voyant qu’il ne lui arrivait aucun mal, ils changèrent d’avis et dirent que c’était un dieu."]],"Actes 28:12":[[12,"Ayant abordé à Syracuse, nous y restâmes trois jours."]],"Actes 28:13":[[13,"De là, en suivant la côte, nous atteignîmes Reggio; et, le vent du midi s’étant levé le lendemain, nous fîmes en deux jours le trajet jusqu’à Pouzzoles,"]],"Actes 28:13-14":[[13,"De là, en suivant la côte, nous atteignîmes Reggio; et, le vent du midi s’étant levé le lendemain, nous fîmes en deux jours le trajet jusqu’à Pouzzoles,"],[14,"où nous trouvâmes des frères qui nous prièrent de passer sept jours avec eux. Et c’est ainsi que nous allâmes à Rome."]],"Actes 28:30-31":[[30,"Paul demeura deux ans entiers dans une maison qu’il avait louée. Il recevait tous ceux qui venaient le voir,"],[31,"prêchant le royaume de Dieu et enseignant ce qui concerne le Seigneur Jésus-Christ, en toute liberté et sans obstacle."]],"Matthieu 14:10-13":[[10,"et il envoya décapiter Jean dans la prison."],[11,"Sa tête fut apportée sur un plat, et donnée à la jeune fille, qui la porta à sa mère."],[12,"Les disciples de Jean vinrent prendre son corps, et l’ensevelirent. Et ils allèrent l’annoncer à Jésus."],[13,"A cette nouvelle, Jésus partit de là dans une barque, pour se retirer à l’écart dans un lieu désert; et la foule, l’ayant su, sortit des villes et le suivit à pied."]],"Exode 12:40":[[40,"Le séjour des enfants d’Israël en Égypte fut de quatre cent trente ans."]]};CHRONO.books=["Genèse","Exode","Lévitique","Nombres","Deutéronome","Josué","Juges","Ruth","1 Samuel","2 Samuel","1 Rois","2 Rois","1 Chroniques","2 Chroniques","Esdras","Néhémie","Esther","Job","Psaume","Psaumes","Proverbes","Ecclésiaste","Ésaïe","Jérémie","Lamentations","Ézéchiel","Daniel","Osée","Joël","Amos","Abdias","Jonas","Michée","Nahum","Habakuk","Sophonie","Aggée","Zacharie","Malachie","Matthieu","Marc","Luc","Jean","Actes","Romains","1 Corinthiens","2 Corinthiens","Galates","Éphésiens","Philippiens","Colossiens","1 Thessaloniciens","2 Thessaloniciens","1 Timothée","2 Timothée","Tite","Philémon","Hébreux","Jacques","1 Pierre","2 Pierre","1 Jean","2 Jean","3 Jean","Jude","Apocalypse"];

<script>
/* Étude chronologique et carte — application */
(function () {

var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };

var nf = function (n) { return Math.round(n).toLocaleString('fr-FR'); };
var fy = function (y) { return nf(Math.abs(y)) + (y < 0 ? ' av. J.-C.' : ' ap. J.-C.'); };
var store = { get: function (k, d) { try { var v = localStorage.getItem('chrono:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set: function (k, v) { try { localStorage.setItem('chrono:' + k, JSON.stringify(v)); } catch (e) {} } };

});

var theme = function () { return root.dataset.theme; };

(function () {
  var css = '';
  C.groups.forEach(function (g) { css += 'html[data-theme="dark"] .g-' + g.id + '{--c:' + g.c[0] + '}html[data-theme="light"] .g-' + g.id + '{--c:' + g.c[1] + '}'; });
  var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
})();

/* ---------- icônes ---------- */
var ICONS = {
  home: '<path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',

  people: '<circle cx="8" cy="9" r="3"/><circle cx="16.5" cy="9" r="3"/><path d="M2.5 20c.8-3.2 3-5 5.5-5s4.7 1.8 5.5 5M11 20c.8-3.2 3-5 5.5-5s4.6 1.8 5.4 5"/>',
  crown: '<path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/><path d="M5 22h14"/>',
  star: '<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/>',
  map: '<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  fit: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  play: '<path d="M7 4.5v15l12-7.5z" fill="currentColor"/>',
  pause: '<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  prev: '<path d="M15 6l-6 6 6 6"/>', next: '<path d="M9 6l6 6-6 6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', minus: '<path d="M5 12h14"/>'
};
var svg = function (n) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[n] + '</svg>'; };

/* ---------- références bibliques ---------- */
var BOOKRE = new RegExp('(' + C.books.slice().sort(function (a, b) { return b.length - a.length; }).map(function (b) { return b.replace(/ /g, '\\s'); }).join('|') + ')\\s(\\d+):(\\d+)(?:-(\\d+))?', 'g');
function refKey(b, ch, a, z) { return b.replace(/\s/g, ' ') + ' ' + ch + ':' + a + (z ? '-' + z : ''); }
function linkify(s) { return esc(s).replace(BOOKRE, function (m, b, ch, a, z) { var k = refKey(b, ch, a, z); return C.verses[k] ? '<button type="button" class="ref" data-ref="' + esc(k) + '">' + m + '</button>' : m; }); }
function refChips(refs) { return '<div class="chips">' + (refs || []).map(function (r) { return C.verses[r] ? '<button type="button" class="refchip" data-ref="' + esc(r) + '">' + esc(r) + '</button>' : '<span class="refchip">' + esc(r) + '</span>'; }).join('') + '</div>'; }
function verseText(ref) { var v = C.verses[ref]; return v ? v.map(function (x) { return x[1]; }).join(' ') : ''; }
function pchip(id, extra) { var p = BY[id]; if (!p) return ''; return '<button type="button" class="chip g-' + p.g + '" data-person="' + p.id + '"><i class="dot"></i>' + esc(p.n) + (extra || '') + '</button>'; }

/* ---------- utilitaires d'interface ---------- */
var toastT;
function toast(msg) { var t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('on'); }, 2600); }
function setEra(c) { root.style.setProperty('--era', c); }
// transition de page, avec repli si le navigateur ne dessine pas (onglet caché…)
function safeVT(fn) { var ran = false, run = function () { if (!ran) { ran = true; fn(); } }, t = document.startViewTransition(run); vtCatch(t); setTimeout(function () { if (!ran) { try { t.skipTransition(); } catch (e) {} run(); } }, 600); return t; }
function vtCatch(t) { if (!t) return; [t.ready, t.finished, t.updateCallbackDone].forEach(function (p) { if (p) p.catch(function () {}); }); }
var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); if (e.target._onin) e.target._onin(); io.unobserve(e.target); } }); }, { threshold: .12, rootMargin: '0px 0px -40px 0px' });
function observe(scope) { $$('.reveal:not(.in), .lineage:not(.in), .divided:not(.in), .unite:not(.in), [data-count]:not(.in), .arcbox:not(.in)', scope).forEach(function (el) { io.observe(el); }); }
function countUp(el) { var n = +el.dataset.count, t0 = performance.now(), D = 1600; (function f(t) { var q = Math.min(1, (t - t0) / D); el.textContent = nf(n * easeOut(q)); if (q < 1) requestAnimationFrame(f); })(t0); }
document.addEventListener('pointermove', function (e) { var el = e.target.closest && e.target.closest('.spec'); if (!el) return; var r = el.getBoundingClientRect(); el.style.setProperty('--mx', (e.clientX - r.left) + 'px'); el.style.setProperty('--my', (e.clientY - r.top) + 'px'); }, { passive: true });

/* ---------- popup verset ---------- */
var vp = $('#verse'), scrimEl = $('#scrim');
function showVerse(ref) {
  var v = C.verses[ref];
  vp.innerHTML = '<button class="iconbtn x" type="button" aria-label="Fermer" data-close-verse>✕</button><span class="src">Louis Segond 1910</span><h4>' + esc(ref) + '</h4><p>' + (v ? v.map(function (x) { return '<sup>' + x[0] + '</sup>' + esc(x[1]); }).join(' ') : 'Texte non disponible.') + '</p>';
  vp.classList.add('on'); scrimSync();
}
function closeVerse() { vp.classList.remove('on'); scrimSync(); }
function scrimSync() { scrimEl.classList.toggle('on', vp.classList.contains('on') || (drawerOpen && innerWidth <= 900 && !(innerHeight <= 520 && innerWidth > innerHeight))); }
scrimEl.addEventListener('click', function () { if (vp.classList.contains('on')) closeVerse(); else closeDrawer(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if (vp.classList.contains('on')) closeVerse(); else if (drawerOpen) closeDrawer(); } });

/* ---------- délégation des clics ---------- */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-ref],[data-person],[data-go],[data-route],[data-prophecy],[data-close-verse]');
  if (!t) return;
  if (t.hasAttribute('data-close-verse')) return closeVerse();
  if (t.dataset.ref) { e.preventDefault(); return showVerse(t.dataset.ref); }
  if (t.dataset.person) { e.preventDefault(); return openPerson(t.dataset.person, t); }
  if (t.dataset.go) { e.preventDefault(); var r = t.getBoundingClientRect(); root.style.setProperty('--vx', (r.left + r.width / 2) + 'px'); root.style.setProperty('--vy', (r.top + r.height / 2) + 'px'); return go(t.dataset.go, t.dataset.arg); }
  if (t.dataset.route) { e.preventDefault(); closeDrawer(); return go('carte', t.dataset.route); }
  if (t.dataset.prophecy) { e.preventDefault(); closeDrawer(); return go('propheties', t.dataset.prophecy); }
});

/* ---------- tiroir (fiche) ---------- */
var drawer = $('#drawer'), drawerIn = $('#drawerIn'), drawerOpen = false, drawerLeft = false, drawerT = 0;
// fiche sur le côté (PC, tablette en paysage, téléphone en paysage) ; en portrait, elle monte du bas
var sideMode = function () { return innerWidth > 900 || (innerHeight <= 520 && innerWidth > innerHeight); };
function openDrawer(html, left) {
  left = !!left; clearTimeout(drawerT);
  var put = function () {
    drawerIn.innerHTML = html; drawerIn.scrollTop = 0;
    if (drawer.classList.contains('left') !== left) { drawer.style.transition = 'none'; drawer.classList.remove('on'); drawer.classList.toggle('left', left); void drawer.offsetWidth; drawer.style.transition = ''; }
    drawer.style.removeProperty('--dy'); drawer.classList.add('on'); drawer.setAttribute('aria-hidden', 'false'); scrimSync();
  };
  var swap = drawerOpen && drawerLeft !== left && sideMode();
  drawerOpen = true; drawerLeft = left;
  if (swap) { drawer.classList.remove('on'); drawerT = setTimeout(put, 380); } else put();
}
function closeDrawer(silent) {
  if (!drawerOpen) return; clearTimeout(drawerT); drawer.classList.remove('on'); drawer.setAttribute('aria-hidden', 'true'); drawerOpen = false; scrimSync();
  if (!silent && TL.sel) TL.select(null);
}
$('#drawerX').addEventListener('click', function () { closeDrawer(); });
(function () { // glisser vers le bas pour fermer (mobile)
